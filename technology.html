<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Technology</title>

    <script>
        if (
            localStorage.getItem("darkMode") === "true"
        ) {
            document.documentElement.classList.add("darkMode");
        }
    </script>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <a
        href="index.html"
        class="backButton"
        aria-label="Back"
    >
        ↶
    </a>


    <button
        id="settingsButton"
        class="settingsButton"
        aria-label="Settings"
    >
        ⚙
    </button>



    <main class="container technologyPage">

        <div class="subjectHeading">

            <div
                class="subjectEyebrow"
                id="technologyEyebrow"
            >
                Mid-Day
            </div>

            <h1 id="technologyTitle">
                Technology
            </h1>

        </div>


        <h2 id="technologyChoose">
            Choose a technology topic.
        </h2>


        <div class="technologyTopicGrid">

            <a
                href="programming.html"
                class="technologyTopicCard"
            >

                <div class="technologyTopicIcon">
                    &lt;/&gt;
                </div>

                <h3 id="programmingCardTitle">
                    Programming
                </h3>

                <p id="programmingCardDescription">
                    Learn by writing code and controlling your own little worlds.
                </p>

            </a>

        </div>

    </main>



    <script src="user.js"></script>
    <script src="language.js"></script>
    <script src="theme.js"></script>
    <script src="settings.js"></script>
    <script src="technologyData.js"></script>


    <script>

        function updateTechnologyLanguage() {

            const language =
                localStorage.getItem(
                    "siteLanguage"
                ) ||
                "en";


            document.getElementById(
                "technologyTitle"
            ).textContent =
                technologyUI[
                    language
                ].technology;


            document.getElementById(
                "technologyChoose"
            ).textContent =
                language === "pt-BR"
                    ? "Escolha um tema de tecnologia."
                    : "Choose a technology topic.";


            document.getElementById(
                "programmingCardTitle"
            ).textContent =
                technologyUI[
                    language
                ].programming;


            document.getElementById(
                "programmingCardDescription"
            ).textContent =
                language === "pt-BR"
                    ? "Aprenda escrevendo código e controlando seus próprios pequenos mundos."
                    : "Learn by writing code and controlling your own little worlds.";

        }


        updateTechnologyLanguage();


        window.addEventListener(
            "languageChanged",
            updateTechnologyLanguage
        );

    </script>


</body>

</html>

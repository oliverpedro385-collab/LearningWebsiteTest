<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Programming</title>

    <script>
        if (
            localStorage.getItem("darkMode") === "true"
        ) {
            document.documentElement.classList.add("darkMode");
        }
    </script>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <a
        href="technology.html"
        class="backButton"
        aria-label="Back"
    >
        ↶
    </a>


    <button
        id="settingsButton"
        class="settingsButton"
        aria-label="Settings"
    >
        ⚙
    </button>



    <main class="container technologyPage">


        <div class="subjectHeading">

            <div
                class="subjectEyebrow"
                id="programmingEyebrow"
            >
                Technology
            </div>

            <h1 id="programmingTitle">
                Programming
            </h1>

        </div>


        <h2 id="programmingChoose">
            Choose a programming path.
        </h2>


        <div class="technologyTopicGrid">


            <a
                href="programmingLanguages.html"
                class="technologyTopicCard"
            >

                <div class="technologyTopicIcon">
                    { }
                </div>


                <h3 id="languagesTitle">
                    Programming Languages
                </h3>


                <p id="languagesDescription">
                    Choose the language you want to learn.
                </p>

            </a>


        </div>


    </main>



    <script src="user.js"></script>
    <script src="language.js"></script>
    <script src="theme.js"></script>
    <script src="settings.js"></script>
    <script src="technologyData.js"></script>


    <script>

        function updateProgrammingLanguage() {

            const language =
                localStorage.getItem(
                    "siteLanguage"
                ) ||
                "en";


            document.getElementById(
                "programmingTitle"
            ).textContent =
                technologyUI[
                    language
                ].programming;


            document.getElementById(
                "programmingEyebrow"
            ).textContent =
                technologyUI[
                    language
                ].technology;


            document.getElementById(
                "programmingChoose"
            ).textContent =
                language === "pt-BR"
                    ? "Escolha um caminho de programação."
                    : "Choose a programming path.";


            document.getElementById(
                "languagesTitle"
            ).textContent =
                technologyUI[
                    language
                ].programmingLanguages;


            document.getElementById(
                "languagesDescription"
            ).textContent =
                language === "pt-BR"
                    ? "Escolha a linguagem que você quer aprender."
                    : "Choose the language you want to learn.";

        }


        updateProgrammingLanguage();


        window.addEventListener(
            "languageChanged",
            updateProgrammingLanguage
        );

    </script>


</body>

</html>

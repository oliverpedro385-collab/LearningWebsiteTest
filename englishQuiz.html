<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>English Quiz</title>

    <script>
        if (
            localStorage.getItem("darkMode") === "true"
        ) {
            document.documentElement.classList.add(
                "darkMode"
            );
        }
    </script>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <a
        href="english.html"
        class="backButton"
    >
        ↶
    </a>

    <button
        id="settingsButton"
        class="settingsButton"
    >
        <span id="settingsIcon">⚙</span>
    </button>

    <div class="container">

        <!--
            The English quiz handles its own translations.
            The general site translator should leave this entire
            section alone.
        -->
        <div
            id="quizContainer"
            class="notranslate"
            translate="no"
        >

            <div class="quizProgress">

                <div
                    id="progressText"
                    class="quizProgressText notranslate"
                    translate="no"
                >
                    Question 1 of 10
                </div>

                <div class="quizProgressBar">

                    <div
                        id="quizProgressFill"
                        class="quizProgressFill"
                    ></div>

                </div>

            </div>


            <h2
                id="gradeLabel"
                class="notranslate"
                translate="no"
            >
                English • Grade 1
            </h2>


            <h1
                id="question"
                class="notranslate"
                translate="no"
            >
                Loading...
            </h1>


            <div
                id="answers"
                class="answers notranslate"
                translate="no"
            ></div>


            <div
                id="result"
                class="quizResult notranslate"
                translate="no"
            ></div>


            <div class="hintAssistant">

                <div
                    id="assistantFace"
                    class="assistantFace"
                >
                    :)
                </div>


                <div class="assistantContent">

                    <strong
                        id="hintTitle"
                        class="notranslate"
                        translate="no"
                    >
                        Hint
                    </strong>


                    <p
                        id="hintText"
                        class="hintText notranslate"
                        translate="no"
                    >
                        I'm here to help!
                    </p>


                    <button
                        id="hintButton"
                        class="hintButton notranslate"
                        translate="no"
                        type="button"
                    >
                        Show Hint
                    </button>

                </div>

            </div>


            <button
                id="nextButton"
                class="nextButton notranslate"
                translate="no"
                type="button"
            >
                Next Question
            </button>

        </div>

    </div>


    <script src="user.js"></script>
    <script src="language.js"></script>
    <script src="theme.js"></script>
    <script src="settings.js"></script>
    <script src="englishQuestions.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <!-- Prevent dark mode flash -->

    <script>
        if (
            localStorage.getItem(
                "darkMode"
            ) === "true"
        ) {
            document.documentElement.classList.add(
                "darkMode"
            );
        }
    </script>


    <link
        rel="stylesheet"
        href="style.css"
    >


    <title>
        My Learning Website
    </title>

</head>


<body>


    <!-- SETTINGS -->

    <button
        id="settingsButton"
        class="settingsButton"
    >

        <span id="settingsIcon">
            ⚙
        </span>

    </button>



    <!-- USERNAME SETUP -->

    <div
        id="usernameOverlay"
        class="usernameOverlay"
    >

        <div class="usernameBox">

            <h1 data-i18n="welcome">
                Welcome
            </h1>


            <p
                data-i18n="whatShouldWeCallYou"
            >
                What should we call you?
            </p>


            <input
                type="text"
                id="usernameInput"
                data-i18n-placeholder="enterYourName"
                placeholder="Enter your name"
                maxlength="20"
            >


            <button
                id="usernameButton"
                data-i18n="continue"
            >
                Continue
            </button>


            <p id="usernameError"></p>

        </div>

    </div>



    <!-- MAIN MENU -->

    <div class="container">

        <h1>

            <span data-i18n="welcome">
                Welcome
            </span>

            ,

            <span id="studentName">
                Student
            </span>

            !

        </h1>


        <p
            data-i18n="chooseSubject"
        >
            Choose a subject to start learning.
        </p>


        <div class="subjectContainer">


            <a
                href="math.html"
                class="subjectButton"
                data-i18n="math"
            >
                Math
            </a>


            <a
                href="#"
                class="subjectButton"
                data-i18n="english"
                onclick="return false;"
            >
                English
            </a>


            <a
                href="#"
                class="subjectButton"
                data-i18n="science"
                onclick="return false;"
            >
                Science
            </a>


            <a
                href="#"
                class="subjectButton"
                data-i18n="history"
                onclick="return false;"
            >
                History
            </a>


        </div>

    </div>



    <!-- LIBRARY -->

    <section class="librarySection">


        <h2 data-i18n="library">
            Library
        </h2>


        <p
            data-i18n="libraryDescription"
        >
            Read about different topics and subjects.
        </p>


        <div
            id="libraryBooks"
            class="libraryBooks"
        ></div>


    </section>



    <!-- LIBRARY BOOK -->

    <div
        id="libraryOverlay"
        class="libraryOverlay"
    >

        <div
            id="libraryBook"
            class="libraryBook"
        >


            <button
                id="closeLibrary"
                class="closeLibrary"
            >
                ×
            </button>



            <div
                class="bookPage bookLeft"
            >

                <div class="bookDecor">

                    <span id="libraryIcon">
                        📖
                    </span>

                </div>


                <h2 id="libraryTitle">
                    Book Title
                </h2>


                <div
                    class="bookLines"
                ></div>

            </div>



            <div
                class="bookPage bookRight"
            >

                <p
                    id="libraryContent"
                >
                    Book content goes here.
                </p>

            </div>


        </div>

    </div>



    <!-- SCRIPTS -->

    <script src="user.js"></script>

    <script src="language.js"></script>


    <script>

        const usernameOverlay =
            document.getElementById(
                "usernameOverlay"
            );


        const usernameInput =
            document.getElementById(
                "usernameInput"
            );


        const usernameButton =
            document.getElementById(
                "usernameButton"
            );


        const usernameError =
            document.getElementById(
                "usernameError"
            );


        const studentName =
            document.getElementById(
                "studentName"
            );


        function loadUsername() {

            const username =
                getUsername();


            if (username) {

                studentName.textContent =
                    username;

                usernameOverlay.style.display =
                    "none";

            } else {

                usernameOverlay.style.display =
                    "flex";
            }
        }


        usernameButton.addEventListener(
            "click",
            function() {

                const username =
                    usernameInput.value.trim();


                if (username === "") {

                    usernameError.textContent =
                        t("pleaseEnterName");

                    usernameError.style.color =
                        "red";

                    return;
                }


                setUsername(
                    username
                );


                studentName.textContent =
                    username;


                usernameOverlay.style.display =
                    "none";
            }
        );


        usernameInput.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    usernameButton.click();
                }
            }
        );


        loadUsername();

    </script>


    <script src="theme.js"></script>

    <script src="settings.js"></script>

    <script src="library.js"></script>


</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Quiz de Ciências</title>


    <script>
        if (localStorage.getItem("darkMode") === "true") {
            document.documentElement.classList.add("darkMode");
        }
    </script>


    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <a
        href="science.html"
        class="backButton"
    >
        ↶
    </a>


    <button
        id="settingsButton"
        class="settingsButton"
    >
        <span id="settingsIcon">⚙</span>
    </button>


    <div class="container">

        <div
            id="quizContainer"
            class="notranslate"
            translate="no"
        >

            <div class="quizProgress">

                <div
                    id="progressText"
                    class="quizProgressText"
                >
                    Questão 1 de 10
                </div>


                <div class="quizProgressBar">

                    <div
                        id="quizProgressFill"
                        class="quizProgressFill"
                    ></div>

                </div>

            </div>


            <h2
                id="gradeLabel"
                class="notranslate"
                translate="no"
            >
                Ciências • Ano 1
            </h2>


            <h1
                id="question"
                class="notranslate"
                translate="no"
            >
                Carregando...
            </h1>


            <div
                id="answers"
                class="answers notranslate"
                translate="no"
            ></div>


            <div
                id="result"
                class="quizResult notranslate"
                translate="no"
            ></div>


            <div class="hintAssistant">

                <div
                    id="assistantFace"
                    class="assistantFace"
                >
                    :)
                </div>


                <div class="assistantContent">

                    <strong id="hintTitle">
                        Dica
                    </strong>


                    <p
                        id="hintText"
                        class="hintText"
                    >
                        Estou aqui para ajudar!
                    </p>


                    <button
                        id="hintButton"
                        class="hintButton"
                        type="button"
                    >
                        Mostrar Dica
                    </button>

                </div>

            </div>


            <button
                id="nextButton"
                class="nextButton"
                type="button"
            >
                Próxima Questão
            </button>

        </div>

    </div>


    <script src="user.js"></script>
    <script src="language.js"></script>
    <script src="theme.js"></script>
    <script src="settings.js"></script>
    <script src="scienceQuestions.js"></script>

</body>

</html>

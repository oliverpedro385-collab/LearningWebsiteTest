                            []
                        ).includes(
                            destination
                        );


                    if (
                        valid

                        output.textContent =
                            `⚡ ${source} → ${destination}`;

                            t(
                                "That combination does not make much sense as the main transformation.",

                            );

                    [150,250,350];


                const orbitRings =
                    [];


                orbitSizes.forEach(
                    size => {

                        const ring =
                            document.createElement(
                                "div"
                            );

                        ring.className =
                            "orbitRing";


                        ring.style.width =
                            `${size}px`;


                        ring.style.height =
                            `${size *
                            .55}px`;


                        scene.appendChild(
                            ring
                        );


                        orbitRings.push(
                            ring
                        );

                    }
                );


                const planet =
                    document.createElement(
                        "div"
                    );

                planet.className =
                    "orbitPlanet";


                scene.appendChild(
                    planet
                );


                const speed =
                    makeRange(
                        t(
                            "Orbit speed",
                            "Velocidade orbital"
                        ),
                        0,
                        100,
                        difficulty.id === "easy"
                            ? 18
                            : 45
                    );


                panel.append(
                    scene,
                    speed.row
                );


                root.appendChild(
                    panel
                );


                let angle =
                    0;


                let last =
                    performance.now();


                function animate(
                    now
                ) {

                    const delta =
                        (
                            now -
                            last
                        ) /
                        1000;


                    last =
                        now;


                    angle +=
                        delta *
                        (
                            Number(
                                speed.input.value
                            ) /
                            80
                        );


                    const radiusX =
                        175;


                    const radiusY =
                        95;


                    const x =
                        Math.cos(
                            angle
                        ) *
                        radiusX;


                    const y =
                        Math.sin(
                            angle
                        ) *
                        radiusY;


                    planet.style.left =
                        `calc(50% + ${x}px)`;


                    planet.style.top =
                        `calc(50% + ${y}px)`;


                    planet.style.transform =
                        "translate(-50%,-50%)";


                    requestAnimationFrame(
                        animate
                    );

                }


                requestAnimationFrame(
                    animate
                );

            }

                        9.8,
                        1
                    );


                panel.appendChild(
                    gravity.row
                );


                const jumpButton =
                    makeButton(

                    createStatus(

                panel.appendChild(
                    jumpButton

                root.appendChild(

                let jumping =
                    false;


                jumpButton.addEventListener(
                    "click",
                    () => {

                        if (
                            jumping
                        ) {
                            return;
                        }


                        jumping =
                            true;


                        const g =
                            Number(
                                gravity.input.value
                            );


                        const strength =
                            Math.max(
                                65,
                                620 /
                                g
                            );


                        const start =
                            performance.now();


                        function animate(
                            now
                        ) {

                            const tValue =
                                (
                                    now -
                                    start
                                ) /
                                1000;


                            const y =
                                (
                                    strength *
                                    1.4 *
                                    tValue
                                ) -
                                (
                                    .5 *
                                    g *
                                    36 *
                                    tValue *
                                    tValue
                                );


                            if (
                                y <=
                                0 &&
                                tValue >
                                .05
                            ) {

                                ball.style.bottom =
                                    "58px";


                                jumping =
                                    false;


                                status.textContent =
                                    t(
                                        `Jump complete under ${g.toFixed(1)} gravity.`,
                                        `Salto completo com gravidade ${g.toFixed(1)}.`
                                    );


                                return;

                            }


                            ball.style.bottom =
                                `${58 + Math.max(
                                    0,
                                    y
                                )}px`;


                            requestAnimationFrame(
                                animate
                            );

                        }


                        requestAnimationFrame(
                            animate
                        );

                    }
                );

            }

                        t(
                            "Change temperature and luminosity to create different-looking stars.",
                            "Mude a temperatura e a luminosidade para criar estrelas com aparências diferentes."
                        )
                    );


                const scene =
                    document.createElement(
                        "div"
                    );

                scene.className =
                    "starLab";


                const star =
                    document.createElement(
                        "div"
                    );

                star.className =
                    "starObject";


                scene.appendChild(
                    star
                );


                const temperature =
                    makeRange(
                        t(
                            "Temperature",
                            "Temperatura"
                        ),
                        2500,
                        15000,
                        5500
                    );


                const luminosity =
                    makeRange(
                        t(
                            "Luminosity",
                            "Luminosidade"
                        ),
                        20,
                        100,
                        50
                    );


                const result =
                    createStatus(
                        panel
                    );


                panel.append(
                    scene,
                    temperature.row,
                    luminosity.row
                );


                root.appendChild(
                    panel
                );


                function update() {

                    const temp =
                        Number(
                            temperature.input.value
                        );


                    const light =
                        Number(
                            luminosity.input.value
                        );


                    let color;
                    let label;


                    if (
                        temp <
                        4000
                    ) {

                        color =
                            "#ff865f";

                        label =
                            t(
                                "Red star",
                                "Estrela vermelha"
                            );

                    } else if (
                        temp <
                        7000
                    ) {

                        color =
                            "#ffd86b";

                        label =
                            t(
                                "Yellow-white star",
                                "Estrela branco-amarelada"
                            );

                    } else {

                        color =
                            "#a8c9ff";

                        label =
                            t(
                                "Blue star",
                                "Estrela azul"
                            );

                    }


                    star.style.backgroundColor =
                        color;


                    const size =
                        80 +
                        light *
                        .75;


                    star.style.width =
                        `${size}px`;


                    star.style.height =
                        `${size}px`;


                    star.style.boxShadow =
                        `0 0 ${
                            25 +
                            light *
                            .45
                        }px ${color}99`;


                    result.textContent =
                        `${label} • ${temp} K`;

                }


                temperature.input.addEventListener(
                    "input",
                    update
                );


                luminosity.input.addEventListener(
                    "input",
                    update
                );


                update();

            }


            /* =================================================
               SPACE EXPLORATION
               ================================================= */


            function buildSpaceLab(
                root
            ) {

                const panel =
                    createPanel(
                        t(
                            "Rocket Launch",
                            "Lançamento de Foguete"
                        ),
                        t(
                            "Balance thrust and fuel to push the rocket upward.",
                            "Equilibre impulso e combustível para empurrar o foguete para cima."
                        )
                    );


                const scene =
                    document.createElement(
                        "div"
                    );

                scene.className =
                    "rocketScene";


                const stars =
                    document.createElement(
                        "div"
                    );

                stars.className =
                    "rocketStars";


                const rocket =
                    document.createElement(
                        "div"
                    );

                rocket.className =
                    "rocketBody";


                const flame =
                    document.createElement(
                        "div"
                    );

                flame.className =
                    "rocketFlame";


                rocket.appendChild(
                    flame
                );


                scene.append(
                    stars,
                    rocket
                );


                const fuel =
                    makeRange(
                        t(
                            "Fuel",
                            "Combustível"
                        ),
                        0,
                        100,
                        65
                    );


                const thrust =
                    makeRange(
                        t(
                            "Thrust",
                            "Impulso"
                        ),
                        0,
                        100,
                        60
                    );


                const launch =
                    makeButton(
                        t(
                            "Launch",
                            "Lançar"
                        )
                    );


                const result =
                    createStatus(
                        panel
                    );


                panel.append(
                    scene,
                    fuel.row,
                    thrust.row,
                    launch
                );


                root.appendChild(
                    panel
                );


                let launching =
                    false;


                launch.addEventListener(
                    "click",
                    () => {

                        if (
                            launching
                        ) {
                            return;
                        }


                        launching =
                            true;


                        const initialFuel =
                            Number(
                                fuel.input.value
                            );


                        const thrustValue =
                            Number(
                                thrust.input.value
                            );


                        if (
                            initialFuel <
                            10 ||
                            thrustValue <
                            20
                        ) {

                            result.textContent =
                                t(
                                    "Not enough thrust or fuel for a useful launch.",
                                    "Não há impulso ou combustível suficiente para um lançamento útil."
                                );


                            launching =
                                false;


                            return;

                        }


                        const start =
                            performance.now();


                        function animate(
                            now
                        ) {

                            const seconds =
                                (
                                    now -
                                    start
                                ) /
                                1000;


                            const power =
                                (
                                    thrustValue *
                                    .9
                                ) +
                                (
                                    initialFuel *
                                    .25
                                );


                            const height =
                                Math.min(
                                    290,
                                    power *
                                    seconds *
                                    .9
                                );


                            rocket.style.transform =
                                `translate(
                                    -50%,
                                    -${height}px
                                )`;


                            flame.style.opacity =
                                "1";


                            flame.style.height =
                                `${
                                    25 +
                                    Math.random() *
                                    30
                                }px`;


                            if (
                                seconds <
                                5 &&
                                height <
                                285
                            ) {

                                requestAnimationFrame(
                                    animate
                                );

                            } else {

                                flame.style.opacity =
                                    "0";


                                launching =
                                    false;


                                result.textContent =
                                    t(
                                        `Launch reached about ${Math.round(height)} km in this simulation.`,
                                        `O lançamento chegou a cerca de ${Math.round(height)} km nesta simulação.`
                                    );

                            }

                        }


                        requestAnimationFrame(
                            animate
                        );

                    }
                );

            }


            window.addEventListener(
                "languageChanged",
                () => {

                    window.location.reload();

                }
            );


        })();

    </script>


    <script>

        const stars =
            document.querySelector(
                ".stars"
            );


        if (
            stars &&
            !stars.children.length
        ) {

            for (
                let i = 0;
                i < 45;
                i++
            ) {

                const star =
                    document.createElement(
                        "span"
                    );

                star.className =
                    "star";

                star.style.left =
                    `${Math.random() * 100}%`;

                star.style.top =
                    `${Math.random() * 100}%`;

                star.style.width =
                    `${1 + Math.random() * 2}px`;

                star.style.height =
                    star.style.width;

                stars.appendChild(
                    star
                );

            }

        }

    </script>

</body>
</html>

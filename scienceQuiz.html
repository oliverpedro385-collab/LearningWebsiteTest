                            ) {

                                item.vx *=
                                    -1;

                            }


                            if (
                                Math.abs(
                                    item.y -
                                    cy
                                ) >
                                ry - 25
                            ) {

                                item.vy *=
                                    -1;

                            }


                            let color =
                                "#65bf71";


                            if (
                                item.name ===
                                "Mitochondria"
                            ) {

                                color =
                                    "#e99b32";

                            } else if (
                                item.name ===
                                "Ribosomes"
                            ) {

                                color =
                                    "#9bc8da";

                            } else if (
                                item.name ===
                                "Vacuole"
                            ) {

                                color =
                                    "#75b5ca";

                            } else if (
                                item.name ===
                                "Chloroplast"
                            ) {

                                color =
                                    "#65bf71";

                            }


                            ctx.beginPath();

                            ctx.ellipse(
                                item.x,
                                item.y,
                                22,
                                11,
                                Math.atan2(
                                    item.vy,
                                    item.vx
                                ),
                                0,
                                Math.PI * 2
                            );


                            ctx.fillStyle =
                                color;


                            ctx.fill();

                        }
                    );


                    if (
                        selected.has(
                            "Ribosomes"
                        )
                    ) {

                        for (
                            let i = 0;
                            i < 18;
                            i++
                        ) {

                            const angle =
                                (
                                    i /
                                    18
                                ) *
                                Math.PI *
                                2;


                            const px =
                                cx +
                                Math.cos(angle) *
                                (
                                    rx *
                                    .72
                                );


                            const py =
                                cy +
                                Math.sin(angle) *
                                (
                                    ry *
                                    .72
                                );


                            ctx.beginPath();

                            ctx.arc(
                                px,
                                py,
                                2.3,
                                0,
                                Math.PI * 2
                            );


                            ctx.fillStyle =
                                "#c8dce4";


                            ctx.fill();

                        }

                    }

                }


                function animate() {

                    drawCell();


                    animationId =
                        requestAnimationFrame(
                            animate
                        );

                }


                function stop() {

                    cancelAnimationFrame(
                        animationId
                    );

                }


                new ResizeObserver(
                    resizeCanvas
                ).observe(
                    canvas
                );


                resetCell();
                resizeCanvas();
                animate();


                panel.dataset.cleanup =
                    "cell";

            }

                        ),

                        30
                    );


                const foxes =
                    makeRange(

                        ),

                    );


                const bars =

                        "div"
                    );

                bars.className =
                    "scienceInfoGrid";


                const labels = {

                    plants:
                        t(
                            "Plants",
                            "Plantas"
                        ),

                    herbivores:
                        t(
                            "Herbivores",
                            "Herbívoros"
                        ),

                    predators:
                        t(
                            "Predators",
                            "Predadores"
                        )

                };


                function bar(
                    name
                ) {

                    const box =
                        document.createElement(
                            "div"
                        );

                    box.className =
                        "scienceInfoBox";


                    box.innerHTML =
                        `
                            <strong>
                                ${labels[name]}
                            </strong>

                            <span>
                                0
                            </span>
                        `;


                    return box;

                }


                const plantBar =
                    bar(
                        "plants"
                    );


                const rabbitBar =
                    bar(
                        "herbivores"
                    );


                const foxBar =
                    bar(
                        "predators"
                    );


                bars.append(
                    plantBar,
                    rabbitBar,
                    foxBar
                );


                const run =
                    makeButton(
                        t(
                            "Run Ecosystem",
                            "Rodar Ecossistema"
                        )
                    );


                const reset =
                    document.createElement(
                        "button"
                    );

                reset.className =
                    "scienceResetButton";

                reset.textContent =
                    t(
                        "Reset",
                        "Reiniciar"
                    );


                const actions =
                    document.createElement(
                        "div"
                    );

                actions.className =
                    "scienceActionRow";


                actions.append(
                    run,
                    reset
                );


                panel.append(
                    grass.row,
                    rabbits.row,
                    foxes.row,
                    bars,
                    actions
                );


                root.appendChild(
                    panel
                );


                const status =
                    createStatus(
                        panel
                    );


                let timer =
                    null;


                function updateBars(
                    p,
                    r,
                    f
                ) {

                    plantBar.querySelector(
                        "span"
                    ).textContent =
                        Math.round(
                            p
                        );


                    rabbitBar.querySelector(
                        "span"
                    ).textContent =
                        Math.round(
                            r
                        );


                    foxBar.querySelector(
                        "span"
                    ).textContent =
                        Math.round(
                            f
                        );

                }


                function simulate() {

                    let p =
                        Number(
                            grass.input.value
                        );


                    let r =
                        Number(
                            rabbits.input.value
                        );


                    let f =
                        Number(
                            foxes.input.value
                        );


                    let steps =
                        0;


                    if (
                        timer
                    ) {
                        clearInterval(
                            timer
                        );
                    }


                    timer =
                        setInterval(
                            () => {

                                steps++;


                                p =
                                    Math.max(
                                        0,
                                        Math.min(
                                            100,
                                            p +
                                            7 -
                                            r * .05
                                        )
                                    );


                                r =
                                    Math.max(
                                        0,
                                        Math.min(
                                            100,
                                            r +
                                            p * .025 -
                                            f * .12 -
                                            1
                                        )
                                    );


                                f =
                                    Math.max(
                                        0,
                                        Math.min(
                                            60,
                                            f +
                                            r * .012 -
                                            1.2
                                        )
                                    );


                                updateBars(
                                    p,
                                    r,
                                    f
                                );


                                if (
                                    r >
                                    70
                                ) {

                                    status.textContent =
                                        t(
                                            "Too many herbivores are putting pressure on the plants.",
                                            "Há herbívoros demais pressionando as plantas."
                                        );

                                } else if (
                                    f >
                                    35
                                ) {

                                    status.textContent =
                                        t(
                                            "Predators are becoming very numerous.",
                                            "Os predadores estão ficando muito numerosos."
                                        );

                                } else {

                                    status.textContent =
                                        t(
                                            `Simulation step ${steps}.`,
                                            `Etapa ${steps} da simulação.`
                                        );

                                }


                                if (
                                    steps >=
                                    30
                                ) {

                                    clearInterval(
                                        timer
                                    );


                                    status.textContent =
                                        t(
                                            "Simulation paused. Change the starting populations and run it again.",
                                            "Simulação pausada. Mude as populações iniciais e rode novamente."
                                        );

                                }

                            },
                            250
                        );

                }


                run.addEventListener(
                    "click",
                    simulate
                );


                reset.addEventListener(
                    "click",
                    () => {

                        if (
                            timer
                        ) {

                            clearInterval(
                                timer
                            );

                        }


                        updateBars(
                            Number(
                                grass.input.value
                            ),
                            Number(
                                rabbits.input.value
                            ),
                            Number(
                                foxes.input.value
                            )
                        );


                        status.textContent =
                            t(
                                "Ecosystem reset.",
                                "Ecossistema reiniciado."
                            );

                    }
                );


                updateBars(
                    Number(
                        grass.input.value
                    ),
                    Number(
                        rabbits.input.value
                    ),
                    Number(
                        foxes.input.value
                    )
                );

            }

            /* =================================================

            function buildMatterLab(
                root
            ) {

                const panel =
                    createPanel(
                        t(
                            "Particle Matter Simulator",
                            "Simulador de Partículas da Matéria"
                        ),
                        t(
                            "Change temperature and watch the particles actually move differently.",
                            "Mude a temperatura e veja as partículas realmente se moverem de forma diferente."
                        )
                    );


                const scene =
                    document.createElement(
                        "div"
                    );

                scene.className =
                    "particleLab";


                const canvas =
                    document.createElement(
                        "canvas"
                    );

                canvas.width =
                    900;

                canvas.height =
                    460;

                canvas.className =
                    "particleCanvas";


                scene.appendChild(
                    canvas
                );


                const temp =
                    makeRange(
                        t(
                            "Temperature",
                            "Temperatura"
                        ),
                        -20,
                        180,
                        difficulty.id === "easy"
                            ? 20
                            : difficulty.id === "extreme"
                                ? 80
                                : 55
                    );


                const state =
                    document.createElement(
                        "div"
                    );


                state.className =
                    "scienceBigValue";


                panel.append(
                    scene,
                    state,
                    temp.row
                );


                root.appendChild(
                    panel
                );


                const ctx =
                    canvas.getContext(
                        "2d"
                    );


                let width =
                    canvas.width;


                let height =
                    canvas.height;


                const particles =
                    [];


                const particleCount =
                    difficulty.id === "easy"
                        ? 32
                        : difficulty.id === "medium"
                            ? 44
                            : difficulty.id === "hard"
                                ? 58
                                : difficulty.id === "difficult"
                                    ? 72
                                    : 86;


                for (
                    let i = 0;
                    i < particleCount;
                    i++
                ) {

                    particles.push({

                        x:
                            100 +
                            Math.random() *
                            700,

                        y:
                            80 +
                            Math.random() *
                            290,

                        vx:
                            (
                                Math.random() -
                                .5
                            ) *
                            1.5,

                        vy:
                            (
                                Math.random() -
                                .5
                            ) *
                            1.5

                    });

                }


                function currentState(
                    value
                ) {

                    if (
                        value <=
                        0
                    ) {

                        return "solid";

                    }

                    if (
                        value <
                        100
                    ) {

                        return "liquid";

                    }

                    return "gas";

                }


                function draw() {

                    const temperature =
                        Number(
                            temp.input.value
                        );


                    const mode =
                        currentState(
                            temperature
                        );


                    if (
                        mode ===
                        "solid"
                    ) {

                        state.textContent =
                            t(
                                "Solid",
                                "Sólido"
                            );

                    } else if (
                        mode ===
                        "liquid"
                    ) {

                        state.textContent =
                            t(
                                "Liquid",
                                "Líquido"
                            );

                    } else {

                        state.textContent =
                            t(
                                "Gas",
                                "Gas"
                            );

                    }


                    ctx.fillStyle =
                        "#151620";

                    ctx.fillRect(
                        0,
                        0,
                        width,
                        height
                    );


                    ctx.strokeStyle =
                        "rgba(255,255,255,.07)";

                    ctx.strokeRect(
                        25,
                        25,
                        width - 50,
                        height - 50
                    );


                    const speed =
                        mode === "solid"
                            ? .15
                            : mode === "liquid"
                                ? .65
                                : 1.55;


                    particles.forEach(
                        (
                            particle,
                            index
                        ) => {

                            if (
                                mode ===
                                "solid"
                            ) {

                                const cols =
                                    Math.ceil(
                                        Math.sqrt(
                                            particleCount
                                        )
                                    );


                                const rows =
                                    Math.ceil(
                                        particleCount /
                                        cols
                                    );


                                const spacingX =
                                    (
                                        width -
                                        180
                                    ) /
                                    cols;


                                const spacingY =
                                    (
                                        height -
                                        140
                                    ) /
                                    rows;


                                const targetX =
                                    90 +
                                    (
                                        index %
                                        cols
                                    ) *
                                    spacingX;


                                const targetY =
                                    75 +
                                    Math.floor(
                                        index /
                                        cols
                                    ) *
                                    spacingY;


                                particle.x +=
                                    (
                                        targetX -
                                        particle.x
                                    ) *
                                    .08;


                                particle.y +=
                                    (
                                        targetY -
                                        particle.y
                                    ) *
                                    .08;


                                particle.x +=
                                    (
                                        Math.random() -
                                        .5
                                    ) *
                                    .9;


                                particle.y +=
                                    (
                                        Math.random() -
                                        .5
                                    ) *
                                    .9;

                            } else {

                                particle.x +=
                                    particle.vx *
                                    speed;


                                particle.y +=
                                    particle.vy *
                                    speed;


                                if (
                                    mode ===
                                    "liquid"
                                ) {

                                    particle.vx +=
                                        (
                                            Math.random() -
                                            .5
                                        ) *
                                        .05;

                                    particle.vy +=
                                        (
                                            Math.random() -
                                            .5
                                        ) *
                                        .05;

                                } else {

                                    particle.vx +=
                                        (
                                            Math.random() -
                                            .5
                                        ) *
                                        .13;

                                    particle.vy +=
                                        (
                                            Math.random() -
                                            .5
                                        ) *
                                        .13;

                                }


                                const maxSpeed =
                                    mode ===
                                    "gas"
                                        ? 2.7
                                        : 1.5;


                                const currentSpeed =
                                    Math.sqrt(
                                        particle.vx *
                                        particle.vx +
                                        particle.vy *
                                        particle.vy
                                    );


                                if (
                                    currentSpeed >
                                    maxSpeed
                                ) {

                                    const factor =
                                        maxSpeed /
                                        currentSpeed;


                                    particle.vx *=
                                        factor;


                                    particle.vy *=
                                        factor;

                                }


                                if (
                                    particle.x <
                                    35
                                ) {

                                    particle.x =
                                        35;

                                    particle.vx =
                                        Math.abs(
                                            particle.vx
                                        );

                                }


                                if (
                                    particle.x >
                                    width -
                                    35
                                ) {

                                    particle.x =
                                        width -
                                        35;

                                    particle.vx =
                                        -Math.abs(
                                            particle.vx
                                        );

                                }


                                if (
                                    particle.y <
                                    35
                                ) {

                                    particle.y =
                                        35;

                                    particle.vy =
                                        Math.abs(
                                            particle.vy
                                        );

                                }


                                if (
                                    particle.y >
                                    height -
                                    35
                                ) {

                                    particle.y =
                                        height -
                                        35;

                                    particle.vy =
                                        -Math.abs(
                                            particle.vy
                                        );

                                }

                            }


                            ctx.beginPath();

                            ctx.arc(
                                particle.x,
                                particle.y,
                                7,
                                0,
                                Math.PI * 2
                            );


                            ctx.fillStyle =
                                mode ===
                                "gas"
                                    ? "#9fc7ec"
                                    : mode ===
                                        "liquid"
                                        ? "#6fc1e9"
                                        : "#d7aa64";


                            ctx.fill();

                        }
                    );

                }


                let animation =
                    0;


                function animate() {

                    draw();


                    animation =
                        requestAnimationFrame(
                            animate
                        );

                }


                temp.input.addEventListener(
                    "input",
                    draw
                );


                animate();


                panel.dataset.animation =
                    animation;

            }

            function buildForcesLab(
                root
            ) {

                const panel =
                    createPanel(

                        ),
                        t(
                            "Push the object and change friction to see how its movement responds.",
                            "Empurre o objeto e mude o atrito para ver como o movimento responde."
                        )
                    );


                const force =
                    makeRange(
                        t(
                            "Force",
                            "Força"
                        ),
                        0,
                        100,
                        60
                    );


                const friction =
                    makeRange(
                        t(
                            "Friction",
                            "Atrito"
                        ),
                        0,
                        100,
                        20
                    );


                const mass =
                    makeRange(
                        t(
                            "Mass",
                            "Massa"
                        ),
                        1,
                        10,
                        3
                    );


                const track =
                    document.createElement(
                        "div"
                    );

                track.className =
                    "forceTrack";


                const line =
                    document.createElement(
                        "div"
                    );

                line.className =
                    "forceLine";


                const object =
                    document.createElement(
                        "div"
                    );

                object.className =
                    "forceObject";


                track.append(
                    line,
                    object
                );


                panel.append(
                    track,
                    force.row,
                    friction.row,
                    mass.row
                );


                root.appendChild(
                    panel
                );


                const status =
                    createStatus(
                        panel
                    );


                let velocity =
                    0;


                let position =
                    20;


                let lastTime =
                    performance.now();


                function update(
                    now
                ) {

                    const delta =
                        Math.min(
                            .05,
                            (
                                now -
                                lastTime
                            ) /
                            1000
                        );


                    lastTime =
                        now;


                    const f =
                        Number(
                            force.input.value
                        );


                    const fr =
                        Number(
                            friction.input.value
                        );


                    const m =
                        Number(
                            mass.input.value
                        );


                    const acceleration =
                        (
                            f -
                            fr *
                            (
                                velocity >=
                                0
                                    ? 1
                                    : -1
                            )
                        ) /
                        m *
                        .28;


                    velocity +=
                        acceleration *
                        delta *
                        60;


                    velocity *=
                        .995;


                    position +=
                        velocity *
                        delta *
                        3;


                    if (
                        position >
                        track.clientWidth -
                        70
                    ) {

                        position =
                            track.clientWidth -
                            70;

                        velocity *=
                            -.55;

                    }


                    if (
                        position <
                        20
                    ) {

                        position =
                            20;

                        velocity =
                            0;

                    }


                    object.style.left =
                        `${position}px`;


                    const state =
                        Math.abs(
                            velocity
                        ) <
                        .05
                            ? t(
                                "Stopped",
                                "Parado"
                            )
                            : velocity >
                                0
                                ? t(
                                    "Moving right",
                                    "Movendo para a direita"
                                )
                                : t(
                                    "Moving left",
                                    "Movendo para a esquerda"
                                );


                    status.textContent =
                        `${state} • ${t(
                            "Speed",
                            "Velocidade"
                        )}: ${Math.abs(
                            velocity
                        ).toFixed(1)}`;


                    requestAnimationFrame(
                        update
                    );

                }


                requestAnimationFrame(
                    update
                );

            }

                            "Heat"

                    if (

                            t(

                                "Essa combinação não faz muito sentido como transformação principal."

                    "scienceBigValue";


                panel.append(
                    rock,
                    type,
                    heat.row,
                    pressure.row,
                    cooling.row
                );


                root.appendChild(
                    panel
                );


                function update() {

                    const h =
                        Number(
                            heat.input.value
                        );


                    const p =
                        Number(
                            pressure.input.value
                        );


                    const c =
                        Number(
                            cooling.input.value
                        );


                    let rockType;


                    if (
                        h >
                        75 &&
                        c >
                        65
                    ) {

                        rockType =
                            t(
                                "Igneous",
                                "Ígnea"
                            );


                        rock.style.background =
                            "#d47a4d";

                    } else if (
                        p >
                        65 &&
                        h >
                        35
                    ) {

                        rockType =
                            t(
                                "Metamorphic",
                                "Metamórfica"
                            );


                        rock.style.background =
                            "#756c82";

                        rock.style.transform =
                            "rotate(9deg) scale(1.05)";

                    } else {

                        rockType =
                            t(
                                "Sedimentary",
                                "Sedimentar"
                            );


                        rock.style.background =
                            "#907a63";

                        rock.style.transform =
                            "rotate(-3deg)";

                    }


                    type.textContent =
                        rockType;

                }


                [
                    heat,
                    pressure,
                    cooling
                ].forEach(
                    control =>
                        control.input.addEventListener(
                            "input",
                            update
                        )
                );


                update();

            }


            /* =================================================
               WATER CYCLE
               ================================================= */


            function buildWaterCycleLab(
                root
            ) {

                const panel =
                    createPanel(
                        t(
                            "Water Cycle Simulator",
                            "Simulador do Ciclo da Água"
                        ),
                        t(
                            "Click a stage and move one water drop through the cycle.",
                            "Clique em uma etapa e mova uma gota de água pelo ciclo."
                        )
                    );


                const scene =
                    document.createElement(
                        "div"
                    );

                scene.className =
                    "waterCycleScene";


                const lake =
                    document.createElement(
                        "div"
                    );

                lake.className =
                    "waterLake";


                const sun =
                    document.createElement(
                        "div"
                    );

                sun.className =
                    "waterCycleSun";


                const cloud =
                    document.createElement(
                        "div"
                    );

                cloud.className =
                    "waterCloud";


                const drop =
                    document.createElement(
                        "div"
                    );

                drop.className =
                    "waterDrop";


                scene.append(
                    lake,
                    sun,
                    cloud,
                    drop
                );


                const buttons =
                    document.createElement(
                        "div"
                    );

                buttons.className =
                    "waterStageButtons";


                const stages = [

                    "Evaporation",
                    "Condensation",
                    "Precipitation",
                    "Collection"

                ];


                let stageIndex =
                    0;


                const status =
                    createStatus(
                        panel
                    );


                stages.forEach(
                    (
                        stage,
                        index
                    ) => {

                        const button =
                            makeButton(
                                stage
                            );


                        button.addEventListener(
                            "click",
                            () => {

                                if (
                                    index ===
                                    stageIndex
                                ) {

                                    stageIndex++;


                                    drop.style.opacity =
                                        "1";


                                    if (
                                        index ===
                                        0
                                    ) {

                                        drop.style.left =
                                            "55%";

                                        drop.style.top =
                                            "55%";

                                    } else if (
                                        index ===
                                        1
                                    ) {

                                        drop.style.left =
                                            "50%";

                                        drop.style.top =
                                            "22%";

                                    } else if (
                                        index ===
                                        2
                                    ) {

                                        drop.style.left =
                                            "52%";

                                        drop.style.top =
                                            "62%";

                                    } else {

                                        drop.style.left =
                                            "30%";

                                        drop.style.top =
                                            "72%";

                                    }


                                    status.textContent =
                                        index ===
                                        3
                                            ? t(
                                                "Complete water cycle!",
                                                "Ciclo da água completo!"
                                            )
                                            : t(
                                                `${stage} complete.`,
                                                `${stage} concluída.`
                                            );

                                } else {

                                    status.textContent =
                                        t(
                                            "That is not the next stage yet.",
                                            "Essa ainda não é a próxima etapa."
                                        );

                                }

                            }
                        );


                        buttons.appendChild(
                            button
                        );

                    }
                );


                panel.append(
                    scene,
                    buttons
                );


                root.appendChild(
                    panel
                );

            }


            /* =================================================
               SOLAR SYSTEM
               ================================================= */


            function buildSolarSystemLab(
                root
            ) {

                const panel =
                    createPanel(
                        t(
                            "Orbit Playground",
                            "Playground de Órbitas"
                        ),
                        t(
                            "Control the orbital speed and watch the planet travel around the Sun.",
                            "Controle a velocidade orbital e veja o planeta viajar ao redor do Sol."
                        )
                    );


                const scene =
                    document.createElement(
                        "div"
                    );

                scene.className =
                    "spaceScene";


                for (
                    let i = 0;
                    i < 65;
                    i++
                ) {

                    const star =
                        document.createElement(
                            "div"
                        );

                    star.className =
                        "spaceStar";


                    star.style.left =
                        `${Math.random() * 100}%`;


                    star.style.top =
                        `${Math.random() * 100}%`;


                    star.style.opacity =
                        `${.3 + Math.random() * .7}`;


                    scene.appendChild(
                        star
                    );

                }


                const sun =
                    document.createElement(
                        "div"
                    );

                sun.className =
                    "solarSun";


                scene.appendChild(
                    sun
                );


                const orbitSizes =
                    [150,250,350];


                const orbitRings =
                    [];


                orbitSizes.forEach(
                    size => {

                        const ring =
                            document.createElement(
                                "div"
                            );

                        ring.className =
                            "orbitRing";


                        ring.style.width =
                            `${size}px`;


                        ring.style.height =
                            `${size *
                            .55}px`;


                        scene.appendChild(
                            ring
                        );


                        orbitRings.push(
                            ring
                        );

                    }
                );


                const planet =
                    document.createElement(
                        "div"
                    );

                planet.className =
                    "orbitPlanet";


                scene.appendChild(
                    planet
                );


                const speed =
                    makeRange(
                        t(
                            "Orbit speed",
                            "Velocidade orbital"
                        ),
                        0,
                        100,
                        difficulty.id === "easy"
                            ? 18
                            : 45
                    );


                panel.append(
                    scene,
                    speed.row
                );


                root.appendChild(
                    panel
                );


                let angle =
                    0;


                let last =
                    performance.now();


                function animate(
                    now
                ) {

                    const delta =
                        (
                            now -
                            last
                        ) /
                        1000;


                    last =
                        now;


                    angle +=
                        delta *
                        (
                            Number(
                                speed.input.value
                            ) /
                            80
                        );


                    const radiusX =
                        175;


                    const radiusY =
                        95;


                    const x =
                        Math.cos(
                            angle
                        ) *
                        radiusX;


                    const y =
                        Math.sin(
                            angle
                        ) *
                        radiusY;


                    planet.style.left =
                        `calc(50% + ${x}px)`;


                    planet.style.top =
                        `calc(50% + ${y}px)`;


                    planet.style.transform =
                        "translate(-50%,-50%)";


                    requestAnimationFrame(
                        animate
                    );

                }


                requestAnimationFrame(
                    animate
                );

            }


            /* =================================================
               GRAVITY
               ================================================= */


            function buildGravityLab(
                root
            ) {

                const panel =
                    createPanel(
                        t(
                            "Gravity Jump",
                            "Salto com Gravidade"
                        ),
                        t(
                            "Choose a world and see how the same jump changes.",
                            "Escolha um mundo e veja como o mesmo salto muda."
                        )
                    );


                const scene =
                    document.createElement(
                        "div"
                    );

                scene.className =
                    "gravityScene";


                const ground =
                    document.createElement(
                        "div"
                    );

                ground.className =
                    "gravityGround";


                const ball =
                    document.createElement(
                        "div"
                    );

                ball.className =
                    "gravityBall";


                scene.append(
                    ground,
                    ball
                );


                panel.appendChild(
                    scene
                );


                const gravity =
                    makeRange(
                        t(
                            "Gravity",
                            "Gravidade"
                        ),
                        .5,
                        25,
                        9.8,
                        1
                    );


                panel.appendChild(
                    gravity.row
                );


                const jumpButton =
                    makeButton(
                        t(
                            "Jump",
                            "Saltar"
                        )
                    );


                const status =
                    createStatus(
                        panel
                    );


                panel.appendChild(
                    jumpButton
                );


                root.appendChild(
                    panel
                );


                let jumping =
                    false;


                jumpButton.addEventListener(
                    "click",
                    () => {

                        if (
                            jumping
                        ) {
                            return;
                        }


                        jumping =
                            true;


                        const g =
                            Number(
                                gravity.input.value
                            );


                        const strength =
                            Math.max(
                                65,
                                620 /
                                g
                            );


                        const start =
                            performance.now();


                        function animate(
                            now
                        ) {

                            const tValue =
                                (
                                    now -
                                    start
                                ) /
                                1000;


                            const y =
                                (
                                    strength *
                                    1.4 *
                                    tValue
                                ) -
                                (
                                    .5 *
                                    g *
                                    36 *
                                    tValue *
                                    tValue
                                );


                            if (
                                y <=
                                0 &&
                                tValue >
                                .05
                            ) {

                                ball.style.bottom =
                                    "58px";


                                jumping =
                                    false;


                                status.textContent =
                                    t(
                                        `Jump complete under ${g.toFixed(1)} gravity.`,
                                        `Salto completo com gravidade ${g.toFixed(1)}.`
                                    );


                                return;

                            }


                            ball.style.bottom =
                                `${58 + Math.max(
                                    0,
                                    y
                                )}px`;


                            requestAnimationFrame(
                                animate
                            );

                        }


                        requestAnimationFrame(
                            animate
                        );

                    }
                );

            }


            /* =================================================
               STARS
               ================================================= */


            function buildStarsLab(
                root
            ) {

                const panel =
                    createPanel(
                        t(
                            "Star Lab",
                            "Laboratório de Estrelas"
                        ),
                        t(
                            "Change temperature and luminosity to create different-looking stars.",
                            "Mude a temperatura e a luminosidade para criar estrelas com aparências diferentes."
                        )
                    );


                const scene =
                    document.createElement(
                        "div"
                    );

                scene.className =
                    "starLab";


                const star =
                    document.createElement(
                        "div"
                    );

                star.className =
                    "starObject";


                scene.appendChild(
                    star
                );


                const temperature =
                    makeRange(
                        t(
                            "Temperature",
                            "Temperatura"
                        ),
                        2500,
                        15000,
                        5500
                    );


                const luminosity =
                    makeRange(
                        t(
                            "Luminosity",
                            "Luminosidade"
                        ),
                        20,
                        100,
                        50
                    );


                const result =
                    createStatus(
                        panel
                    );


                panel.append(
                    scene,
                    temperature.row,
                    luminosity.row
                );


                root.appendChild(
                    panel
                );


                function update() {

                    const temp =
                        Number(
                            temperature.input.value
                        );


                    const light =
                        Number(
                            luminosity.input.value
                        );


                    let color;
                    let label;


                    if (
                        temp <
                        4000
                    ) {

                        color =
                            "#ff865f";

                        label =
                            t(
                                "Red star",
                                "Estrela vermelha"
                            );

                    } else if (
                        temp <
                        7000
                    ) {

                        color =
                            "#ffd86b";

                        label =
                            t(
                                "Yellow-white star",
                                "Estrela branco-amarelada"
                            );

                    } else {

                        color =
                            "#a8c9ff";

                        label =
                            t(
                                "Blue star",
                                "Estrela azul"
                            );

                    }


                    star.style.backgroundColor =
                        color;


                    const size =
                        80 +
                        light *
                        .75;


                    star.style.width =
                        `${size}px`;


                    star.style.height =
                        `${size}px`;


                    star.style.boxShadow =
                        `0 0 ${
                            25 +
                            light *
                            .45
                        }px ${color}99`;


                    result.textContent =
                        `${label} • ${temp} K`;

                }


                temperature.input.addEventListener(
                    "input",
                    update
                );


                luminosity.input.addEventListener(
                    "input",
                    update
                );


                update();

            }


            /* =================================================
               SPACE EXPLORATION
               ================================================= */


            function buildSpaceLab(
                root
            ) {

                const panel =
                    createPanel(
                        t(
                            "Rocket Launch",
                            "Lançamento de Foguete"
                        ),
                        t(
                            "Balance thrust and fuel to push the rocket upward.",
                            "Equilibre impulso e combustível para empurrar o foguete para cima."
                        )
                    );


                const scene =
                    document.createElement(
                        "div"
                    );

                scene.className =
                    "rocketScene";


                const stars =
                    document.createElement(
                        "div"
                    );

                stars.className =
                    "rocketStars";


                const rocket =
                    document.createElement(
                        "div"
                    );

                rocket.className =
                    "rocketBody";


                const flame =
                    document.createElement(
                        "div"
                    );

                flame.className =
                    "rocketFlame";


                rocket.appendChild(
                    flame
                );


                scene.append(
                    stars,
                    rocket
                );


                const fuel =
                    makeRange(
                        t(
                            "Fuel",
                            "Combustível"
                        ),
                        0,
                        100,
                        65
                    );


                const thrust =
                    makeRange(
                        t(
                            "Thrust",
                            "Impulso"
                        ),
                        0,
                        100,
                        60
                    );


                const launch =
                    makeButton(
                        t(
                            "Launch",
                            "Lançar"
                        )
                    );


                const result =
                    createStatus(
                        panel
                    );


                panel.append(
                    scene,
                    fuel.row,
                    thrust.row,
                    launch
                );


                root.appendChild(
                    panel
                );


                let launching =
                    false;


                launch.addEventListener(
                    "click",
                    () => {

                        if (
                            launching
                        ) {
                            return;
                        }


                        launching =
                            true;


                        const initialFuel =
                            Number(
                                fuel.input.value
                            );


                        const thrustValue =
                            Number(
                                thrust.input.value
                            );


                        if (
                            initialFuel <
                            10 ||
                            thrustValue <
                            20
                        ) {

                            result.textContent =
                                t(
                                    "Not enough thrust or fuel for a useful launch.",
                                    "Não há impulso ou combustível suficiente para um lançamento útil."
                                );


                            launching =
                                false;


                            return;

                        }


                        const start =
                            performance.now();


                        function animate(
                            now
                        ) {

                            const seconds =
                                (
                                    now -
                                    start
                                ) /
                                1000;


                            const power =
                                (
                                    thrustValue *
                                    .9
                                ) +
                                (
                                    initialFuel *
                                    .25
                                );


                            const height =
                                Math.min(
                                    290,
                                    power *
                                    seconds *
                                    .9
                                );


                            rocket.style.transform =
                                `translate(
                                    -50%,
                                    -${height}px
                                )`;


                            flame.style.opacity =
                                "1";


                            flame.style.height =
                                `${
                                    25 +
                                    Math.random() *
                                    30
                                }px`;


                            if (
                                seconds <
                                5 &&
                                height <
                                285
                            ) {

                                requestAnimationFrame(
                                    animate
                                );

                            } else {

                                flame.style.opacity =
                                    "0";


                                launching =
                                    false;


                                result.textContent =
                                    t(
                                        `Launch reached about ${Math.round(height)} km in this simulation.`,
                                        `O lançamento chegou a cerca de ${Math.round(height)} km nesta simulação.`
                                    );

                            }

                        }


                        requestAnimationFrame(
                            animate
                        );

                    }
                );

            }


            window.addEventListener(
                "languageChanged",
                () => {

                    window.location.reload();

                }
            );


        })();

    </script>


    <script>

        const stars =
            document.querySelector(
                ".stars"
            );


        if (
            stars &&
            !stars.children.length
        ) {

            for (
                let i = 0;
                i < 45;
                i++
            ) {

                const star =
                    document.createElement(
                        "span"
                    );

                star.className =
                    "star";

                star.style.left =
                    `${Math.random() * 100}%`;

                star.style.top =
                    `${Math.random() * 100}%`;

                star.style.width =
                    `${1 + Math.random() * 2}px`;

                star.style.height =
                    star.style.width;

                stars.appendChild(
                    star
                );

            }

        }

    </script>

</body>

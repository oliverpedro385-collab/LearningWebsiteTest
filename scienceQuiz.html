        healthText.textContent =
            `${health}%`;


        if (
            health >= 70
        ) {

            healthFill.style.background =
                "linear-gradient(90deg,#72b977,#a9d86d)";

            glow.style.opacity =
                "1";

        } else if (
            health >= 45
        ) {

            healthFill.style.background =
                "linear-gradient(90deg,#d1b45c,#d9985b)";

            glow.style.opacity =
                "0.72";

        } else {

            healthFill.style.background =
                "linear-gradient(90deg,#b65e5e,#8f4c4c)";

            glow.style.opacity =
                "0.42";
        }


        if (
            health < 35
        ) {

            cell.classList.remove(
                "healthyPulse"
            );
        }
    }


    function renderChallenge() {

        if (
            finished
        ) {
            return;
        }


        const challenge =
            challenges[
                currentChallenge
            ];


        question.textContent =
            challenge.question;


        choices.innerHTML =
            "";


        challenge.answers.forEach(
            (answer) => {

                const button =
                    document.createElement(
                        "button"
                    );


                button.type =
                    "button";


                button.className =
                    "cellsLabChoice";


                button.textContent =
                    answer;


                button.addEventListener(
                    "click",
                    () => {

                        handleAnswer(
                            answer,
                            challenge
                        );
                    }
                );


                choices.appendChild(
                    button
                );
            }
        );


        hint.textContent =
            challenge.hint;


        hint.classList.remove(
            "show"
        );


        result.textContent = "";
        result.className =
            "cellsLabResult";


        hintButton.disabled =
            false;
    }


    function handleAnswer(
        answer,
        challenge
    ) {

        const buttons =
            Array.from(
                choices.querySelectorAll(
                    "button"
                )
            );


        buttons.forEach(
            (button) => {
                button.disabled =
                    true;
            }
        );


        const correct =
            answer ===
            challenge.answers[0];


        if (
            correct
        ) {

            repairs++;

            health =
                Math.min(
                    100,
                    health + 8
                );


            buttons.forEach(
                (button) => {

                    if (
                        button.textContent ===
                        answer
                    ) {

                        button.classList.add(
                            "correct"
                        );
                    }
                }
            );


            result.textContent =
                challenge.success;


            result.className =
                "cellsLabResult correct";


            cell.classList.add(
                "healthyPulse"
            );


            setTimeout(
                () => {

                    cell.classList.remove(
                        "healthyPulse"
                    );

                },
                950
            );


            glow.style.transform =
                "scale(1.12)";


            setTimeout(
                () => {

                    glow.style.transform =
                        "scale(1)";

                },
                450
            );


        } else {

            mistakes++;


            health =
                Math.max(
                    10,
                    health - 18
                );


            buttons.forEach(
                (button) => {

                    if (
                        button.textContent ===
                        answer
                    ) {

                        button.classList.add(
                            "wrong"
                        );
                    }


                    if (
                        button.textContent ===
                        challenge.answers[0]
                    ) {

                        button.classList.add(
                            "correct"
                        );
                    }
                }
            );


            result.textContent =
                t(
                    "Wrong structure. The mistake damaged the cell. Look at the cell and try to recover it.",
                    "Estrutura errada. O erro danificou a célula. Observe a célula e tente recuperá-la."
                );


            result.className =
                "cellsLabResult wrong";
        }


        repairsText.textContent =
            repairs;


        mistakesText.textContent =
            mistakes;


        updateVisualDamage();


        setTimeout(
            () => {

                if (
                    currentChallenge >=
                    challenges.length - 1
                ) {

                    finishLab();

                } else {

                    currentChallenge++;

                    renderChallenge();
                }

            },
            1150
        );
    }


    function finishLab() {

        finished = true;


        choices.innerHTML =
            "";


        question.textContent =
            health >= 75

                ? t(
                    "The cell survived the lab and recovered well.",
                    "A célula sobreviveu ao laboratório e se recuperou bem."
                )

                : health >= 45

                    ? t(
                        "The cell is alive, but it is still showing some damage.",
                        "A célula está viva, mas ainda apresenta alguns danos."
                    )

                    : t(
                        "The cell is heavily damaged. Some repairs were correct, but too many mistakes were made.",
                        "A célula está muito danificada. Alguns reparos foram corretos, mas muitos erros foram cometidos."
                    );


        result.textContent =
            t(
                `Lab complete. Repairs: ${repairs}. Mistakes: ${mistakes}. Final health: ${health}%.`,
                `Laboratório concluído. Reparos: ${repairs}. Erros: ${mistakes}. Saúde final: ${health}%.`
            );


        result.className =
            "cellsLabResult finished";


        hint.classList.remove(
            "show"
        );


        hintButton.disabled =
            true;
    }


    hintButton.addEventListener(
        "click",
        () => {

            hint.classList.toggle(
                "show"
            );


            hintButton.textContent =
                hint.classList.contains(
                    "show"
                )

                    ? t(
                        "Hide hint",
                        "Esconder dica"
                    )

                    : t(
                        "Show hint",
                        "Mostrar dica"
                    );
        }
    );


    restartButton.addEventListener(
        "click",
        () => {

            currentChallenge = 0;

            health = 100;

            repairs = 0;

            mistakes = 0;

            finished = false;


            repairsText.textContent =
                "0";

            mistakesText.textContent =
                "0";


            healthFill.style.width =
                "100%";


            healthText.textContent =
                "100%";


            updateVisualDamage();

            renderChallenge();
        }
    );


        // =========================================================
    // CELL LIFE MOTION
    // =========================================================

    const movingParts = [
        ...cell.querySelectorAll(
            ".cellsLabMito, .cellsLabRibosome, .cellsLabGolgi, .cellsLabER"
        )
    ];


    const motionData = movingParts.map(
        (element, index) => {

            return {
                element,
                x:
                    Math.random() *
                    18 -
                    9,

                y:
                    Math.random() *
                    18 -
                    9,

                rotate:
                    Math.random() *
                    18 -
                    9,

                speed:
                    0.45 +
                    Math.random() *
                    0.7,

                phase:
                    Math.random() *
                    Math.PI *
                    2,

                baseTransform:
                    element.style.transform ||
                    ""
            };
        }
    );


    // Tiny floating particles inside the cytoplasm.

    const particles = [];


    for (
        let i = 0;
        i < 28;
        i++
    ) {

        const particle =
            document.createElement("div");


        particle.className =
            "cellsLabFloatingParticle";


        particle.style.left =
            `${15 + Math.random() * 70}%`;


        particle.style.top =
            `${15 + Math.random() * 70}%`;


        particle.style.animationDelay =
            `${-Math.random() * 6}s`;


        particle.style.animationDuration =
            `${4 + Math.random() * 5}s`;


        cell.appendChild(
            particle
        );


        particles.push(
            particle
        );
    }


    // Add the particle appearance.

    const motionStyle =
        document.createElement("style");


    motionStyle.textContent = `

        .cellsLabFloatingParticle {

            position: absolute;

            width: 4px;

            height: 4px;

            border-radius: 50%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.55
                );

            box-shadow:
                0 0 5px
                rgba(
                    255,
                    255,
                    255,
                    0.35
                );

            pointer-events:
                none;

            animation:
                cellsLabParticleDrift
                linear
                infinite;

        }


        @keyframes cellsLabParticleDrift {

            0% {

                transform:
                    translate(
                        0,
                        0
                    );

                opacity:
                    0.15;

            }


            25% {

                transform:
                    translate(
                        14px,
                        -10px
                    );

                opacity:
                    0.75;

            }


            50% {

                transform:
                    translate(
                        -8px,
                        13px
                    );

                opacity:
                    0.4;

            }


            75% {

                transform:
                    translate(
                        -16px,
                        -6px
                    );

                opacity:
                    0.7;

            }


            100% {

                transform:
                    translate(
                        0,
                        0
                    );

                opacity:
                    0.15;

            }

        }

    `;


    cell.appendChild(
        motionStyle
    );


    let motionStart =
        performance.now();


    function animateCellLife(
        timestamp
    ) {

        const elapsed =
            (
                timestamp -
                motionStart
            ) / 1000;


        const damage =
            Math.max(
                0,
                Math.min(
                    5,
                    Math.floor(
                        (100 - health) / 17
                    )
                )
            );


        const activity =
            Math.max(
                0.25,
                1 -
                    damage *
                    0.12
            );


        motionData.forEach(
            (data, index) => {

                const wave =
                    elapsed *
                    data.speed *
                    activity +
                    data.phase;


                const moveX =
                    Math.sin(
                        wave
                    ) *
                    data.x;


                const moveY =
                    Math.cos(
                        wave *
                        0.82
                    ) *
                    data.y;


                const rotation =
                    Math.sin(
                        wave *
                        0.7
                    ) *
                    data.rotate;


                if (
                    data.element.classList.contains(
                        "cellsLabRibosome"
                    )
                ) {

                    data.element.style.transform =
                        `translate(${moveX}px, ${moveY}px) scale(${1 + Math.sin(wave) * 0.08})`;

                } else {

                    data.element.style.transform =
                        `translate(${moveX}px, ${moveY}px) rotate(${rotation}deg)`;
                }
            }
        );


        const nucleus =
            cell.querySelector(
                ".cellsLabNucleus"
            );


        if (nucleus) {

            const pulse =
                1 +
                Math.sin(
                    elapsed *
                    1.4 *
                    activity
                ) *
                0.025 *
                activity;


            nucleus.style.transform =
                `scale(${pulse})`;
        }


        // Slightly change the overall cell movement.
        // Damaged cells become less energetic.

        const cellBob =
            Math.sin(
                elapsed *
                1.15 *
                activity
            ) *
            1.4 *
            activity;


        const cellTilt =
            Math.sin(
                elapsed *
                0.7 *
                activity
            ) *
            0.35 *
            activity;


        cell.style.transform =
            `translateY(${cellBob}px) rotate(${cellTilt}deg)`;


        requestAnimationFrame(
            animateCellLife
        );
    }


    requestAnimationFrame(
        animateCellLife
    );

    updateVisualDamage();

    renderChallenge();
}

        );

            min,
            Math.min(
                max,
                value
            )
        );

    }


    function moveToward(
        animal,
        target,
        dt
    ) {

        const dx =
            target.x -
            animal.x;


        const dy =
            target.y -
            animal.y;


        const length =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (
            length <
            0.001
        ) {
            return;
        }


        const speed =
            animal.type ===
            "herbivore"
                ? herbivoreSpeed
                : carnivoreSpeed;


        const desiredX =
            dx /
            length *
            speed;


        const desiredY =
            dy /
            length *
            speed;


        animal.vx +=
            (
                desiredX -
                animal.vx
            ) *
            Math.min(
                1,
                dt * 4
            );


        animal.vy +=
            (
                desiredY -
                animal.vy
            ) *
            Math.min(
                1,
                dt * 4
            );

    }


    function wander(
        animal,
        dt
    ) {

        animal.vx +=
            (
                Math.random() -
                0.5
            ) *
            dt *
            18;


        animal.vy +=
            (
                Math.random() -
                0.5
            ) *
            dt *
            18;


        const speed =
            animal.type ===
            "herbivore"
                ? herbivoreSpeed
                : carnivoreSpeed;


        const currentSpeed =
            Math.sqrt(
                animal.vx *
                animal.vx +
                animal.vy *
                animal.vy
            );


        if (
            currentSpeed >
            speed
        ) {

            animal.vx =
                animal.vx /
                currentSpeed *
                speed;


            animal.vy =
                animal.vy /
                currentSpeed *
                speed;

        }

    }


    /* =====================================================
       PLANTS
       ===================================================== */

    function spawnPlant(
        x,
        y
    ) {

        const isTree =
            Math.random() <
            0.34;


        plants.push({

            x,

            y,

            type:
                isTree
                    ? "tree"
                    : "bush",

            health:
                100,

            maxHealth:
                100,

            size:
                isTree
                    ? 20
                    : 14

        });

    }


    function createInitialPlants(
        count
    ) {

        plants =
            [];


        for (
            let i = 0;
            i < count;
            i++
        ) {

            const position =
                randomPosition();


            spawnPlant(
                position.x,
                position.y
            );

        }

    }


    function updatePlants(
        dt
    ) {

        plants.forEach(
            plant => {

                plant.health =
                    clamp(
                        plant.health +
                        dt *
                        (
                            plant.type ===
                            "tree"
                                ? 3.0
                                : 4.5
                        ),
                        0,
                        plant.maxHealth
                    );

            }
        );


        const currentPlantCap =
            Math.max(
                Number(
                    plantsControl.input.value
                ) *
                2.2,
                18
            );


        if (
            plants.length <
            currentPlantCap
        ) {

            const fertile =
                plants.filter(
                    plant =>
                        plant.health >
                        90
                );


            if (
                fertile.length >
                0 &&
                Math.random() <
                plantSpreadChance *
                dt
            ) {

                const parent =
                    fertile[
                        Math.floor(
                            Math.random() *
                            fertile.length
                        )
                    ];


                const angle =
                    Math.random() *
                    Math.PI *
                    2;


                const distanceFromParent =
                    35 +
                    Math.random() *
                    45;


                let x =
                    parent.x +
                    Math.cos(
                        angle
                    ) *
                    distanceFromParent;


                let y =
                    parent.y +
                    Math.sin(
                        angle
                    ) *
                    distanceFromParent;


                x =
                    clamp(
                        x,
                        35,
                        worldWidth() -
                        35
                    );


                y =
                    clamp(
                        y,
                        100,
                        worldHeight() -
                        45
                    );


                spawnPlant(
                    x,
                    y
                );

            }

        }


        for (
            let i =
                plants.length -
                1;

            i >= 0;

            i--
        ) {

            if (
                plants[i].health <=
                0
            ) {

                plants.splice(
                    i,
                    1
                );

            }

        }

    }


    /* =====================================================
       ANIMALS
       ===================================================== */

    function spawnAnimal(
        type,
        x,
        y,
        parentA = null,
        parentB = null
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;


        const startingEnergy =
            parentA &&
            parentB
                ? 58
                : 72 +
                    Math.random() *
                    20;


        animals.push({

            type,

            x,

            y,

            vx:
                Math.cos(angle) *
                6,

            vy:
                Math.sin(angle) *
                6,

            health:
                100,

            maxHealth:
                100,

            energy:
                startingEnergy,

            age:
                parentA &&
                parentB
                    ? 0
                    : Math.random() *
                        35,

            reproductionCooldown:
                parentA &&
                parentB
                    ? 42
                    : Math.random() *
                        20,

            wanderTimer:
                Math.random() *
                3,

            size:
                type ===
                "herbivore"
                    ? 8
                    : 10

        });

        if (
            parentA &&
            parentB
        ) {

            births++;

        }

    }


    function createInitialAnimals() {

        animals =
            [];


        const herbivores =
            Number(
                herbivoreControl.input.value
            );


        const carnivores =
            Number(
                carnivoreControl.input.value
            );


        for (
            let i = 0;
            i <
            herbivores;
            i++
        ) {

            const position =
                randomPosition();


            spawnAnimal(
                "herbivore",
                position.x,
                position.y
            );

        }


        for (
            let i = 0;
            i <
            carnivores;
            i++
        ) {

            const position =
                randomPosition();


            spawnAnimal(
                "carnivore",
                position.x,
                position.y
            );

        }

    }


    function findNearest(
        animal,
        array,
        predicate
    ) {

        let nearest =
            null;


        let nearestDistance =
            Infinity;


        array.forEach(
            item => {

                if (
                    predicate &&
                    !predicate(
                        item
                    )
                ) {

                    return;

                }


                const d =
                    distance(
                        animal,
                        item
                    );


                if (
                    d <
                    nearestDistance
                ) {

                    nearest =
                        item;

                    nearestDistance =
                        d;

                }

            }
        );


        return {

            item:
                nearest,

            distance:
                nearestDistance

        };

    }


    function tryReproduce(
        animal,
        dt
    ) {

        if (
            animal.age <
            18
        ) {
            return;
        }


        if (
            animal.energy <
            72
        ) {
            return;
        }


        if (
            animal.health <
            65
        ) {
            return;
        }


        if (
            animal.reproductionCooldown >
            0
        ) {
            return;
        }


        const sameSpecies =
            animal.type ===
            "herbivore"
                ? "herbivore"
                : "carnivore";


        const mate =
            findNearest(
                animal,
                animals,
                other =>
                    other !==
                        animal &&
                    other.type ===
                        sameSpecies &&
                    other.age >=
                        18 &&
                    other.health >
                        65 &&
                    other.energy >
                        65 &&
                    other.reproductionCooldown <=
                        0 &&
                    distance(
                        animal,
                        other
                    ) <
                        36
            );


        if (
            !mate.item
        ) {
            return;
        }


        const populationCap =
            animal.type ===
            "herbivore"
                ? Math.max(
                    Number(
                        herbivoreControl
                            .input
                            .value
                    ) *
                    2.8,
                    10
                )
                : Math.max(
                    Number(
                        carnivoreControl
                            .input
                            .value
                    ) *
                    2.4,
                    5
                );


        const currentPopulation =
            animals.filter(
                item =>
                    item.type ===
                    animal.type
            ).length;


        if (
            currentPopulation >=
            populationCap
        ) {
            return;
        }


        const chance =
            animal.type ===
            "herbivore"
                ? herbivoreBirthChance
                : carnivoreBirthChance;


        if (
            Math.random() <
            chance *
            dt
        ) {

            const childX =
                (
                    animal.x +
                    mate.item.x
                ) /
                2;


            const childY =
                (
                    animal.y +
                    mate.item.y
                ) /
                2;


            spawnAnimal(
                animal.type,
                childX +
                    (
                        Math.random() -
                        0.5
                    ) *
                    14,
                childY +
                    (
                        Math.random() -
                        0.5
                    ) *
                    14,
                animal,
                mate.item
            );


            animal.energy -=
                25;


            mate.item.energy -=
                25;


            animal.reproductionCooldown =
                35;


            mate.item.reproductionCooldown =
                35;

        }

    }


    function updateAnimal(
        animal,
        dt
    ) {

        animal.age +=
            dt;


        animal.reproductionCooldown =
            Math.max(
                0,
                animal.reproductionCooldown -
                dt
            );


        animal.energy -=
            dt *
            (
                animal.type ===
                "herbivore"
                    ? .72
                    : .92
            );


        if (
            animal.energy <=
            0
        ) {

            animal.health -=
                dt *
                2.2;

        } else if (
            animal.energy >
            65 &&
            animal.health <
            100
        ) {

            animal.health =
                clamp(
                    animal.health +
                    dt *
                    .8,
                    0,
                    100
                );

        }


        let targetResult;


        if (
            animal.type ===
            "herbivore"
        ) {

            targetResult =
                findNearest(
                    animal,
                    plants,
                    plant =>
                        plant.health >
                        8
                );


            if (
                targetResult.item
            ) {

                moveToward(
                    animal,
                    targetResult.item,
                    dt
                );


                if (
                    targetResult.distance <
                    animal.size +
                    targetResult.item.size +
                    8
                ) {

                    const eatingPower =
                        16 *
                        dt;


                    targetResult.item.health =
                        Math.max(
                            0,
                            targetResult.item.health -
                            eatingPower
                        );


                    animal.energy =
                        clamp(
                            animal.energy +
                            dt *
                            17,
                            0,
                            100
                        );


                    animal.health =
                        clamp(
                            animal.health +
                            dt *
                            1.5,
                            0,
                            100
                        );

                }

            } else {

                wander(
                    animal,
                    dt
                );

            }

        } else {

            targetResult =
                findNearest(
                    animal,
                    animals,
                    prey =>
                        prey !==
                            animal &&
                        prey.type ===
                            "herbivore" &&
                        prey.health >
                            0
                );


            if (
                targetResult.item
            ) {

                moveToward(
                    animal,
                    targetResult.item,
                    dt
                );


                if (
                    targetResult.distance <
                    animal.size +
                    targetResult.item.size +
                    7
                ) {

                    targetResult.item.health =
                        Math.max(
                            0,
                            targetResult.item.health -
                            dt *
                            26
                        );


                    animal.energy =
                        clamp(
                            animal.energy +
                            dt *
                            15,
                            0,
                            100
                        );

                }

            } else {

                wander(
                    animal,
                    dt
                );

            }

        }


        animal.vx *=
            .992;


        animal.vy *=
            .992;


        animal.x +=
            animal.vx *
            dt;


        animal.y +=
            animal.vy *
            dt;


        const left =
            animal.size +
            22;


        const right =
            worldWidth() -
            animal.size -
            22;


        const top =
            92;


        const bottom =
            worldHeight() -
            35;


        if (
            animal.x <
            left
        ) {

            animal.x =
                left;

            animal.vx =
                Math.abs(
                    animal.vx
                );

        }


        if (
            animal.x >
            right
        ) {

            animal.x =
                right;

            animal.vx =
                -Math.abs(
                    animal.vx
                );

        }


        if (
            animal.y <
            top
        ) {

            animal.y =
                top;

            animal.vy =
                Math.abs(
                    animal.vy
                );

        }


        if (
            animal.y >
            bottom
        ) {

            animal.y =
                bottom;

            animal.vy =
                -Math.abs(
                    animal.vy
                );

        }


        tryReproduce(
            animal,
            dt
        );

    }


    function updateAnimals(
        dt
    ) {

        animals.forEach(
            animal =>
                updateAnimal(
                    animal,
                    dt
                )
        );


        for (
            let i =
                animals.length -
                1;

            i >= 0;

            i--
        ) {

            const animal =
                animals[i];


            const maximumAge =
                animal.type ===
                "herbivore"
                    ? 180
                    : 230;


            if (
                animal.health <=
                    0 ||
                animal.age >
                    maximumAge
            ) {

                animals.splice(
                    i,
                    1
                );


                deaths++;

            }

        }

    }


    /* =====================================================
       COLLISION / PREDATION
       ===================================================== */

    function removeEatenHerbivores() {

        for (
            let i =
                animals.length -
                1;

            i >= 0;

            i--
        ) {

            const prey =
                animals[i];


            if (
                prey.type !==
                    "herbivore" ||
                prey.health >
                    0
            ) {

                continue;

            }


            animals.splice(
                i,
                1
            );


            deaths++;

        }

    }


    /* =====================================================
       DRAW BACKGROUND
       ===================================================== */

    function drawBackground() {

        const width =
            worldWidth();


        const height =
            worldHeight();


        const skyHeight =
            Math.min(
                115,
                height *
                .22
            );


        const skyGradient =
            ctx.createLinearGradient(
                0,
                0,
                0,
                skyHeight
            );


        skyGradient.addColorStop(
            0,
            "#88afd2"
        );


        skyGradient.addColorStop(
            1,
            "#cfe4c3"
        );


        ctx.fillStyle =
            skyGradient;


        ctx.fillRect(
            0,
            0,
            width,
            height
        );


        ctx.fillStyle =
            "#63855b";


        ctx.fillRect(
            0,
            skyHeight,
            width,
            height -
            skyHeight
        );


        /* Ground patches */

        for (
            let i = 0;
            i < 34;
            i++
        ) {

            const x =
                (
                    i *
                    157
                ) %
                width;


            const y =
                skyHeight +
                35 +
                (
                    i *
                    83
                ) %
                Math.max(
                    40,
                    height -
                    skyHeight -
                    65
                );


            ctx.fillStyle =
                i % 2 === 0
                    ? "rgba(40,82,47,.13)"
                    : "rgba(180,146,81,.08)";


            ctx.beginPath();


            ctx.ellipse(
                x,
                y,
                38 +
                    (
                        i % 5
                    ) *
                    9,
                14 +
                    (
                        i % 3
                    ) *
                    5,
                0,
                0,
                Math.PI *
                2
            );


            ctx.fill();

        }


        /* Sky line */

        ctx.fillStyle =
            "rgba(255,255,255,.28)";


        ctx.fillRect(
            0,
            skyHeight -
            1,
            width,
            2
        );


        /* Sun */

        ctx.beginPath();


        ctx.arc(
            width -
            70,
            52,
            25,
            0,
            Math.PI *
            2
        );


        ctx.fillStyle =
            "#ffd86b";


        ctx.fill();

    }


    /* =====================================================
       DRAW PLANTS
       ===================================================== */

    function drawPlant(
        plant
    ) {

        const healthRatio =
            clamp(
                plant.health /
                plant.maxHealth,
                0,
                1
            );


        ctx.save();


        if (
            plant.type ===
            "tree"
        ) {

            /* trunk */

            ctx.fillStyle =
                "#76533b";


            ctx.fillRect(
                plant.x -
                4,
                plant.y -
                5,
                8,
                28
            );


            /* canopy */

            const canopy =
                plant.size *
                (
                    .82 +
                    healthRatio *
                    .18
                );


            ctx.fillStyle =
                healthRatio >
                .35
                    ? "#4f8e53"
                    : "#7f774f";


            ctx.beginPath();


            ctx.arc(
                plant.x -
                9,
                plant.y -
                17,
                canopy *
                .65,
                0,
                Math.PI *
                2
            );


            ctx.arc(
                plant.x +
                9,
                plant.y -
                18,
                canopy *
                .60,
                0,
                Math.PI *
                2
            );


            ctx.arc(
                plant.x,
                plant.y -
                27,
                canopy *
                .72,
                0,
                Math.PI *
                2
            );


            ctx.fill();

        } else {

            const scale =
                .75 +
                healthRatio *
                .25;


            ctx.fillStyle =
                healthRatio >
                .35
                    ? "#57965d"
                    : "#82764b";


            ctx.beginPath();


            ctx.arc(
                plant.x -
                10,
                plant.y,
                plant.size *
                scale *
                .72,
                0,
                Math.PI *
                2
            );


            ctx.arc(
                plant.x +
                10,
                plant.y,
                plant.size *
                scale *
                .72,
                0,
                Math.PI *
                2
            );


            ctx.arc(
                plant.x,
                plant.y -
                7,
                plant.size *
                scale,
                0,
                Math.PI *
                2
            );


            ctx.fill();

        }


        drawHealthBar(
            plant.x,
            plant.y -
                plant.size -
                15,
            plant.size *
            1.8,
            healthRatio,
            "#65a85f"
        );


        ctx.restore();

    }


    /* =====================================================
       DRAW ANIMALS
       ===================================================== */

    function drawAnimal(
        animal
    ) {

        const healthRatio =
            clamp(
                animal.health /
                animal.maxHealth,
                0,
                1
            );


        ctx.save();


        const bodyColor =
            animal.type ===
            "herbivore"
                ? "#75b8d0"
                : "#d47768";


        const darkColor =
            animal.type ===
            "herbivore"
                ? "#406e80"
                : "#7e4038";


        /* Shadow */

        ctx.fillStyle =
            "rgba(0,0,0,.16)";


        ctx.beginPath();


        ctx.ellipse(
            animal.x,
            animal.y +
            animal.size +
            5,
            animal.size *
            1.25,
            animal.size *
            .42,
            0,
            0,
            Math.PI *
            2
        );


        ctx.fill();


        /* Body */

        ctx.fillStyle =
            bodyColor;


        ctx.beginPath();


        ctx.arc(
            animal.x,
            animal.y,
            animal.size,
            0,
            Math.PI *
            2
        );


        ctx.fill();


        /* Small ears / crown */

        ctx.fillStyle =
            darkColor;


        ctx.beginPath();


        ctx.arc(
            animal.x -
            animal.size *
            .55,
            animal.y -
            animal.size *
            .7,
            animal.size *
            .34,
            0,
            Math.PI *
            2
        );


        ctx.arc(
            animal.x +
            animal.size *
            .55,
            animal.y -
            animal.size *
            .7,
            animal.size *
            .34,
            0,
            Math.PI *
            2
        );


        ctx.fill();


        /* Eyes */

        ctx.fillStyle =
            "#172019";


        ctx.beginPath();


        ctx.arc(
            animal.x -
            3,
            animal.y -
            2,
            1.5,
            0,
            Math.PI *
            2
        );


        ctx.arc(
            animal.x +
            3,
            animal.y -
            2,
            1.5,
            0,
            Math.PI *
            2
        );


        ctx.fill();


        drawHealthBar(
            animal.x,
            animal.y -
                animal.size -
                13,
            animal.size *
            2.4,
            healthRatio,
            animal.type ===
                "herbivore"
                ? "#65bfcd"
                : "#d47768"
        );


        ctx.restore();

    }


    function drawHealthBar(
        x,
        y,
        width,
        ratio,
        fillColor
    ) {

        const height =
            4;


        const left =
            x -
            width /
            2;


        ctx.fillStyle =
            "rgba(20,28,20,.42)";


        ctx.fillRect(
            left,
            y,
            width,
            height
        );


        ctx.fillStyle =
            fillColor;


        ctx.fillRect(
            left,
            y,
            width *
            ratio,
            height
        );

    }


    /* =====================================================
       DRAW WORLD
       ===================================================== */

    function drawWorld() {

        drawBackground();


        plants.forEach(
            drawPlant
        );


        animals.forEach(
            drawAnimal
        );


        /* Simulation clock */

        ctx.fillStyle =
            "rgba(20,26,22,.62)";


        ctx.fillRect(
            14,
            14,
            175,
            37
        );


        ctx.fillStyle =
            "#f6f6f0";


        ctx.font =
            "900 12px Arial";


        ctx.fillText(
            t(
                "SIMULATION",
                "SIMULAÇÃO"
            ),
            26,
            30
        );


        ctx.font =
            "700 11px Arial";


        ctx.fillText(
            formatSimulationTime(
                simulationTime
            ),
            26,
            44
        );

    }


    function formatSimulationTime(
        seconds
    ) {

        const total =
            Math.floor(
                seconds
            );


        const minutes =
            Math.floor(
                total /
                60
            );


        const secs =
            total %
            60;


        return `${String(
            minutes
        ).padStart(
            2,
            "0"
        )}:${String(
            secs
        ).padStart(
            2,
            "0"
        )}`;

    }


    /* =====================================================
       STATS / BALANCE
       ===================================================== */

    function updateStats() {

        const plantCount =
            plants.length;


        const herbivoreCount =
            animals.filter(
                animal =>
                    animal.type ===
                    "herbivore"
            ).length;


        const carnivoreCount =
            animals.filter(
                animal =>
                    animal.type ===
                    "carnivore"
            ).length;


        plantCountText.textContent =
            plantCount;


        herbivoreCountText.textContent =
            herbivoreCount;


        carnivoreCountText.textContent =
            carnivoreCount;


        timeText.textContent =
            formatSimulationTime(
                simulationTime
            );


        if (
            herbivoreCount ===
            0
        ) {

            status.textContent =
                t(
                    "The herbivore population has disappeared. Add more herbivores or reset the world.",
                    "A população de herbívoros desapareceu. Adicione mais herbívoros ou reinicie o mundo."
                );


            return;

        }


        if (
            carnivoreCount ===
            0
        ) {

            status.textContent =
                t(
                    "The carnivores have disappeared. A larger herbivore population can support them longer.",
                    "Os carnívoros desapareceram. Uma população maior de herbívoros pode sustentá-los por mais tempo."
                );


            return;

        }


        if (
            plantCount <
            herbivoreCount
        ) {

            status.textContent =
                t(
                    "Plants are becoming scarce. Herbivores may struggle for food.",
                    "As plantas estão ficando escassas. Os herbívoros podem ter dificuldade para encontrar alimento."
                );


            return;

        }


        if (
            carnivoreCount >
            herbivoreCount *
            .65
        ) {

            status.textContent =
                t(
                    "Predators are numerous. Watch the herbivore population.",
                    "Há muitos predadores. Observe a população de herbívoros."
                );


            return;

        }


        if (
            herbivoreCount >
            plantCount *
            1.25
        ) {

            status.textContent =
                t(
                    "There are many herbivores compared with the available plants.",
                    "Há muitos herbívoros em relação às plantas disponíveis."
                );


            return;

        }


        status.textContent =
            t(
                "The ecosystem is relatively balanced. Keep experimenting with the starting populations.",
                "O ecossistema está relativamente equilibrado. Continue experimentando com as populações iniciais."
            );

    }


    /* =====================================================
       RESET
       ===================================================== */

    function resetWorld() {

        simulationTime =
            0;


        births =
            0;


        deaths =
            0;


        createInitialPlants(
            Number(
                plantsControl.input.value
            )
        );


        createInitialAnimals();


        status.textContent =
            t(
                "The ecosystem has been reset.",
                "O ecossistema foi reiniciado."
            );


        updateStats();

    }


    /* =====================================================
       PAUSE
       ===================================================== */

    pauseButton.addEventListener(
        "click",
        () => {

            running =
                !running;


            pauseButton.textContent =
                running
                    ? t(
                        "Pause",
                        "Pausar"
                    )
                    : t(
                        "Resume",
                        "Continuar"
                    );


            if (
                running
            ) {

                lastFrame =
                    performance.now();

            }

        }
    );


    resetButton.addEventListener(
        "click",
        resetWorld
    );


    /* =====================================================
       ANIMATION
       ===================================================== */

    function animationLoop(
        now
    ) {

        animationFrame =
            requestAnimationFrame(
                animationLoop
            );


        const realDelta =
            Math.min(
                .05,
                (
                    now -
                    lastFrame
                ) /
                1000
            );


        lastFrame =
            now;


        if (
            running
        ) {

            const speed =
                Number(
                    speedControl.input.value
                );


            const simulationDelta =
                realDelta *
                speed;


            simulationTime +=
                simulationDelta;


            updatePlants(
                simulationDelta
            );


            updateAnimals(
                simulationDelta
            );


            removeEatenHerbivores();


            statsTimer +=
                simulationDelta;


            if (
                statsTimer >
                .35
            ) {

                statsTimer =
                    0;


                updateStats();

            }

        }


        drawWorld();

    }


    /* =====================================================
       RESIZE
       ===================================================== */

    if (
        typeof ResizeObserver !==
        "undefined"
    ) {

        new ResizeObserver(
            () => {

                resizeCanvas();

                drawWorld();

            }
        ).observe(
            canvas
        );

    }


    window.addEventListener(
        "resize",
        resizeCanvas
    );


    /* =====================================================
       START
       ===================================================== */

    resizeCanvas();

    resetWorld();

    lastFrame =
        performance.now();


    animationFrame =
        requestAnimationFrame(
            animationLoop
        );

}

            /* =================================================
               MATTER
               ================================================= */


            function buildMatterLab(
                root
            ) {

                const panel =
                    createPanel(
                        t(
                            "Particle Matter Simulator",
                            "Simulador de Partículas da Matéria"
                        ),
                        t(
                            "Change temperature and watch the particles actually move differently.",
                            "Mude a temperatura e veja as partículas realmente se moverem de forma diferente."
                        )
                    );


                const scene =
                    document.createElement(
                        "div"
                    );

                scene.className =
                    "particleLab";


                const canvas =
                    document.createElement(
                        "canvas"
                    );

                canvas.width =
                    900;

                canvas.height =
                    460;

                canvas.className =
                    "particleCanvas";


                scene.appendChild(
                    canvas
                );


                const temp =
                    makeRange(
                        t(
                            "Temperature",
                            "Temperatura"
                        ),
                        -20,
                        180,
                        difficulty.id === "easy"
                            ? 20
                            : difficulty.id === "extreme"
                                ? 80
                                : 55
                    );


                const state =
                    document.createElement(
                        "div"
                    );


                state.className =
                    "scienceBigValue";


                panel.append(
                    scene,
                    state,
                    temp.row
                );


                root.appendChild(
                    panel
                );


                const ctx =
                    canvas.getContext(
                        "2d"
                    );


                let width =
                    canvas.width;


                let height =
                    canvas.height;


                const particles =
                    [];


                const particleCount =
                    difficulty.id === "easy"
                        ? 32
                        : difficulty.id === "medium"
                            ? 44
                            : difficulty.id === "hard"
                                ? 58
                                : difficulty.id === "difficult"
                                    ? 72
                                    : 86;


                for (
                    let i = 0;
                    i < particleCount;
                    i++
                ) {

                    particles.push({

                        x:
                            100 +
                            Math.random() *
                            700,

                        y:
                            80 +
                            Math.random() *
                            290,

                        vx:
                            (
                                Math.random() -
                                .5
                            ) *
                            1.5,

                        vy:
                            (
                                Math.random() -
                                .5
                            ) *
                            1.5

                    });

                }


                function currentState(
                    value
                ) {

                    if (
                        value <=
                        0
                    ) {

                        return "solid";

                    }

                    if (
                        value <
                        100
                    ) {

                        return "liquid";

                    }

                    return "gas";

                }


                function draw() {

                    const temperature =
                        Number(
                            temp.input.value
                        );


                    const mode =
                        currentState(
                            temperature
                        );


                    if (
                        mode ===
                        "solid"
                    ) {

                        state.textContent =
                            t(
                                "Solid",
                                "Sólido"
                            );

                    } else if (
                        mode ===
                        "liquid"
                    ) {

                        state.textContent =
                            t(
                                "Liquid",
                                "Líquido"
                            );

                    } else {

                        state.textContent =
                            t(
                                "Gas",
                                "Gas"
                            );

                    }


                    ctx.fillStyle =
                        "#151620";

                    ctx.fillRect(
                        0,
                        0,
                        width,
                        height
                    );


                    ctx.strokeStyle =
                        "rgba(255,255,255,.07)";

                    ctx.strokeRect(
                        25,
                        25,
                        width - 50,
                        height - 50
                    );


                    const speed =
                        mode === "solid"
                            ? .15
                            : mode === "liquid"
                                ? .65
                                : 1.55;


                    particles.forEach(
                        (
                            particle,
                            index
                        ) => {

                            if (
                                mode ===
                                "solid"
                            ) {

                                const cols =
                                    Math.ceil(
                                        Math.sqrt(
                                            particleCount
                                        )
                                    );


                                const rows =
                                    Math.ceil(
                                        particleCount /
                                        cols
                                    );


                                const spacingX =
                                    (
                                        width -
                                        180
                                    ) /
                                    cols;


                                const spacingY =
                                    (
                                        height -
                                        140
                                    ) /
                                    rows;


                                const targetX =
                                    90 +
                                    (
                                        index %
                                        cols
                                    ) *
                                    spacingX;


                                const targetY =
                                    75 +
                                    Math.floor(
                                        index /
                                        cols
                                    ) *
                                    spacingY;


                                particle.x +=
                                    (
                                        targetX -
                                        particle.x
                                    ) *
                                    .08;


                                particle.y +=
                                    (
                                        targetY -
                                        particle.y
                                    ) *
                                    .08;


                                particle.x +=
                                    (
                                        Math.random() -
                                        .5
                                    ) *
                                    .9;


                                particle.y +=
                                    (
                                        Math.random() -
                                        .5
                                    ) *
                                    .9;

                            } else {

                                particle.x +=
                                    particle.vx *
                                    speed;


                                particle.y +=
                                    particle.vy *
                                    speed;


                                if (
                                    mode ===
                                    "liquid"
                                ) {

                                    particle.vx +=
                                        (
                                            Math.random() -
                                            .5
                                        ) *
                                        .05;

                                    particle.vy +=
                                        (
                                            Math.random() -
                                            .5
                                        ) *
                                        .05;

                                } else {

                                    particle.vx +=
                                        (
                                            Math.random() -
                                            .5
                                        ) *
                                        .13;

                                    particle.vy +=
                                        (
                                            Math.random() -
                                            .5
                                        ) *
                                        .13;

                                }


                                const maxSpeed =
                                    mode ===
                                    "gas"
                                        ? 2.7
                                        : 1.5;


                                const currentSpeed =
                                    Math.sqrt(
                                        particle.vx *
                                        particle.vx +
                                        particle.vy *
                                        particle.vy
                                    );


                                if (
                                    currentSpeed >
                                    maxSpeed
                                ) {

                                    const factor =
                                        maxSpeed /
                                        currentSpeed;


                                    particle.vx *=
                                        factor;


                                    particle.vy *=
                                        factor;

                                }


                                if (
                                    particle.x <
                                    35
                                ) {

                                    particle.x =
                                        35;

                                    particle.vx =
                                        Math.abs(
                                            particle.vx
                                        );

                                }


                                if (
                                    particle.x >
                                    width -
                                    35
                                ) {

                                    particle.x =
                                        width -
                                        35;

                                    particle.vx =
                                        -Math.abs(
                                            particle.vx
                                        );

                                }


                                if (
                                    particle.y <
                                    35
                                ) {

                                    particle.y =
                                        35;

                                    particle.vy =
                                        Math.abs(
                                            particle.vy
                                        );

                                }


                                if (
                                    particle.y >
                                    height -
                                    35
                                ) {

                                    particle.y =
                                        height -
                                        35;

                                    particle.vy =
                                        -Math.abs(
                                            particle.vy
                                        );

                                }

                            }


                            ctx.beginPath();

                            ctx.arc(
                                particle.x,
                                particle.y,
                                7,
                                0,
                                Math.PI * 2
                            );


                            ctx.fillStyle =
                                mode ===
                                "gas"
                                    ? "#9fc7ec"
                                    : mode ===
                                        "liquid"
                                        ? "#6fc1e9"
                                        : "#d7aa64";


                            ctx.fill();

                        }
                    );

                }


                let animation =
                    0;


                function animate() {

                    draw();


                    animation =
                        requestAnimationFrame(
                            animate
                        );

                }


                temp.input.addEventListener(
                    "input",
                    draw
                );


                animate();


                panel.dataset.animation =
                    animation;

            }

            function buildForcesLab(
                root
            ) {

                const panel =
                    createPanel(

                            "Motion Simulator",

                        ),
                        t(
                            "Push the object and change friction to see how its movement responds.",
                            "Empurre o objeto e mude o atrito para ver como o movimento responde."
                        )
                    );


                const force =
                    makeRange(
                        t(
                            "Force",
                            "Força"
                        ),
                        0,
                        100,
                        60
                    );


                const friction =
                    makeRange(
                        t(
                            "Friction",
                            "Atrito"
                        ),
                        0,
                        100,
                        20
                    );


                const mass =
                    makeRange(
                        t(
                            "Mass",
                            "Massa"
                        ),
                        1,
                        10,
                        3
                    );


                const track =
                    document.createElement(
                        "div"
                    );

                track.className =
                    "forceTrack";


                const line =
                    document.createElement(
                        "div"
                    );

                line.className =
                    "forceLine";


                const object =
                    document.createElement(
                        "div"
                    );

                object.className =
                    "forceObject";


                track.append(
                    line,
                    object
                );


                panel.append(
                    track,
                    force.row,
                    friction.row,
                    mass.row
                );


                root.appendChild(
                    panel
                );


                const status =
                    createStatus(
                        panel
                    );


                let velocity =
                    0;


                let position =
                    20;


                let lastTime =
                    performance.now();


                function update(
                    now
                ) {

                    const delta =
                        Math.min(
                            .05,
                            (
                                now -
                                lastTime
                            ) /
                            1000
                        );


                    lastTime =
                        now;


                    const f =
                        Number(
                            force.input.value
                        );


                    const fr =
                        Number(
                            friction.input.value
                        );


                    const m =
                        Number(
                            mass.input.value
                        );


                    const acceleration =
                        (
                            f -
                            fr *
                            (
                                velocity >=
                                0
                                    ? 1
                                    : -1
                            )
                        ) /
                        m *
                        .28;


                    velocity +=
                        acceleration *
                        delta *
                        60;


                    velocity *=
                        .995;


                    position +=
                        velocity *
                        delta *
                        3;


                    if (
                        position >
                        track.clientWidth -
                        70
                    ) {

                        position =
                            track.clientWidth -
                            70;

                        velocity *=
                            -.55;

                    }


                    if (
                        position <
                        20
                    ) {

                        position =
                            20;

                        velocity =
                            0;

                    }


                    object.style.left =
                        `${position}px`;


                    const state =
                        Math.abs(
                            velocity
                        ) <
                        .05
                            ? t(
                                "Stopped",
                                "Parado"
                            )
                            : velocity >
                                0
                                ? t(
                                    "Moving right",
                                    "Movendo para a direita"
                                )
                                : t(
                                    "Moving left",
                                    "Movendo para a esquerda"
                                );


                    status.textContent =
                        `${state} • ${t(
                            "Speed",
                            "Velocidade"
                        )}: ${Math.abs(
                            velocity
                        ).toFixed(1)}`;


                    requestAnimationFrame(
                        update
                    );

                }


                requestAnimationFrame(
                    update
                );

            }

                panel.append(
                    destinationTitle,
                    destinationButtons,
                    output
                );


                const status =
                    createStatus(
                        panel
                    );


                root.appendChild(
                    panel
                );


                const goodPairs = {

                    Sunlight:
                        [
                            "Motion",
                            "Light",
                            "Heat"
                        ],

                    Food:
                        [
                            "Motion",
                            "Heat"
                        ],

                    Battery:
                        [
                            "Motion",
                            "Light",
                            "Sound",
                            "Heat"
                        ],

                    Wind:
                        [
                            "Motion",
                            "Electrical"
                        ]

                };


                function calculate() {

                    if (
                        !source ||
                        !destination
                    ) {

                        return;

                    }


                    const valid =
                        (
                            goodPairs[
                                source

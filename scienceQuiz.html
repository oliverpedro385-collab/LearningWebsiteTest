<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <script>
        if (
            localStorage.getItem("darkMode") === "true"
        ) {
            document.documentElement.classList.add("darkMode");
        }
    </script>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <title>Science Challenge</title>


    <style>

        /* =========================================================
           GENERAL
           ========================================================= */

        .scienceChallengePage {
            max-width: 1050px;
            position: relative;
            z-index: 1;
        }

        .scienceQuizHeader {
            max-width: 800px;
            margin: 25px auto 20px;
            text-align: center;
        }

        .scienceQuizHeader h1 {
            margin-bottom: 8px;
        }

        .scienceQuizHeader p {
            margin: 0;
            opacity: .7;
            line-height: 1.5;
        }

        .scienceMeta {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 13px;
        }

        .scienceMetaPill {
            min-height: 29px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(105,86,157,.10);
            font-size: 10px;
            font-weight: 900;
        }


        /* =========================================================
           PRACTICE
           ========================================================= */

        .scienceProgressWrap {
            max-width: 760px;
            margin: 20px auto;
        }

        .scienceProgressTop {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 11px;
            font-weight: 800;
            opacity: .7;
            margin-bottom: 7px;
        }

        .scienceProgress {
            height: 9px;
            border-radius: 999px;
            overflow: hidden;
            background: rgba(105,86,157,.10);
        }

        .scienceProgressFill {
            height: 100%;
            width: 0;
            border-radius: inherit;
            background: #e99b32;
            transition: width .3s ease;
        }

        html.darkMode .scienceProgressFill {
            background: #69569d;
        }

        .scienceQuestionCard,
        .scienceResult {
            max-width: 780px;
            margin: 0 auto;
            background: var(--container-color);
            border-radius: 22px;
            padding: 24px;
            box-shadow: 0 10px 28px rgba(0,0,0,.07);
        }

        .scienceQuestionNumber {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .08em;
            font-weight: 900;
            opacity: .52;
            margin-bottom: 10px;
        }

        .scienceQuestionPrompt {
            font-size: clamp(20px,3vw,30px);
            font-weight: 900;
            line-height: 1.3;
            margin: 0 0 20px;
        }

        .scienceChoices {
            display: grid;
            grid-template-columns: repeat(2,minmax(0,1fr));
            gap: 10px;
        }

        .scienceChoice {
            min-height: 58px;
            border: 1px solid rgba(100,90,120,.14);
            border-radius: 14px;
            background: transparent;
            color: var(--text-color);
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            padding: 10px 13px;
            transition: transform .15s ease,background-color .2s ease;
        }

        .scienceChoice:hover:not(:disabled) {
            transform: translateY(-2px);
            background: rgba(233,155,50,.10);
        }

        .scienceChoice.correct {
            background: rgba(95,197,108,.14);
            border-color: rgba(95,197,108,.42);
        }

        .scienceChoice.wrong {
            background: rgba(212,98,97,.13);
            border-color: rgba(212,98,97,.40);
        }

        .scienceHintBox {
            margin-top: 17px;
            padding: 14px;
            border-radius: 14px;
            background: rgba(105,86,157,.07);
        }

        .scienceHintButton,
        .scienceNextButton,
        .scienceBackButton,
        .scienceFunButton,
        .scienceResetButton {
            min-height: 42px;
            padding: 9px 15px;
            border: none;
            border-radius: 11px;
            font: inherit;
            font-weight: 900;
            cursor: pointer;
            transition: transform .15s ease,background-color .2s ease;
        }

        .scienceHintButton,
        .scienceResetButton,
        .scienceBackButton {
            background: rgba(105,86,157,.12);
            color: var(--text-color);
        }

        .scienceNextButton,
        .scienceFunButton {
            background: #e99b32;
            color: white;
        }

        html.darkMode .scienceNextButton,
        html.darkMode .scienceFunButton {
            background: #69569d;
            color: #f5f0ff;
        }

        .scienceBackButton {
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .scienceHintText {
            margin: 10px 0 0;
            line-height: 1.5;
            font-size: 13px;
            opacity: .76;
        }

        .scienceFeedback,
        .scienceFunStatus {
            min-height: 28px;
            margin-top: 14px;
            font-weight: 800;
            line-height: 1.45;
        }

        .scienceActionRow {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .scienceScore {
            font-size: 44px;
            font-weight: 1000;
            margin: 4px 0;
        }


        /* =========================================================
           FUN LAB BASE
           ========================================================= */

        .scienceFunLab {
            max-width: 1000px;
            margin: 0 auto;
        }

        .scienceFunIntro {
            max-width: 760px;
            margin: 0 auto 17px;
            text-align: center;
        }

        .scienceFunIntro h2 {
            margin: 0 0 7px;
        }

        .scienceFunIntro p {
            margin: 0;
            opacity: .7;
            line-height: 1.5;
        }

        .scienceFunCard {
            background: var(--container-color);
            border-radius: 22px;
            padding: 20px;
            box-shadow: 0 10px 28px rgba(0,0,0,.07);
        }

        .scienceFunPanel {
            background: rgba(105,86,157,.06);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .scienceFunPanel:last-child {
            margin-bottom: 0;
        }

        .scienceFunPanel h3 {
            margin: 0 0 7px;
        }

        .scienceFunDescription {
            margin: 0;
            opacity: .7;
            line-height: 1.5;
            font-size: 13px;
        }

        .scienceBigValue {
            font-size: clamp(28px,5vw,46px);
            font-weight: 1000;
            text-align: center;
            margin: 10px 0 14px;
        }

        .scienceInfoGrid {
            display: grid;
            grid-template-columns: repeat(3,minmax(0,1fr));
            gap: 9px;
        }

        .scienceInfoBox {
            padding: 12px;
            border-radius: 12px;
            background: rgba(105,86,157,.07);
            text-align: center;
        }

        .scienceInfoBox strong {
            display: block;
            font-size: 10px;
            opacity: .58;
            margin-bottom: 5px;
        }

        .scienceInfoBox span {
            font-size: 20px;
            font-weight: 1000;
        }

        .scienceFunChoices {
            display: grid;
            grid-template-columns: repeat(4,minmax(0,1fr));
            gap: 9px;
        }

        .scienceFunChoice {
            min-height: 52px;
            border: 1px solid rgba(100,90,120,.14);
            border-radius: 12px;
            background: transparent;
            color: var(--text-color);
            font: inherit;
            font-weight: 900;
            cursor: pointer;
            transition: transform .15s ease,background-color .2s ease;
        }

        .scienceFunChoice:hover {
            transform: translateY(-2px);
            background: rgba(233,155,50,.10);
        }

        .scienceFunChoice.selected {
            background: rgba(105,86,157,.14);
            border-color: rgba(105,86,157,.35);
        }

        .scienceFunChoice.correct {
            background: rgba(95,197,108,.16);
            border-color: rgba(95,197,108,.42);
        }

        .scienceFunChoice.wrong {
            background: rgba(212,98,97,.14);
            border-color: rgba(212,98,97,.42);
            animation: scienceShake .22s ease;
        }

        @keyframes scienceShake {

            25% {
                transform: translateX(-4px);
            }

            50% {
                transform: translateX(4px);
            }

            75% {
                transform: translateX(-3px);
            }

            100% {
                transform: translateX(0);
            }

        }


        /* =========================================================
   ECOSYSTEM SIMULATOR
   ========================================================= */

.ecosystemScene {
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    background: #18251a;
}

.ecosystemCanvas {
    display: block;
    width: 100%;
    height: auto;
    touch-action: none;
}

.ecosystemStats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 9px;
    margin-top: 12px;
}

.ecosystemStat {
    padding: 11px;
    border-radius: 12px;
    background: rgba(105,86,157,.07);
    text-align: center;
}

.ecosystemStat strong {
    display: block;
    font-size: 10px;
    opacity: .58;
    margin-bottom: 5px;
}

.ecosystemStat span {
    font-size: 20px;
    font-weight: 1000;
}

.ecosystemLegend {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 13px;
    margin-top: 11px;
    font-size: 11px;
    font-weight: 800;
    opacity: .72;
}

.ecosystemLegendItem {
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.ecosystemLegendDot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
}

@media (max-width: 700px) {

    .ecosystemStats {
        grid-template-columns: repeat(2, 1fr);
    }

}


        /* =========================================================
           RANGES
           ========================================================= */

        .scienceControlRow {
            display: grid;
            grid-template-columns: 120px minmax(0,1fr) 70px;
            gap: 10px;
            align-items: center;
            margin: 10px 0;
        }

        .scienceControlRow label {
            font-size: 12px;
            font-weight: 900;
        }

        .scienceControlValue {
            text-align: right;
            font-weight: 900;
            font-size: 12px;
        }

        .scienceRange {
            width: 100%;
        }


        /* =========================================================
           CELLS
           ========================================================= */

        .cellGameArea {
            position: relative;
            min-height: 430px;
            overflow: hidden;
            border-radius: 18px;
            background: rgba(105,86,157,.06);
        }

        .cellCanvas {
            width: 100%;
            height: auto;
            display: block;
        }

        .cellHealthBar {
            position: absolute;
            top: 13px;
            left: 13px;
            right: 13px;
            height: 13px;
            border-radius: 999px;
            overflow: hidden;
            background: rgba(0,0,0,.10);
        }

        .cellHealthFill {
            height: 100%;
            width: 100%;
            border-radius: inherit;
            background: #65bf71;
            transition: width .2s ease,background-color .2s ease;
        }

        .cellGoal {
            position: absolute;
            top: 34px;
            left: 13px;
            right: 13px;
            text-align: center;
            font-size: 11px;
            font-weight: 900;
            opacity: .7;
        }


        /* =========================================================
           PARTICLES / MATTER
           ========================================================= */

        .particleLab {
            position: relative;
            overflow: hidden;
            border-radius: 18px;
            background: #151620;
        }

        .particleCanvas {
            width: 100%;
            display: block;
        }


        /* =========================================================
           FORCES
           ========================================================= */

        .forceTrack {
            position: relative;
            height: 150px;
            overflow: hidden;
            border-radius: 18px;
            background:
                linear-gradient(
                    to bottom,
                    rgba(105,86,157,.05),
                    rgba(105,86,157,.11)
                );
        }

        .forceLine {
            position: absolute;
            left: 20px;
            right: 20px;
            top: 95px;
            height: 4px;
            border-radius: 999px;
            background: rgba(105,86,157,.24);
        }

        .forceObject {
            position: absolute;
            left: 20px;
            top: 65px;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: #e99b32;
            transition: background-color .2s ease;
        }

        html.darkMode .forceObject {
            background: #69569d;
        }


        /* =========================================================
           ELECTRICITY
           ========================================================= */

        .circuitBoard {
            max-width: 760px;
            margin: 0 auto;
            padding: 20px;
            border-radius: 18px;
            background: #151620;
            color: #f7f4ff;
        }

        .circuitDiagram {
            display: grid;
            grid-template-columns: 1fr auto 1fr auto 1fr;
            align-items: center;
            gap: 10px;
        }

        .circuitPart {
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,.12);
            background: rgba(255,255,255,.04);
            font-weight: 900;
            font-size: 11px;
            text-align: center;
        }

        .circuitPart.active {
            border-color: rgba(95,197,108,.65);
        }

        .circuitWire {
            height: 5px;
            min-width: 32px;
            border-radius: 999px;
            background: rgba(255,255,255,.17);
        }

        .circuitWire.active {
            background: #69d47a;
            box-shadow: 0 0 12px rgba(105,212,122,.55);
        }

        .circuitBulb {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #282b38;
            border: 2px solid rgba(255,255,255,.18);
            margin: auto;
            transition: background-color .2s ease,box-shadow .2s ease;
        }

        .circuitBulb.on {
            background: #ffd86b;
            box-shadow: 0 0 36px rgba(255,216,107,.74);
        }


        /* =========================================================
           WEATHER
           ========================================================= */

        .weatherScene {
            position: relative;
            min-height: 280px;
            overflow: hidden;
            border-radius: 18px;
            background:
                linear-gradient(
                    to bottom,
                    #709dcb,
                    #d7e9f8
                );
        }

        .weatherGround {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 58px;
            background: #72946a;
        }

        .weatherSun {
            position: absolute;
            width: 68px;
            height: 68px;
            border-radius: 50%;
            top: 25px;
            right: 35px;
            background: #ffd86b;
            box-shadow: 0 0 35px rgba(255,216,107,.5);
        }

        .weatherCloud {
            position: absolute;
            width: 100px;
            height: 42px;
            border-radius: 30px;
            background: rgba(255,255,255,.86);
            transition: transform .3s ease,background-color .3s ease;
        }

        .weatherCloud::before,
        .weatherCloud::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: inherit;
        }

        .weatherCloud::before {
            width: 52px;
            height: 52px;
            left: 16px;
            top: -24px;
        }

        .weatherCloud::after {
            width: 42px;
            height: 42px;
            right: 13px;
            top: -17px;
        }

        .weatherCloud.one {
            left: 65px;
            top: 55px;
        }

        .weatherCloud.two {
            left: 255px;
            top: 95px;
        }

        .weatherRain {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 48px;
            height: 145px;
            opacity: 0;
            background:
                repeating-linear-gradient(
                    110deg,
                    transparent 0 13px,
                    rgba(72,127,192,.46) 14px 16px
                );
            transition: opacity .25s ease;
        }


        /* =========================================================
           ROCKS
           ========================================================= */

        .rockPreview {
            width: 160px;
            height: 125px;
            margin: 18px auto;
            border-radius: 38% 55% 44% 60%;
            background: #7d848f;
            transition: background-color .3s ease,transform .3s ease;
        }


        /* =========================================================
           WATER CYCLE
           ========================================================= */

        .waterCycleScene {
            position: relative;
            min-height: 330px;
            overflow: hidden;
            border-radius: 18px;
            background:
                linear-gradient(
                    to bottom,
                    #70a4d4 0 58%,
                    #6b956c 58% 100%
                );
        }

        .waterLake {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 42%;
            background: #3f7eaa;
        }

        .waterCycleSun {
            position: absolute;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: #ffd86b;
            top: 25px;
            right: 35px;
        }

        .waterCloud {
            position: absolute;
            left: 50%;
            top: 58px;
            width: 115px;
            height: 45px;
            transform: translateX(-50%);
            border-radius: 30px;
            background: rgba(255,255,255,.86);
        }

        .waterDrop {
            position: absolute;
            width: 18px;
            height: 24px;
            border-radius: 50% 50% 60% 60%;
            background: #73c4eb;
            left: 50%;
            top: 62%;
            opacity: 0;
            transition: opacity .2s ease;
        }

        .waterStageButtons {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 8px;
            margin-top: 12px;
        }


        /* =========================================================
           SOLAR SYSTEM
           ========================================================= */

        .spaceScene {
            position: relative;
            min-height: 460px;
            overflow: hidden;
            border-radius: 18px;
            background: #090b13;
        }

        .spaceStar {
            position: absolute;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            background: white;
            opacity: .7;
        }

        .solarSun {
            position: absolute;
            width: 72px;
            height: 72px;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
            border-radius: 50%;
            background: #ffd86b;
            box-shadow: 0 0 38px rgba(255,216,107,.44);
        }

        .orbitRing {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 50%;
        }

        .orbitPlanet {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #e99b32;
        }


        /* =========================================================
           GRAVITY
           ========================================================= */

        .gravityScene {
            position: relative;
            min-height: 370px;
            overflow: hidden;
            border-radius: 18px;
            background:
                linear-gradient(
                    to bottom,
                    #93c5e7,
                    #dbeef8
                );
        }

        .gravityGround {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 58px;
            background: #7c9b6c;
        }

        .gravityBall {
            position: absolute;
            width: 42px;
            height: 42px;
            left: 50%;
            bottom: 58px;
            transform: translateX(-50%);
            border-radius: 50%;
            background: #e99b32;
        }


        /* =========================================================
           STARS
           ========================================================= */

        .starLab {
            position: relative;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 18px;
            background: #090b13;
        }

        .starObject {
            width: 125px;
            height: 125px;
            border-radius: 50%;
            background: #ffd86b;
            box-shadow: 0 0 55px rgba(255,216,107,.52);
            transition: background-color .25s ease,box-shadow .25s ease,width .25s ease,height .25s ease;
        }


        /* =========================================================
           ROCKET
           ========================================================= */

        .rocketScene {
            position: relative;
            min-height: 400px;
            overflow: hidden;
            border-radius: 18px;
            background:
                linear-gradient(
                    to bottom,
                    #0c1020,
                    #18264a
                );
        }

        .rocketStars {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 25%,rgba(255,255,255,.75) 0 2px,transparent 3px),
                radial-gradient(circle at 70% 18%,rgba(255,255,255,.7) 0 2px,transparent 3px),
                radial-gradient(circle at 82% 55%,rgba(255,255,255,.7) 0 2px,transparent 3px),
                radial-gradient(circle at 35% 70%,rgba(255,255,255,.65) 0 2px,transparent 3px);
        }

        .rocketBody {
            position: absolute;
            left: 50%;
            bottom: 50px;
            width: 58px;
            height: 125px;
            transform: translateX(-50%);
            border-radius: 50% 50% 18% 18%;
            background: #e8e9ed;
            transition: transform .12s linear;
        }

        .rocketBody::before {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            left: 20px;
            top: 25px;
            border-radius: 50%;
            background: #4c77b7;
            border: 2px solid #bcc4d7;
        }

        .rocketFlame {
            position: absolute;
            left: 50%;
            bottom: 20px;
            width: 24px;
            height: 40px;
            transform: translateX(-50%);
            border-radius: 0 0 15px 15px;
            background: #ff9e45;
            opacity: 0;
        }


        /* =========================================================
           SMALL SCREENS
           ========================================================= */

        @media (
            max-width: 760px
        ) {

            .scienceChoices,
            .scienceFunChoices {
                grid-template-columns: 1fr 1fr;
            }

            .scienceControlRow {
                grid-template-columns: 1fr 70px;
            }

            .scienceControlRow label {
                grid-column: 1 / -1;
            }

            .circuitDiagram {
                grid-template-columns: 1fr;
            }

            .circuitWire {
                width: 6px;
                height: 28px;
                margin: auto;
            }

        }

        @media (
            max-width: 520px
        ) {

            .scienceChoices,
            .scienceFunChoices {
                grid-template-columns: 1fr;
            }

            .scienceInfoGrid {
                grid-template-columns: 1fr;
            }

            .waterStageButtons {
                grid-template-columns: 1fr 1fr;
            }

        }

    </style>

</head>


<body>

    <div class="sunRays"></div>

    <div
        class="stars"
        aria-hidden="true"
    ></div>


    <button
        id="settingsButton"
        class="settingsButton"
        type="button"
    >
        <span id="settingsIcon">
            ⚙
        </span>
    </button>


    <main class="container scienceChallengePage">

        <a
            href="science.html"
            class="backButton"
        >
            ↶
        </a>


        <section class="scienceQuizHeader">

            <h1 id="pageTitle">
                Science Challenge
            </h1>

            <p id="pageSubtitle">
                Loading...
            </p>


            <div class="scienceMeta">

                <span
                    class="scienceMetaPill"
                    id="topicPill"
                >
                    Topic
                </span>

                <span
                    class="scienceMetaPill"
                    id="difficultyPill"
                >
                    Difficulty
                </span>

                <span
                    class="scienceMetaPill"
                    id="modePill"
                >
                    Practice
                </span>

            </div>

        </section>


        <!-- =====================================================
             PRACTICE
             ===================================================== -->

        <section id="quizArea">

            <div class="scienceProgressWrap">

                <div class="scienceProgressTop">

                    <span id="questionCount">
                        Question 1 / 10
                    </span>

                    <span id="scoreText">
                        Score: 0
                    </span>

                </div>


                <div class="scienceProgress">

                    <div
                        class="scienceProgressFill"
                        id="progressFill"
                    ></div>

                </div>

            </div>


            <article class="scienceQuestionCard">

                <div
                    class="scienceQuestionNumber"
                    id="questionNumber"
                >
                    Question 1
                </div>


                <h2
                    class="scienceQuestionPrompt"
                    id="questionPrompt"
                >
                    Loading...
                </h2>


                <div
                    class="scienceChoices"
                    id="choices"
                ></div>


                <div class="scienceHintBox">

                    <button
                        type="button"
                        class="scienceHintButton"
                        id="hintButton"
                    >
                        Need a hint?
                    </button>


                    <p
                        class="scienceHintText"
                        id="hintText"
                        hidden
                    ></p>

                </div>


                <div
                    class="scienceFeedback"
                    id="feedback"
                ></div>


                <div class="scienceActionRow">

                    <button
                        type="button"
                        class="scienceNextButton"
                        id="nextButton"
                        hidden
                    >
                        Next question
                    </button>

                </div>

            </article>

        </section>


        <section
            id="resultArea"
            class="scienceResult"
            hidden
        ></section>


        <!-- =====================================================
             FUN LAB
             ===================================================== -->

        <section
            id="funArea"
            class="scienceFunLab"
            hidden
        ></section>

    </main>


    <script src="user.js"></script>
    <script src="language.js"></script>
    <script src="theme.js"></script>
    <script src="settings.js"></script>
    <script src="scienceQuestions.js"></script>


    <script>

        (() => {

            "use strict";


            const lab =
                window.ScienceLab;


            if (!lab) {
                return;
            }


            const params =
                new URLSearchParams(
                    window.location.search
                );


            const topicId =
                params.get("topic") ||
                "cells";


            const difficultyId =
                params.get("difficulty") ||
                "easy";


            const mode =
                params.get("mode") ||
                "practice";


            const topic =
                lab.getTopic(
                    topicId
                );


            const difficulty =
                lab.getDifficulty(
                    difficultyId
                );


            const quizArea =
                document.getElementById(
                    "quizArea"
                );


            const resultArea =
                document.getElementById(
                    "resultArea"
                );


            const funArea =
                document.getElementById(
                    "funArea"
                );


            function isPortuguese() {

                const language =
                    localStorage.getItem(
                        "siteLanguage"
                    );


                return (
                    language === "pt-BR" ||
                    language === "pt"
                );

            }


            function t(
                en,
                pt
            ) {

                return isPortuguese()
                    ? pt
                    : en;

            }


            document.getElementById(
                "topicPill"
            ).textContent =
                isPortuguese()
                    ? topic.pt
                    : topic.en;


            document.getElementById(
                "difficultyPill"
            ).textContent =
                isPortuguese()
                    ? difficulty.pt
                    : difficulty.en;


            document.getElementById(
                "modePill"
            ).textContent =
                mode === "fun"
                    ? t(
                        "Fun Lab",
                        "Laboratório"
                    )
                    : t(
                        "Practice",
                        "Prática"
                    );


            if (
                mode === "fun"
            ) {

                quizArea.hidden =
                    true;

                initFun();

            } else {

                funArea.hidden =
                    true;

                initPractice();

            }


            /* =================================================
               PRACTICE
               ================================================= */


            function initPractice() {

                document.getElementById(
                    "pageTitle"
                ).textContent =
                    t(
                        "Science Challenge",
                        "Desafio de Ciências"
                    );


                document.getElementById(
                    "pageSubtitle"
                ).textContent =
                    t(
                        "Answer the questions and test what you know.",
                        "Responda às questões e teste o que você sabe."
                    );


                const questions =
                    lab.createQuestions(
                        topic.id,
                        difficulty.id,
                        10
                    );


                let index = 0;
                let score = 0;
                let earned = 1;
                let hintUsed = false;


                const count =
                    document.getElementById(
                        "questionCount"
                    );


                const scoreText =
                    document.getElementById(
                        "scoreText"
                    );


                const progress =
                    document.getElementById(
                        "progressFill"
                    );


                const number =
                    document.getElementById(
                        "questionNumber"
                    );


                const prompt =
                    document.getElementById(
                        "questionPrompt"
                    );


                const choices =
                    document.getElementById(
                        "choices"
                    );


                const hintButton =
                    document.getElementById(
                        "hintButton"
                    );


                const hintText =
                    document.getElementById(
                        "hintText"
                    );


                const feedback =
                    document.getElementById(
                        "feedback"
                    );


                const next =
                    document.getElementById(
                        "nextButton"
                    );


                function formatScore(
                    value
                ) {

                    return Number.isInteger(
                        value
                    )
                        ? String(value)
                        : value.toFixed(1);

                }


                function renderQuestion() {

                    const question =
                        questions[index];


                    earned =
                        1;

                    hintUsed =
                        false;


                    count.textContent =
                        t(
                            `Question ${index + 1} / ${questions.length}`,
                            `Questão ${index + 1} / ${questions.length}`
                        );


                    scoreText.textContent =
                        t(
                            `Score: ${formatScore(score)}`,
                            `Pontuação: ${formatScore(score)}`
                        );


                    progress.style.width =
                        `${
                            (
                                index /
                                questions.length
                            ) * 100
                        }%`;


                    number.textContent =
                        t(
                            `Question ${index + 1}`,
                            `Questão ${index + 1}`
                        );


                    prompt.textContent =
                        question.prompt;


                    choices.innerHTML =
                        "";

                    hintText.innerHTML =
                        "";

                    hintText.hidden =
                        true;

                    feedback.textContent =
                        "";

                    next.hidden =
                        true;

                    hintButton.disabled =
                        false;


                    question.choices.forEach(
                        answer => {

                            const button =
                                document.createElement(
                                    "button"
                                );


                            button.type =
                                "button";


                            button.className =
                                "scienceChoice";


                            button.textContent =
                                answer;


                            button.addEventListener(
                                "click",
                                () => {

                                    choices
                                        .querySelectorAll(
                                            "button"
                                        )
                                        .forEach(
                                            button =>
                                                button.disabled =
                                                    true
                                        );


                                    hintButton.disabled =
                                        true;


                                    if (
                                        String(
                                            answer
                                        ) ===
                                        String(
                                            question.answer
                                        )
                                    ) {

                                        button.classList.add(
                                            "correct"
                                        );


                                        score +=
                                            earned;


                                        feedback.textContent =
                                            t(
                                                hintUsed
                                                    ? "Correct — the hint helped."
                                                    : "Correct!",
                                                hintUsed
                                                    ? "Correto — a dica ajudou."
                                                    : "Correto!"
                                            );

                                    } else {

                                        button.classList.add(
                                            "wrong"
                                        );


                                        const correct =
                                            [
                                                ...choices.querySelectorAll(
                                                    "button"
                                                )
                                            ].find(
                                                item =>
                                                    item.textContent ===
                                                    String(
                                                        question.answer
                                                    )
                                            );


                                        if (
                                            correct
                                        ) {

                                            correct.classList.add(
                                                "correct"
                                            );

                                        }


                                        feedback.textContent =
                                            `${t(
                                                "Not quite.",
                                                "Não foi dessa vez."
                                            )} ${question.explanation}`;

                                    }


                                    scoreText.textContent =
                                        t(
                                            `Score: ${formatScore(score)}`,
                                            `Pontuação: ${formatScore(score)}`
                                        );


                                    next.hidden =
                                        false;

                                }
                            );


                            choices.appendChild(
                                button
                            );

                        }
                    );

                }


                hintButton.addEventListener(
                    "click",
                    () => {

                        if (
                            hintUsed
                        ) {
                            return;
                        }


                        hintUsed =
                            true;

                        earned =
                            .5;


                        hintText.textContent =
                            `${t(
                                "Hint",
                                "Dica"
                            )}: ${questions[index].hint}`;


                        hintText.hidden =
                            false;


                        hintButton.disabled =
                            true;

                    }
                );


                next.addEventListener(
                    "click",
                    () => {

                        index++;


                        if (
                            index >=
                            questions.length
                        ) {

                            finish();

                        } else {

                            renderQuestion();

                        }

                    }
                );


                function finish() {

                    quizArea.hidden =
                        true;


                    resultArea.hidden =
                        false;


                    progress.style.width =
                        "100%";


                    const perfect =
                        score ===
                        questions.length;


                    resultArea.innerHTML = `

                        <h2>
                            ${
                                t(
                                    "Challenge complete!",
                                    "Desafio concluído!"
                                )
                            }
                        </h2>

                        <div class="scienceScore">
                            ${
                                formatScore(
                                    score
                                )
                            }/
                            ${questions.length}
                        </div>

                        <p>
                            ${
                                perfect
                                    ? t(
                                        "You got every question right.",
                                        "Você acertou todas as questões."
                                    )
                                    : score >= 7
                                        ? t(
                                            "Great work. Keep exploring.",
                                            "Muito bom. Continue explorando."
                                        )
                                        : t(
                                            "Keep practicing and experimenting.",
                                            "Continue praticando e experimentando."
                                        )
                            }
                        </p>

                        <p>
                            ${
                                t(
                                    "A used hint makes that question worth half credit.",
                                    "Uma dica usada faz aquela questão valer meio ponto."
                                )
                            }
                        </p>

                        <div class="scienceActionRow">

                            <a
                                href="science.html"
                                class="scienceBackButton"
                            >
                                ${
                                    t(
                                        "Back to Science",
                                        "Voltar para Ciências"
                                    )
                                }
                            </a>

                            <a
                                href="scienceQuiz.html?topic=${encodeURIComponent(topic.id)}&difficulty=${encodeURIComponent(difficulty.id)}&mode=practice"
                                class="scienceNextButton"
                                style="
                                    text-decoration:none;
                                    display:inline-flex;
                                    align-items:center;
                                    justify-content:center;
                                "
                            >
                                ${
                                    t(
                                        "Try again",
                                        "Tentar novamente"
                                    )
                                }
                            </a>

                        </div>

                    `;

                }


                renderQuestion();

            }


            /* =================================================
               FUN LAB SETUP
               ================================================= */


            function initFun() {

                funArea.hidden = false;

                document.getElementById(
                    "pageTitle"
                ).textContent =
                    t(
                        "Science Fun Lab",
                        "Laboratório Divertido de Ciências"
                    );


                document.getElementById(
                    "pageSubtitle"
                ).textContent =
                    t(
                        "Experiment with the idea instead of only answering questions.",
                        "Experimente o conceito em vez de apenas responder questões."
                    );


                funArea.innerHTML = `

                    <div class="scienceFunIntro">

                        <h2>
                            ${
                                isPortuguese()
                                    ? topic.pt
                                    : topic.en
                            }
                        </h2>

                        <p>
                            ${funDescription()}
                        </p>

                    </div>

                    <div class="scienceFunCard">

                        <div
                            id="scienceFunContent"
                        ></div>

                    </div>

                `;


                const root =
                    document.getElementById(
                        "scienceFunContent"
                    );


                const labs = {

                    cells:
                        buildCellsLab,

                    "human-body":
                        buildHumanBodyLab,

                    ecosystems:
                        buildEcosystemLab,

                    genetics:
                        buildGeneticsLab,

                    matter:
                        buildMatterLab,

                    forces:
                        buildForcesLab,

                    energy:
                        buildEnergyLab,

                    electricity:
                        buildElectricityLab,

                    "earth-systems":
                        buildEarthSystemsLab,

                    weather:
                        buildWeatherLab,

                    rocks:
                        buildRocksLab,

                    "water-cycle":
                        buildWaterCycleLab,

                    "solar-system":
                        buildSolarSystemLab,

                    gravity:
                        buildGravityLab,

                    stars:
                        buildStarsLab,

                    "space-exploration":
                        buildSpaceLab

                };


                (
                    labs[
                        topic.id
                    ] ||
                    buildCellsLab
                )(
                    root
                );

            }


            function funDescription() {

                const map = {

                    cells:
                        t(
                            "Build a living cell while keeping it healthy.",
                            "Monte uma célula mantendo-a saudável."
                        ),

                    "human-body":
                        t(
                            "Route organs through the right body systems.",
                            "Encaminhe os órgãos pelos sistemas corretos."
                        ),

                    ecosystems:
                        t(
                            "Change populations and watch an ecosystem react.",
                            "Mude as populações e veja o ecossistema reagir."
                        ),

                    genetics:
                        t(
                            "Build a Punnett square and explore possible traits.",
                            "Monte um quadro de Punnett e explore possíveis características."
                        ),

                    matter:
                        t(
                            "Heat or cool the particle system and watch it change state.",
                            "Aqueça ou resfrie o sistema de partículas e veja o estado mudar."
                        ),

                    forces:
                        t(
                            "Push an object and see how friction changes its motion.",
                            "Empurre um objeto e veja como o atrito muda seu movimento."
                        ),

                    energy:
                        t(
                            "Convert energy between different forms.",
                            "Converta energia entre diferentes formas."
                        ),

                    electricity:
                        t(
                            "Build the circuit and make the bulb light.",
                            "Monte o circuito e faça a lâmpada acender."
                        ),

                    "earth-systems":
                        t(
                            "Change Earth's systems and watch their relationships respond.",
                            "Mude os sistemas da Terra e veja suas relações reagirem."
                        ),

                    weather:
                        t(
                            "Create different weather by changing atmospheric conditions.",
                            "Crie diferentes condições de tempo mudando a atmosfera."
                        ),

                    rocks:
                        t(
                            "Change heat, pressure, and cooling to transform rocks.",
                            "Mude calor, pressão e resfriamento para transformar rochas."
                        ),

                    "water-cycle":
                        t(
                            "Move water through the complete water cycle.",
                            "Mova a água por todo o ciclo da água."
                        ),

                    "solar-system":
                        t(
                            "Control an orbit and watch the planet move.",
                            "Controle uma órbita e veja o planeta se mover."
                        ),

                    gravity:
                        t(
                            "Change gravity and watch the same jump behave differently.",
                            "Mude a gravidade e veja o mesmo salto se comportar de forma diferente."
                        ),

                    stars:
                        t(
                            "Change a star's temperature and luminosity.",
                            "Mude a temperatura e a luminosidade de uma estrela."
                        ),

                    "space-exploration":
                        t(
                            "Launch a rocket and balance thrust with fuel.",
                            "Lance um foguete equilibrando impulso e combustível."
                        )

                };


                return (
                    map[
                        topic.id
                    ] ||
                    map.cells
                );

            }


            function createPanel(
                title,
                description
            ) {

                const panel =
                    document.createElement(
                        "div"
                    );

                panel.className =
                    "scienceFunPanel";


                const heading =
                    document.createElement(
                        "h3"
                    );

                heading.textContent =
                    title;


                const text =
                    document.createElement(
                        "p"
                    );

                text.className =
                    "scienceFunDescription";


                text.textContent =
                    description;


                panel.append(
                    heading,
                    text
                );


                return panel;

            }


            function createStatus(
                parent
            ) {

                const status =
                    document.createElement(
                        "div"
                    );

                status.className =
                    "scienceFunStatus";


                parent.appendChild(
                    status
                );


                return status;

            }


            function makeRange(
                label,
                min,
                max,
                value,
                decimals = 0
            ) {

                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "scienceControlRow";


                const labelNode =
                    document.createElement(
                        "label"
                    );

                labelNode.textContent =
                    label;


                const input =
                    document.createElement(
                        "input"
                    );

                input.type =
                    "range";

                input.min =
                    min;

                input.max =
                    max;

                input.value =
                    value;

                input.step =
                    decimals > 0
                        ? "0.1"
                        : "1";

                input.className =
                    "scienceRange";


                const output =
                    document.createElement(
                        "div"
                    );

                output.className =
                    "scienceControlValue";


                output.textContent =
                    Number(
                        value
                    ).toFixed(
                        decimals
                    );


                input.addEventListener(
                    "input",
                    () => {

                        output.textContent =
                            Number(
                                input.value
                            ).toFixed(
                                decimals
                            );

                    }
                );


                row.append(
                    labelNode,
                    input,
                    output
                );


                return {

                    row,
                    input,
                    output

                };

            }


            function makeButton(
                text
            ) {

                const button =
                    document.createElement(
                        "button"
                    );

                button.type =
                    "button";

                button.className =
                    "scienceFunButton";

                button.textContent =
                    text;


                return button;

            }


            /* =================================================
               CELLS
               ================================================= */


            function buildCellsLab() {
    const root = document.getElementById("funArea");

    if (!root) {
        console.error("Cells Lab: #funArea was not found.");
        return;
    }

    root.hidden = false;

    const isPortuguese =
        localStorage.getItem("siteLanguage") === "pt-BR" ||
        localStorage.getItem("siteLanguage") === "pt";

    const t = (english, portuguese) =>
        isPortuguese ? portuguese : english;

    root.innerHTML = `
        <style>

            .cellsLab {
                width: 100%;
                max-width: 1000px;
                margin: 0 auto;
            }

            .cellsLabHeader {
                text-align: center;
                margin-bottom: 18px;
            }

            .cellsLabHeader h2 {
                margin: 0 0 6px;
                font-size: 24px;
            }

                margin: 0;
                opacity: 0.72;
                line-height: 1.5;
            }

            .cellsLabMain {
                display: grid;
                grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.8fr);
                gap: 18px;
                align-items: start;
            }

            .cellsLabVisualCard,
            .cellsLabTaskCard {
                border-radius: 18px;
                border: 1px solid rgba(70, 55, 45, 0.10);
                background: rgba(255, 255, 255, 0.58);
                box-shadow: 0 10px 28px rgba(60, 45, 30, 0.08);
                backdrop-filter: blur(8px);
            }

            .cellsLabVisualCard {
                padding: 18px;
            }

            .cellsLabTaskCard {
                padding: 18px;
            }

            .cellsLabStatusRow {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                margin-bottom: 14px;
                flex-wrap: wrap;
            }

            .cellsLabHealth {
                flex: 1;
                min-width: 180px;
            }

            .cellsLabHealthLabel {
                display: flex;
                justify-content: space-between;
                gap: 10px;
                font-size: 12px;
                font-weight: 800;
                margin-bottom: 6px;
            }

            .cellsLabHealthTrack {
                height: 10px;
                border-radius: 999px;
                overflow: hidden;
                background: rgba(50, 45, 40, 0.12);
            }

            .cellsLabHealthFill {
                width: 100%;
                height: 100%;
                border-radius: inherit;
                background: linear-gradient(
                    90deg,
                    #72b977,
                    #a9d86d
                );
                transition:
                    width 0.25s ease,
                    background 0.25s ease;
            }

            .cellsLabStage {
                position: relative;
                width: 100%;
                min-height: 470px;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                border-radius: 16px;
                background:
                    radial-gradient(
                        circle at 50% 45%,
                        rgba(255,255,255,0.92),
                        rgba(236,229,215,0.52)
                    );
            }

            .cellsLabGlow {
                position: absolute;
                width: 360px;
                height: 360px;
                border-radius: 50%;
                background: rgba(202, 231, 193, 0.25);
                filter: blur(28px);
                transition:
                    transform 0.4s ease,
                    opacity 0.4s ease;
            }

            .cellsLabCell {
                position: relative;
                width: min(390px, 80%);
                aspect-ratio: 1 / 0.84;
                border-radius: 47% 53% 51% 49% / 48% 44% 56% 52%;
                border: 7px solid #6f9c83;
                background:
                    radial-gradient(
                        circle at 42% 36%,
                        rgba(250, 255, 245, 0.92),
                        rgba(204, 231, 201, 0.78) 42%,
                        rgba(159, 201, 170, 0.82) 100%
                    );
                box-shadow:
                    inset 0 0 0 9px rgba(255,255,255,0.25),
                    inset 0 0 35px rgba(67, 112, 85, 0.16),
                    0 16px 35px rgba(40, 65, 50, 0.18);
                transition:
                    filter 0.25s ease,
                    transform 0.25s ease,
                    border-color 0.25s ease,
                    box-shadow 0.25s ease;
            }

            .cellsLabCell::before {
                content: "";
                position: absolute;
                inset: 15px;
                border-radius: inherit;
                border: 2px dashed rgba(88, 133, 101, 0.22);
                pointer-events: none;
            }

            .cellsLabCell::after {
                content: "";
                position: absolute;
                inset: 0;
                border-radius: inherit;
                pointer-events: none;
                opacity: 0;
                background:
                    radial-gradient(
                        circle at 20% 30%,
                        rgba(190, 74, 74, 0.45) 0 3px,
                        transparent 4px
                    ),
                    radial-gradient(
                        circle at 74% 24%,
                        rgba(190, 74, 74, 0.40) 0 4px,
                        transparent 5px
                    ),
                    radial-gradient(
                        circle at 66% 72%,
                        rgba(190, 74, 74, 0.38) 0 3px,
                        transparent 4px
                    ),
                    radial-gradient(
                        circle at 31% 79%,
                        rgba(190, 74, 74, 0.35) 0 4px,
                        transparent 5px
                    );
                transition: opacity 0.35s ease;
            }

            .cellsLabOrganelle {
                position: absolute;
                transition:
                    filter 0.25s ease,
                    transform 0.25s ease,
                    opacity 0.25s ease;
            }

            .cellsLabNucleus {
                left: 36%;
                top: 28%;
                width: 28%;
                height: 40%;
                border-radius: 46% 54% 50% 50%;
                border: 4px solid #735d91;
                background:
                    radial-gradient(
                        circle at 42% 40%,
                        #c2a7d7,
                        #9878b7 65%,
                        #765a94 100%
                    );
                box-shadow:
                    inset 0 0 15px rgba(65, 40, 80, 0.18),
                    0 6px 16px rgba(82, 56, 98, 0.16);
            }

            .cellsLabNucleolus {
                left: 31%;
                top: 32%;
                width: 25%;
                height: 27%;
                border-radius: 50%;
                background:
                    radial-gradient(
                        circle at 35% 35%,
                        #e9d7f1,
                        #b88ccd 65%,
                        #9261ac 100%
                    );
                box-shadow:
                    0 0 8px rgba(116, 74, 141, 0.22);
            }

            .cellsLabMito {
                width: 10%;
                height: 5.5%;
                border-radius: 55% 45% 55% 45%;
                border: 3px solid #bd8454;
                background:
                    repeating-linear-gradient(
                        90deg,
                        #e1ae73 0 4px,
                        #9f653f 4px 7px
                    );

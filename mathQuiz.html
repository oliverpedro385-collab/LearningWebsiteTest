<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <script>
        if (
            localStorage.getItem(
                "darkMode"
            ) === "true"
        ) {
            document.documentElement.classList.add(
                "darkMode"
            );
        }
    </script>


    <link
        rel="stylesheet"
        href="style.css"
    >


    <title>
        Math Quiz
    </title>

</head>


<body>


    <!-- BACK -->

    <a
        href="math.html"
        class="backButton"
    >
        ↶
    </a>



    <!-- SETTINGS -->

    <button
        id="settingsButton"
        class="settingsButton"
    >

        <span id="settingsIcon">
            ⚙
        </span>

    </button>



    <!-- QUIZ -->

    <div class="container">


        <div class="subjectHeading">


            <span
                class="subjectSmallTitle"
                id="gradeLabel"
            >
                Mid-Day • Grade
            </span>


            <h1 data-i18n="math">
                Math
            </h1>


        </div>



        <h2 id="question">
            Question goes here
        </h2>



        <div id="answers"></div>



        <p id="result"></p>



        <button
            id="nextButton"
            onclick="loadQuestion()"
            style="display: none;"
            data-i18n="nextQuestion"
        >
            Next Question
        </button>


    </div>



    <!-- SCRIPTS -->

    <script src="user.js"></script>

    <script src="language.js"></script>

    <script src="theme.js"></script>

    <script src="settings.js"></script>

    <script src="mathQuestions.js"></script>


</body>

</html>

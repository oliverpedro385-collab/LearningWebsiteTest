<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Math Quiz</title>

    <script>
        if (
            localStorage.getItem("darkMode") === "true"
        ) {
            document.documentElement.classList.add("darkMode");
        }
    </script>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- Back Button -->

    <a
        href="math.html"
        class="backButton"
        aria-label="Back"
    >
        ↶
    </a>



    <!-- Settings -->

    <button
        id="settingsButton"
        class="settingsButton"
        aria-label="Settings"
    >
        ⚙
    </button>



    <!-- Main Quiz Container -->

    <main
        class="container"
        id="quizContainer"
    >


        <!-- Subject Heading -->

        <div class="subjectHeading">

            <div
                class="subjectEyebrow"
                id="gradeLabel"
            >
                Mid-Day • Grade 1
            </div>

            <h1 data-i18n="math">
                Math
            </h1>

        </div>



        <!-- Progress -->

        <div class="quizProgress">

            <div
                class="quizProgressText"
                id="progressText"
            >
                Question 1 of 10
            </div>

            <div class="quizProgressBar">

                <div
                    class="quizProgressFill"
                    id="quizProgressFill"
                ></div>

            </div>

        </div>



        <!-- Question -->

        <h2 id="question">
            Loading question...
        </h2>



        <!-- Hint Assistant -->

        <div
            id="hintAssistant"
            class="hintAssistant"
        >

            <div
                class="assistantFace"
                id="assistantFace"
            >
                :)
            </div>


            <div class="assistantContent">

                <strong id="hintTitle">
                    Need a hint?
                </strong>

                <p
                    id="hintText"
                    class="hintText"
                >
                    I'm here to help!
                </p>

                <button
                    id="hintButton"
                    class="hintButton"
                    type="button"
                >
                    Show Hint
                </button>

            </div>

        </div>



        <!-- Answers -->

        <div
            id="answers"
            class="answerContainer"
        ></div>



        <!-- Result -->

        <p
            id="result"
            class="quizResult"
        ></p>



        <!-- Next Question -->

        <button
            id="nextButton"
            class="nextButton"
            type="button"
            data-i18n="nextQuestion"
        >
            Next Question
        </button>


    </main>



    <!-- Scripts -->

    <script src="user.js"></script>
    <script src="language.js"></script>
    <script src="theme.js"></script>
    <script src="settings.js"></script>
    <script src="mathQuestions.js"></script>


</body>

</html>

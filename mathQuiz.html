<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <script>

        if (
            localStorage.getItem("darkMode") === "true"
        ) {

            document.documentElement.classList.add(
                "darkMode"
            );

        }

    </script>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <title>
        Math Challenge
    </title>


    <style>

        .mathChallengePage {

            max-width:
                1050px;

            position:
                relative;

            z-index:
                1;

        }


        .mathQuizHeader {

            text-align:
                center;

            max-width:
                800px;

            margin:
                25px auto 20px;

        }


        .mathQuizHeader h1 {

            margin-bottom:
                8px;

        }


        .mathQuizHeader p {

            margin:
                0;

            opacity:
                .7;

            line-height:
                1.5;

        }


        .mathMeta {

            display:
                flex;

            justify-content:
                center;

            flex-wrap:
                wrap;

            gap:
                8px;

            margin-top:
                13px;

        }


        .mathMetaPill {

            min-height:
                29px;

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                5px 10px;

            border-radius:
                999px;

            background:
                rgba(105,86,157,.10);

            font-size:
                10px;

            font-weight:
                900;

        }


        .mathProgressWrap {

            max-width:
                760px;

            margin:
                20px auto;

        }


        .mathProgressTop {

            display:
                flex;

            justify-content:
                space-between;

            gap:
                10px;

            font-size:
                11px;

            font-weight:
                800;

            opacity:
                .7;

            margin-bottom:
                7px;

        }


        .mathProgress {

            height:
                9px;

            border-radius:
                999px;

            overflow:
                hidden;

            background:
                rgba(105,86,157,.10);

        }


        .mathProgressFill {

            height:
                100%;

            width:
                0;

            border-radius:
                inherit;

            background:
                #e99b32;

            transition:
                width .3s ease;

        }


        html.darkMode .mathProgressFill {

            background:
                #69569d;

        }


        .mathQuestionCard {

            max-width:
                780px;

            margin:
                0 auto;

            background:
                var(--container-color);

            border-radius:
                22px;

            padding:
                24px;

            box-shadow:
                0 10px 28px rgba(0,0,0,.07);

        }


        .mathQuestionNumber {

            font-size:
                11px;

            text-transform:
                uppercase;

            letter-spacing:
                .08em;

            font-weight:
                900;

            opacity:
                .52;

            margin-bottom:
                10px;

        }


        .mathQuestionPrompt {

            font-size:
                clamp(
                    20px,
                    3vw,
                    30px
                );

            font-weight:
                900;

            line-height:
                1.3;

            margin:
                0 0 20px;

        }


        .mathChoices {

            display:
                grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(0,1fr)
                );

            gap:
                10px;

        }


        .mathChoice {

            min-height:
                58px;

            border:
                1px solid rgba(100,90,120,.14);

            border-radius:
                14px;

            background:
                transparent;

            color:
                var(--text-color);

            font:
                inherit;

            font-weight:
                800;

            cursor:
                pointer;

            padding:
                10px 13px;

            transition:
                transform .15s ease,
                background-color .2s ease,
                border-color .2s ease;

        }


        .mathChoice:hover:not(:disabled) {

            transform:
                translateY(-2px);

            background:
                rgba(233,155,50,.10);

        }


        .mathChoice:disabled {

            cursor:
                default;

        }


        .mathChoice.correct {

            background:
                rgba(95,197,108,.14);

            border-color:
                rgba(95,197,108,.42);

        }


        .mathChoice.wrong {

            background:
                rgba(212,98,97,.13);

            border-color:
                rgba(212,98,97,.40);

        }


        .mathHintBox {

            margin-top:
                17px;

            padding:
                14px;

            border-radius:
                14px;

            background:
                rgba(105,86,157,.07);

            border:
                1px solid rgba(105,86,157,.11);

        }


        .mathHintButton,
        .mathNextButton,
        .mathBackButton,
        .mathCheckButton {

            min-height:
                42px;

            padding:
                9px 15px;

            border:
                none;

            border-radius:
                11px;

            font:
                inherit;

            font-weight:
                900;

            cursor:
                pointer;

            transition:
                transform .15s ease,
                background-color .2s ease;

        }


        .mathHintButton {

            background:
                rgba(105,86,157,.12);

            color:
                var(--text-color);

        }


        .mathNextButton,
        .mathCheckButton {

            background:
                #e99b32;

            color:
                white;

        }


        html.darkMode
        .mathNextButton,
        html.darkMode
        .mathCheckButton {

            background:
                #69569d;

            color:
                #f5f0ff;

        }


        .mathBackButton {

            text-decoration:
                none;

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                rgba(105,86,157,.10);

            color:
                var(--text-color);

        }


        .mathHintButton:hover,
        .mathNextButton:hover,
        .mathBackButton:hover,
        .mathCheckButton:hover {

            transform:
                translateY(-2px);

        }


        .mathHintText {

            margin:
                10px 0 0;

            line-height:
                1.5;

            font-size:
                13px;

            opacity:
                .76;

        }


        .mathFeedback {

            min-height:
                28px;

            margin-top:
                15px;

            font-weight:
                800;

            line-height:
                1.45;

        }


        .mathActionRow {

            display:
                flex;

            justify-content:
                center;

            gap:
                10px;

            flex-wrap:
                wrap;

            margin-top:
                18px;

        }


        .mathResult {

            max-width:
                760px;

            margin:
                22px auto 0;

            text-align:
                center;

            background:
                var(--container-color);

            border-radius:
                22px;

            padding:
                25px;

            box-shadow:
                0 10px 28px rgba(0,0,0,.07);

        }


        .mathScore {

            font-size:
                44px;

            font-weight:
                1000;

            margin:
                4px 0;

        }


        .mathResult p {

            opacity:
                .7;

            line-height:
                1.5;

        }


        /* =====================================================
           FUN LAB
           ===================================================== */

        .funLab {

            max-width:
                980px;

            margin:
                0 auto;

        }


        .funIntro {

            text-align:
                center;

            max-width:
                760px;

            margin:
                0 auto 17px;

        }


        .funIntro h2 {

            margin:
                0 0 7px;

        }


        .funIntro p {

            margin:
                0;

            opacity:
                .7;

            line-height:
                1.5;

        }


        .funCard {

            background:
                var(--container-color);

            border-radius:
                22px;

            padding:
                20px;

            box-shadow:
                0 10px 28px rgba(0,0,0,.07);

        }


        .funPanel {

            background:
                rgba(105,86,157,.06);

            border-radius:
                16px;

            padding:
                15px;

            margin-bottom:
                12px;

        }


        .funPanel:last-child {

            margin-bottom:
                0;

        }


        .funPanel h3 {

            margin:
                0 0 7px;

        }


        .funDescription {

            margin:
                0;

            opacity:
                .7;

            line-height:
                1.5;

            font-size:
                13px;

        }


        .funTarget {

            font-size:
                clamp(
                    26px,
                    5vw,
                    44px
                );

            font-weight:
                1000;

            text-align:
                center;

            margin:
                8px 0 14px;

        }


        .funChoices {

            display:
                grid;

            grid-template-columns:
                repeat(
                    4,
                    minmax(0,1fr)
                );

            gap:
                10px;

        }


        .funChoice {

            min-height:
                65px;

            border:
                1px solid rgba(100,90,120,.13);

            border-radius:
                14px;

            background:
                transparent;

            color:
                var(--text-color);

            font:
                inherit;

            font-weight:
                900;

            cursor:
                pointer;

            transition:
                transform .15s ease,
                background-color .2s ease;

        }


        .funChoice:hover {

            transform:
                translateY(-3px);

            background:
                rgba(233,155,50,.10);

        }


        .funChoice.selected {

            background:
                rgba(105,86,157,.15);

            border-color:
                rgba(105,86,157,.35);

        }


        .funChoice.correct {

            background:
                rgba(95,197,108,.15);

            border-color:
                rgba(95,197,108,.45);

        }


        .funChoice.wrong {

            background:
                rgba(212,98,97,.14);

            border-color:
                rgba(212,98,97,.4);

        }


        .funControls {

            display:
                grid;

            gap:
                10px;

        }


        .funControlRow {

            display:
                grid;

            grid-template-columns:
                120px minmax(0,1fr) 80px;

            align-items:
                center;

            gap:
                10px;

        }


        .funControlRow label {

            font-size:
                12px;

            font-weight:
                900;

        }


        .funControlValue {

            font-weight:
                900;

            text-align:
                right;

        }


        .funRange {

            width:
                100%;

        }


        .funButton {

            min-height:
                44px;

            padding:
                9px 15px;

            border:
                none;

            border-radius:
                11px;

            background:
                #e99b32;

            color:
                white;

            font:
                inherit;

            font-weight:
                900;

            cursor:
                pointer;

        }


        html.darkMode .funButton {

            background:
                #69569d;

        }


        .funButton.secondary {

            background:
                rgba(105,86,157,.11);

            color:
                var(--text-color);

        }


        .funStatus {

            min-height:
                27px;

            margin-top:
                12px;

            font-weight:
                800;

            line-height:
                1.45;

        }


        .funMachine {

            display:
                grid;

            grid-template-columns:
                1fr
                auto
                1fr;

            align-items:
                center;

            gap:
                12px;

            margin:
                15px 0;

        }


        .funMachineBox {

            min-height:
                90px;

            border-radius:
                17px;

            background:
                rgba(105,86,157,.08);

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                12px;

            text-align:
                center;

            font-weight:
                900;

        }


        .funMachineArrow {

            font-size:
                25px;

            opacity:
                .55;

        }


        .funNumberDisplay {

            text-align:
                center;

            font-size:
                34px;

            font-weight:
                1000;

            margin:
                8px 0;

        }


        .funFraction {

            display:
                flex;

            flex-direction:
                column;

            gap:
                3px;

            margin:
                12px auto;

            max-width:
                400px;

        }


        .funFractionRow {

            display:
                flex;

            gap:
                4px;

        }


        .funFractionPiece {

            flex:
                1;

            height:
                40px;

            border:
                none;

            border-radius:
                7px;

            background:
                rgba(105,86,157,.08);

            cursor:
                pointer;

        }


        .funFractionPiece.filled {

            background:
                #e99b32;

        }


        html.darkMode
        .funFractionPiece.filled {

            background:
                #69569d;

        }


        .funSlots {

            display:
                grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap:
                10px;

        }


        .funSlot {

            border:
                1px solid rgba(100,90,120,.14);

            border-radius:
                12px;

            padding:
                10px;

            text-align:
                center;

        }


        .funSlot strong {

            display:
                block;

            font-size:
                11px;

            opacity:
                .6;

            margin-bottom:
                5px;

        }


        .funSlot span {

            font-size:
                24px;

            font-weight:
                1000;

        }


        .funCanvasWrap {

            background:
                #151620;

            border-radius:
                17px;

            padding:
                8px;

            overflow:
                hidden;

        }


        .funCanvas {

            display:
                block;

            width:
                100%;

            height:
                auto;

            background:
                #151620;

            border-radius:
                12px;

            touch-action:
                none;

        }


        .funEquationRow {

            display:
                grid;

            grid-template-columns:
                minmax(0,1fr)
                auto;

            gap:
                8px;

            margin-top:
                9px;

        }


        .funInput {

            width:
                100%;

            min-height:
                43px;

            box-sizing:
                border-box;

            border:
                1px solid rgba(100,90,120,.18);

            border-radius:
                10px;

            background:
                var(--container-color);

            color:
                var(--text-color);

            padding:
                9px 11px;

            font:
                inherit;

        }


        .funSmallGrid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(0,1fr)
                );

            gap:
                9px;

        }


        .funInfoGrid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    3,
                    minmax(0,1fr)
                );

            gap:
                9px;

        }


        .funInfoBox {

            padding:
                12px;

            border-radius:
                12px;

            background:
                rgba(105,86,157,.07);

            text-align:
                center;

        }


        .funInfoBox strong {

            display:
                block;

            font-size:
                10px;

            opacity:
                .58;

            margin-bottom:
                5px;

        }


        .funInfoBox span {

            font-size:
                20px;

            font-weight:
                1000;

        }


        .funShapeGrid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    4,
                    minmax(0,1fr)
                );

            gap:
                9px;

        }


        .funShapeButton {

            min-height:
                62px;

            border:
                1px solid rgba(100,90,120,.14);

            border-radius:
                12px;

            background:
                transparent;

            color:
                var(--text-color);

            font:
                inherit;

            font-weight:
                900;

            cursor:
                pointer;

        }


        .funShapeButton.active {

            background:
                rgba(105,86,157,.14);

            border-color:
                rgba(105,86,157,.35);

        }


        .funShapePreview {

            min-height:
                150px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            margin-bottom:
                12px;

        }


        .shapeTriangle {

            width:
                0;

            height:
                0;

            border-left:
                70px solid transparent;

            border-right:
                70px solid transparent;

            border-bottom:
                120px solid #e99b32;

        }


        .shapeSquare {

            width:
                120px;

            height:
                120px;

            background:
                #69569d;

        }


        .shapePentagon {

            width:
                120px;

            height:
                120px;

            background:
                #5fc56c;

            clip-path:
                polygon(
                    50% 0%,
                    100% 38%,
                    82% 100%,
                    18% 100%,
                    0% 38%
                );

        }


        .shapeHexagon {

            width:
                130px;

            height:
                115px;

            background:
                #d46261;

            clip-path:
                polygon(
                    25% 0,
                    75% 0,
                    100% 50%,
                    75% 100%,
                    25% 100%,
                    0 50%
                );

        }


        .funAngle {

            width:
                190px;

            height:
                190px;

            position:
                relative;

            margin:
                5px auto;

        }


        .funAngle::before,
        .funAngle::after {

            content:
                "";

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            height:
                4px;

            width:
                75px;

            transform-origin:
                left center;

            border-radius:
                999px;

            background:
                #69569d;

        }


        .funAngle::before {

            transform:
                rotate(0deg);

        }


        .funAngle::after {

            transform:
                rotate(
                    var(
                        --angle,
                        45deg
                    )
                );

        }


        .funAngleCenter {

            position:
                absolute;

            left:
                calc(50% - 5px);

            top:
                calc(50% - 5px);

            width:
                10px;

            height:
                10px;

            border-radius:
                50%;

            background:
                #e99b32;

        }


        .funMap {

            width:
                min(
                    100%,
                    620px
                );

            margin:
                0 auto;

            aspect-ratio:
                1;

            border-radius:
                16px;

            background:
                #151620;

            position:
                relative;

            overflow:
                hidden;

        }


        .funMapCanvas {

            display:
                block;

            width:
                100%;

            height:
                100%;

            touch-action:
                none;

        }


        .funArtEquations {

            display:
                grid;

            gap:
                8px;

        }


        @media (
            max-width: 760px
        ) {

            .mathChoices,
            .funChoices {

                grid-template-columns:
                    1fr 1fr;

            }


            .funMachine {

                grid-template-columns:
                    1fr;

            }


            .funMachineArrow {

                transform:
                    rotate(90deg);

            }


            .funControlRow {

                grid-template-columns:
                    1fr
                    70px;

            }


            .funControlRow label {

                grid-column:
                    1 /
                    -1;

            }

        }


        @media (
            max-width: 520px
        ) {

            .mathChoices,
            .funChoices {

                grid-template-columns:
                    1fr;

            }


            .funInfoGrid {

                grid-template-columns:
                    1fr;

            }


            .funShapeGrid {

                grid-template-columns:
                    1fr 1fr;

            }


            .funSmallGrid {

                grid-template-columns:
                    1fr;

            }

        }

    </style>

</head>


<body>

    <div class="sunRays"></div>

    <div
        class="stars"
        aria-hidden="true"
    ></div>


    <button
        id="settingsButton"
        class="settingsButton"
        type="button"
    >

        <span
            id="settingsIcon"
        >
            ⚙
        </span>

    </button>


    <main class="container mathChallengePage">

        <a
            href="math.html"
            class="backButton"
        >
            ↶
        </a>


        <section class="mathQuizHeader">

            <h1 id="pageTitle">
                Math Challenge
            </h1>

            <p id="pageSubtitle">
                Loading...
            </p>


            <div class="mathMeta">

                <span
                    class="mathMetaPill"
                    id="topicPill"
                >
                    Topic
                </span>

                <span
                    class="mathMetaPill"
                    id="difficultyPill"
                >
                    Difficulty
                </span>

                <span
                    class="mathMetaPill"
                    id="modePill"
                >
                    Practice
                </span>

            </div>

        </section>


        <section id="quizArea">

            <div class="mathProgressWrap">

                <div class="mathProgressTop">

                    <span id="questionCount">
                        Question 1 / 10
                    </span>

                    <span id="scoreText">
                        Score: 0
                    </span>

                </div>


                <div class="mathProgress">

                    <div
                        class="mathProgressFill"
                        id="progressFill"
                    ></div>

                </div>

            </div>


            <article
                class="mathQuestionCard"
                id="questionCard"
            >

                <div
                    class="mathQuestionNumber"
                    id="questionNumber"
                >
                    Question 1
                </div>


                <h2
                    class="mathQuestionPrompt"
                    id="questionPrompt"
                >
                    Loading...
                </h2>


                <div
                    class="mathChoices"
                    id="choices"
                ></div>


                <div class="mathHintBox">

                    <button
                        class="mathHintButton"
                        id="hintButton"
                        type="button"
                    >
                        Need a hint?
                    </button>


                    <p
                        class="mathHintText"
                        id="hintText"
                        hidden
                    ></p>

                </div>


                <div
                    class="mathFeedback"
                    id="feedback"
                ></div>


                <div class="mathActionRow">

                    <button
                        class="mathNextButton"
                        id="nextButton"
                        type="button"
                        hidden
                    >
                        Next question
                    </button>

                </div>

            </article>

        </section>


        <section
            id="resultArea"
            class="mathResult"
            hidden
        ></section>


        <section
            id="funArea"
            class="funLab"
            hidden
        ></section>

    </main>


    <script src="user.js"></script>
    <script src="language.js"></script>
    <script src="theme.js"></script>
    <script src="settings.js"></script>
    <script src="mathQuestions.js"></script>


    <script>

        (() => {

            "use strict";


            const lab =
                window.MathLab;


            if (!lab) {
                return;
            }


            function isPortuguese() {

                const language =
                    localStorage.getItem(
                        "siteLanguage"
                    );

                return (
                    language === "pt-BR" ||
                    language === "pt"
                );
            }


            function t(
                en,
                pt
            ) {

                return isPortuguese()
                    ? pt
                    : en;
            }


            const params =
                new URLSearchParams(
                    window.location.search
                );


            const topicId =
                params.get("topic") ||
                "addition";


            const difficultyId =
                params.get("difficulty") ||
                "easy";


            const mode =
                params.get("mode") ||
                "practice";


            const topic =
                lab.getTopic(
                    topicId
                );


            const difficulty =

            function initPractice() {

                pageTitle.textContent =
                    t(
                        "Math Challenge",
                        "Desafio de Matemática"
                    );


                pageSubtitle.textContent =
                    t(
                        "Solve the problems and see how far you can push the difficulty.",
                        "Resolva os problemas e veja até onde você consegue levar a dificuldade."
                    );


                const questions =
                    lab.createQuestions(
                        topic.id,
                        difficulty.id,
                        10
                    );


                let questionIndex =
                    0;


                let score =
                    0;


                let currentEarned =
                    1;


                let hintUsed =
                    false;


                const questionCount =
                    document.getElementById(
                        "questionCount"
                    );


                const scoreText =
                    document.getElementById(
                        "scoreText"
                    );


                const progressFill =
                    document.getElementById(
                        "progressFill"
                    );


                const questionNumber =
                    document.getElementById(
                        "questionNumber"
                    );


                const questionPrompt =
                    document.getElementById(
                        "questionPrompt"
                    );


                const choices =
                    document.getElementById(
                        "choices"
                    );


                const hintButton =
                    document.getElementById(
                        "hintButton"
                    );


                const hintText =
                    document.getElementById(
                        "hintText"
                    );


                const feedback =
                    document.getElementById(
                        "feedback"
                    );


                const nextButton =
                    document.getElementById(
                        "nextButton"
                    );


                function formatScore(
                    value
                ) {

                    return Number.isInteger(
                        value
                    )
                        ? String(value)
                        : value.toFixed(1);

                }


                function renderQuestion() {

                    const question =
                        questions[
                            questionIndex
                        ];


                    currentEarned =
                        1;


                    hintUsed =
                        false;


                    questionCount.textContent =
                        t(
                            `Question ${questionIndex + 1} / ${questions.length}`,
                            `Questão ${questionIndex + 1} / ${questions.length}`
                        );


                    scoreText.textContent =
                        t(
                            `Score: ${formatScore(score)}`,
                            `Pontuação: ${formatScore(score)}`
                        );


                    progressFill.style.width =
                        `${
                            (
                                questionIndex /
                                questions.length
                            ) * 100
                        }%`;


                    questionNumber.textContent =
                        t(
                            `Question ${questionIndex + 1}`,
                            `Questão ${questionIndex + 1}`
                        );


                    questionPrompt.textContent =
                        question.prompt;


                    choices.innerHTML =
                        "";


                    hintText.hidden =
                        true;


                    hintText.textContent =
                        "";


                    feedback.textContent =
                        "";


                    nextButton.hidden =
                        true;


                    hintButton.disabled =
                        false;


                    question.choices.forEach(
                        choice => {

                            const button =
                                document.createElement(
                                    "button"
                                );


                            button.type =
                                "button";


                            button.className =
                                "mathChoice";


                            button.textContent =
                                choice;


                            button.addEventListener(
                                "click",
                                () =>
                                    answer(
                                        button,
                                        choice
                                    )
                            );


                            choices.appendChild(
                                button
                            );

                        }
                    );

                }


                function answer(
                    clicked,
                    value
                ) {

                    const question =
                        questions[
                            questionIndex
                        ];


                    const buttons =
                        [
                            ...choices.querySelectorAll(
                                "button"
                            )
                        ];


                    buttons.forEach(
                        button =>
                            button.disabled =
                                true
                    );


                    hintButton.disabled =
                        true;


                    if (
                        String(value) ===
                        String(question.answer)
                    ) {

                        clicked.classList.add(
                            "correct"
                        );


                        score +=
                            currentEarned;


                        feedback.textContent =
                            t(
                                hintUsed
                                    ? "Correct — nice recovery with the hint."
                                    : "Correct!",

                                hintUsed
                                    ? "Correto — boa recuperação com a dica."
                                    : "Correto!"
                            );

                    } else {

                        clicked.classList.add(
                            "wrong"
                        );


                        const correctButton =
                            buttons.find(
                                button =>
                                    button.textContent ===
                                    String(
                                        question.answer
                                    )
                            );


                        if (correctButton) {

                            correctButton.classList.add(
                                "correct"
                            );

                        }


                        feedback.textContent =
                            t(
                                `Not quite. ${question.explanation}`,
                                `Não foi dessa vez. ${question.explanation}`
                            );

                    }


                    nextButton.hidden =
                        false;


                    scoreText.textContent =
                        t(
                            `Score: ${formatScore(score)}`,
                            `Pontuação: ${formatScore(score)}`
                        );

                }


                hintButton.addEventListener(
                    "click",
                    () => {

                        const question =
                            questions[
                                questionIndex
                            ];


                        if (hintUsed) {
                            return;
                        }


                        hintUsed =
                            true;


                        currentEarned =
                            0.5;


                        hintText.hidden =
                            false;


                        hintText.textContent =
                            `${
                                t(
                                    "Hint",
                                    "Dica"
                                )
                            }: ${question.hint}`;


                        hintButton.disabled =
                            true;

                    }
                );


                nextButton.addEventListener(
                    "click",
                    () => {

                        questionIndex++;


                        if (
                            questionIndex >=
                            questions.length
                        ) {

                            finishQuiz();

                        } else {

                            renderQuestion();

                        }

                    }
                );


                function finishQuiz() {

                    quizArea.hidden =
                        true;


                    resultArea.hidden =
                        false;


                    progressFill.style.width =
                        "100%";


                    const perfect =
                        score ===
                        questions.length;


                    const feedbackText =
                        perfect
                            ? t(
                                "You absolutely crushed it.",
                                "Você mandou muito bem."
                            )
                            : score >= questions.length * .7
                                ? t(
                                    "Solid work. Try the next difficulty when you're ready.",
                                    "Bom trabalho. Tente a próxima dificuldade quando estiver pronto."
                                )
                                : t(
                                    "Keep practicing — the next attempt can be better.",
                                    "Continue praticando — a próxima tentativa pode ser melhor."
                                );


                    resultArea.innerHTML = `

                        <h2>
                            ${
                                t(
                                    "Challenge complete!",
                                    "Desafio concluído!"
                                )
                            }
                        </h2>

                        <div class="mathScore">
                            ${
                                formatScore(
                                    score
                                )
                            }
                            /
                            ${questions.length}
                        </div>

                        <p>
                            ${feedbackText}
                        </p>

                        <p>
                            ${
                                t(
                                    "Hints reduce that question to half credit, while wrong answers never make the score negative.",
                                    "As dicas reduzem aquela questão para meio ponto, enquanto respostas erradas nunca deixam a pontuação negativa."
                                )
                            }
                        </p>

                        <div class="mathActionRow">

                            <a
                                class="mathBackButton"
                                href="math.html"
                            >
                                ${
                                    t(
                                        "Back to Math",
                                        "Voltar para Matemática"
                                    )
                                }
                            </a>

                            <a
                                class="mathNextButton"
                                style="
                                    text-decoration:none;
                                    display:inline-flex;
                                    align-items:center;
                                    justify-content:center;
                                "
                                href="mathQuiz.html?topic=${encodeURIComponent(topic.id)}&difficulty=${encodeURIComponent(difficulty.id)}&mode=practice"
                            >
                                ${
                                    t(
                                        "Try again",
                                        "Tentar novamente"
                                    )
                                }
                            </a>

                        </div>

                    `;


                    if (perfect) {

                        createConfetti();

                    }

                }


                renderQuestion();

            }

            function randomInt(
                min,
                max
            ) {

                return Math.floor(
                    Math.random() *
                    (
                        max -
                        min +
                        1
                    )
                ) + min;

            }


            function makePanel(
                title,
                description
            ) {

                    document.createElement(
                        "div"
                    );

                panel.className =
                    "funPanel";


                const heading =
                    document.createElement(

                    );

                    );

                text.textContent =
                    description;


                panel.append(

            }


            function status(
                parent
            ) {

                const node =
                    document.createElement(

                    );

                node.className =
                    "funStatus";


                parent.appendChild(
                    node
                );

            function buildAdditionLab(
                root
            ) {

                const panel =
                    makePanel(
                        t(
                            "Number Catcher",
                            "Caçador de Números"
                        ),
                        t(
                            "Pick the two numbers that add up to the target.",
                            "Escolha os dois números que somam o alvo."
                        )
                    );


                const target =
                    document.createElement(
                        "div"
                    );

                target.className =
                    "funTarget";


                const choices =
                    document.createElement(
                        "div"
                    );

                choices.className =
                    "funChoices";


                panel.append(
                    target,
                    choices
                );


                const result =
                    status(
                        panel
                    );


                root.appendChild(
                    panel
                );


                let a;
                let b;
                let selected = [];


                function setup() {

                    const max =
                        difficulty.id === "easy"
                            ? 15
                            : difficulty.id === "medium"
                                ? 35
                                : difficulty.id === "hard"
                                    ? 80
                                    : difficulty.id === "difficult"
                                        ? 150
                                        : 300;


                    a =
                        randomInt(
                            2,
                            max
                        );

                    b =
                        randomInt(
                            2,
                            max
                        );


                    const numbers =
                        [
                            a,
                            b
                        ];


                    while (
                        numbers.length < 8
                    ) {

                        const value =
                            randomInt(
                                1,
                                max
                            );


                        if (
                            !numbers.includes(
                                value
                            )
                        ) {

                            numbers.push(
                                value
                            );

                        }

                    }


                    selected =
                        [];


                    target.textContent =
                        t(
                            `Target: ${a + b}`,
                            `Alvo: ${a + b}`
                        );


                    choices.innerHTML =
                        "";


                    numbers
                        .sort(
                            () =>
                                Math.random() -
                                .5
                        )
                        .forEach(
                            value => {

                                const button =
                                    document.createElement(
                                        "button"
                                    );

                                button.className =
                                    "funChoice";

                                button.textContent =
                                    value;

                                button.addEventListener(
                                    "click",
                                    () => {

                                        if (
                                            selected.length >=
                                            2
                                        ) {
                                            return;
                                        }


                                        selected.push(
                                            {
                                                value,
                                                button
                                            }
                                        );


                                        button.classList.add(
                                            "selected"
                                        );


                                        if (
                                            selected.length ===
                                            2
                                        ) {

                                            const sum =
                                                selected[0].value +
                                                selected[1].value;


                                            if (
                                                sum ===
                                                a + b
                                            ) {

                                                selected.forEach(
                                                    item =>
                                                        item.button.classList.add(
                                                            "correct"
                                                        )
                                                );


                                                result.textContent =
                                                    t(
                                                        "Correct! You caught the pair.",
                                                        "Correto! Você pegou o par."
                                                    );

                                            } else {

                                                selected.forEach(
                                                    item =>
                                                        item.button.classList.add(
                                                            "wrong"
                                                        )
                                                );


                                                result.textContent =
                                                    t(
                                                        "Not quite. Try another pair.",
                                                        "Não foi dessa vez. Tente outro par."
                                                    );

                                            }


                                            setTimeout(
                                                setup,
                                                850
                                            );

                                        }

                                    }
                                );


                                choices.appendChild(
                                    button
                                );

                            }
                        );

                }


                setup();

            }


            function buildSubtractionLab(
                root
            ) {

                const panel =
                    makePanel(
                        t(
                            "Reach the Target",
                            "Chegue ao Alvo"
                        ),
                        t(
                            "Choose what to subtract so the starting number lands exactly on the target.",
                            "Escolha o que subtrair para que o número inicial chegue exatamente ao alvo."
                        )
                    );


                const machine =
                    document.createElement(
                        "div"
                    );

                machine.className =
                    "funMachine";


                const startBox =
                    document.createElement(
                        "div"
                    );

                startBox.className =
                    "funMachineBox";


                const arrow =
                    document.createElement(
                        "div"
                    );

                arrow.className =
                    "funMachineArrow";

                arrow.textContent =
                    "→";


                const targetBox =
                    document.createElement(
                        "div"
                    );

                targetBox.className =
                    "funMachineBox";


                const buttons =
                    document.createElement(
                        "div"
                    );

                buttons.className =
                    "funChoices";


                panel.append(
                    machine,
                    buttons
                );


                machine.append(
                    startBox,
                    arrow,
                    targetBox
                );


                const result =
                    status(
                        panel
                    );


                root.appendChild(
                    panel
                );


                function setup() {

                    const start =
                        difficulty.id === "easy"
                            ? 10
                            : difficulty.id === "medium"
                                ? 30
                                : difficulty.id === "hard"
                                    ? 80
                                    : difficulty.id === "difficult"
                                        ? 150
                                        : 300;


                    const current =
                        start -
                        randomInt(
                            2,
                            Math.max(
                                3,
                                Math.floor(
                                    start *
                                    .6
                                )
                            )
                        );


                    const answer =
                        start -
                        current;


                    startBox.textContent =
                        start;


                    targetBox.textContent =
                        current;


                    buttons.innerHTML =
                        "";


                    const values =
                        [
                            answer,
                            answer + 1,
                            Math.max(
                                1,
                                answer - 2
                            ),
                            answer + 5,
                            answer + 10,
                            Math.max(
                                1,
                                answer - 5
                            )
                        ];


                    [...new Set(values)]
                        .sort(
                            () =>
                                Math.random() -
                                .5
                        )
                        .forEach(
                            value => {

                                const button =
                                    document.createElement(
                                        "button"
                                    );

                                button.className =
                                    "funChoice";

                                button.textContent =
                                    `− ${value}`;


                                button.addEventListener(
                                    "click",
                                    () => {

                                        if (
                                            start -
                                            value ===
                                            current
                                        ) {

                                            button.classList.add(
                                                "correct"
                                            );


                                            result.textContent =
                                                t(
                                                    "Perfect subtraction.",
                                                    "Subtração perfeita."
                                                );

                                        } else {

                                            button.classList.add(
                                                "wrong"
                                            );


                                            result.textContent =
                                                t(
                                                    "That would land on the wrong number.",
                                                    "Isso faria você chegar ao número errado."
                                                );

                                        }


                                        setTimeout(
                                            setup,
                                            800
                                        );

                                    }
                                );


                                buttons.appendChild(
                                    button
                                );

                            }
                        );

                }


                setup();

            }


            function buildMultiplicationLab(
                root
            ) {

                const panel =
                    makePanel(
                        t(
                            "Multiplier Blaster",
                            "Blaster da Multiplicação"
                        ),
                        t(
                            "Hit the card whose multiplication equals the target.",
                            "Acerte o cartão cuja multiplicação resulta no alvo."
                        )
                    );


                const target =
                    document.createElement(
                        "div"
                    );

                target.className =
                    "funTarget";


                const choices =
                    document.createElement(
                        "div"
                    );

                choices.className =
                    "funChoices";


                panel.append(
                    target,
                    choices
                );


                const result =
                    status(
                        panel
                    );


                root.appendChild(
                    panel
                );


                function setup() {

                    const max =
                        difficulty.id === "easy"
                            ? 6
                            : difficulty.id === "medium"
                                ? 12
                                : difficulty.id === "hard"
                                    ? 25
                                    : difficulty.id === "difficult"
                                        ? 50
                                        : 100;


                    const a =
                        randomInt(
                            2,
                            max
                        );


                    const b =
                        randomInt(
                            2,
                            max
                        );


                    const answer =
                        a * b;


                    target.textContent =
                        t(
                            `Target: ${answer}`,
                            `Alvo: ${answer}`
                        );


                    choices.innerHTML =
                        "";


                    const pairs =
                        [
                            [a,b]
                        ];


                    while (
                        pairs.length <
                        8
                    ) {

                        const x =
                            randomInt(
                                2,
                                max
                            );

                        const y =
                            randomInt(
                                2,
                                max
                            );


                        if (
                            x * y !==
                            answer
                        ) {

                            pairs.push(
                                [x,y]
                            );

                        }

                    }


                    pairs
                        .sort(
                            () =>
                                Math.random() -
                                .5
                        )
                        .forEach(
                            ([x,y]) => {

                                const button =
                                    document.createElement(
                                        "button"
                                    );

                                button.className =
                                    "funChoice";

                                button.textContent =
                                    `${x} × ${y}`;


                                button.addEventListener(
                                    "click",
                                    () => {

                                        if (
                                            x * y ===
                                            answer
                                        ) {

                                            button.classList.add(
                                                "correct"
                                            );

                                            result.textContent =

            function buildDecimalLab(
    root
) {

    const panel =
        makePanel(
            t(
                "Decimal Tuner",
                "Afinador Decimal"
            ),
            t(
                "Move the place-value controls until the display matches the target.",
                "Mova os controles das casas até o visor chegar ao alvo."
            )
        );


    /*
        The four sliders represent:

        Tens      → 0 to 9
        Ones      → 0 to 9
        Tenths    → 0 to 9
        Hundredths→ 0 to 9

        Therefore the biggest possible number is 99.99.

        The old version could generate 999.99,
        which made some targets impossible.
    */


    let minCents;
    let maxCents;


    switch (
        difficulty.id
    ) {

        case "easy":

            minCents =
                100;

            maxCents =
                999;

            break;


        case "medium":

            minCents =
                100;

            maxCents =
                2999;

            break;


        case "hard":

            minCents =
                1000;

            maxCents =
                5999;

            break;


        case "difficult":

            minCents =
                2000;

            maxCents =
                8999;

            break;


        default:

            minCents =
                100;

            maxCents =
                9999;

            break;

    }


    const targetCents =
        randomInt(
            minCents,
            maxCents
        );


    const targetValue =
        targetCents / 100;


    const tensTarget =
        Math.floor(
            targetCents / 1000
        );


    const onesTarget =
        Math.floor(
            (
                targetCents % 1000
            ) / 100
        );


    const tenthsTarget =
        Math.floor(
            (
                targetCents % 100
            ) / 10
        );


    const hundredthsTarget =
        targetCents % 10;


    const targetNode =
        document.createElement(
            "div"
        );

    targetNode.className =
        "funTarget";

    targetNode.textContent =
        t(
            `Target: ${targetValue.toFixed(2)}`,
            `Alvo: ${targetValue.toFixed(2)}`
        );


    const display =
        document.createElement(
            "div"
        );

    display.className =
        "funNumberDisplay";


    const places =
        document.createElement(
            "div"
        );

    places.className =
        "funSlots";


    const controls = [];


    function addPlace(
        label,
        min,
        max,
        step,
        startingValue
    ) {

        const wrapper =
            document.createElement(
                "div"
            );

        wrapper.className =
            "funPanel";


        const title =
            document.createElement(
                "div"
            );

        title.textContent =
            label;

        title.style.fontWeight =
            "900";


        const input =
            document.createElement(
                "input"
            );

        input.type =
            "range";

        input.className =
            "funRange";

        input.min =
            min;

        input.max =
            max;

        input.step =
            step;

        input.value =
            startingValue;


        wrapper.append(
            title,
            input
        );


        places.appendChild(
            wrapper
        );


        controls.push(
            input
        );


        input.addEventListener(
            "input",
            update
        );

    }


    addPlace(
        t(
            "Tens",
            "Dezenas"
        ),
        0,
        9,
        1,
        0
    );


    addPlace(
        t(
            "Ones",
            "Unidades"
        ),
        0,
        9,
        1,
        0
    );


    addPlace(
        t(
            "Tenths",
            "Décimos"
        ),
        0,
        9,
        1,
        0
    );


    addPlace(
        t(
            "Hundredths",
            "Centésimos"
        ),
        0,
        9,
        1,
        0
    );


    panel.append(
        targetNode,
        display,
        places
    );


    const result =
        status(
            panel
        );


    root.appendChild(
        panel
    );


    function getCurrentValue() {

        const tens =
            Number(
                controls[0].value
            );


        const ones =
            Number(
                controls[1].value
            );


        const tenths =
            Number(
                controls[2].value
            );


        const hundredths =
            Number(
                controls[3].value
            );


        return (
            tens * 10 +
            ones +
            tenths / 10 +
            hundredths / 100
        );

    }


    function update() {

        const value =
            getCurrentValue();


        display.textContent =
            value.toFixed(2);


        if (
            Math.abs(
                value -
                targetValue
            ) < 0.005
        ) {

            result.textContent =
                t(
                    "Matched! You built the target number.",
                    "Acertou! Você montou o número alvo."
                );

        } else {

            const difference =
                Math.abs(
                    value -
                    targetValue
                );


            result.textContent =
                t(
                    `Keep tuning. You are ${difference.toFixed(2)} away.`,
                    `Continue ajustando. Você está a ${difference.toFixed(2)} do alvo.`
                );

        }

    }


    update();

}

            function createCanvas() {

                const wrapper =
                    document.createElement(
                        "div"
                    );

                wrapper.className =
                    "funCanvasWrap";


                const canvas =
                    document.createElement(
                        "canvas"
                    );

                canvas.className =
                    "funCanvas";

                canvas.width =
                    760;

                canvas.height =
                    480;


                wrapper.appendChild(
                    canvas
                );


                return {

                    wrapper,

                    canvas,

                    context:
                        canvas.getContext(
                            "2d"
                        )

                };

            }


            function drawCoordinateGrid(
                ctx,
                canvas
            ) {

                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                ctx.fillStyle =
                    "#151620";

                ctx.fillRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                const scale =
                    34;


                const ox =
                    canvas.width / 2;


                const oy =
                    canvas.height / 2;


                ctx.strokeStyle =
                    "rgba(255,255,255,.07)";

                ctx.lineWidth =
                    1;


                for (
                    let x = ox % scale;
                    x < canvas.width;
                    x += scale
                ) {

                    ctx.beginPath();

                    ctx.moveTo(
                        x,
                        0
                    );

                    ctx.lineTo(
                        x,
                        canvas.height
                    );

                    ctx.stroke();

                }


                for (
                    let y = oy % scale;
                    y < canvas.height;
                    y += scale
                ) {

                    ctx.beginPath();

                    ctx.moveTo(
                        0,
                        y
                    );

                    ctx.lineTo(
                        canvas.width,
                        y
                    );

                    ctx.stroke();

                }


                ctx.strokeStyle =
                    "rgba(255,255,255,.50)";

                ctx.lineWidth =
                    1.5;


                ctx.beginPath();

                ctx.moveTo(
                    ox,
                    0
                );

                ctx.lineTo(
                    ox,
                    canvas.height
                );

                ctx.moveTo(
                    0,
                    oy
                );

                ctx.lineTo(
                    canvas.width,
                    oy
                );

                ctx.stroke();

            }


            function graphPoint(
                canvas,
                x,
                y
            ) {

                const scale =
                    34;


                return {

                    x:
                        canvas.width / 2 +
                        x * scale,

                    y:
                        canvas.height / 2 -
                        y * scale

                };

            }


            function drawLinear(
                ctx,
                canvas,
                a,
                b,
                color,
                dashed
            ) {

                ctx.save();

                ctx.strokeStyle =
                    color;

                ctx.lineWidth =
                    4;


                if (dashed) {

                    ctx.setLineDash(
                        [8,7]
                    );

                }


                ctx.beginPath();


                for (
                    let x = -12;
                    x <= 12;
                    x += .05
                ) {

                    const y =
                        a * x +
                        b;


                    const p =
                        graphPoint(
                            canvas,
                            x,
                            y
                        );


                    if (
                        x === -12
                    ) {

                        ctx.moveTo(
                            p.x,
                            p.y
                        );

                    } else {

                        ctx.lineTo(
                            p.x,
                            p.y
                        );

                    }

                }


                ctx.stroke();

                ctx.restore();

            }


            function drawQuadratic(
                ctx,
                canvas,
                a,
                b,
                c,
                color
            ) {

                ctx.save();

                ctx.strokeStyle =
                    color;

                ctx.lineWidth =
                    4;


                ctx.beginPath();


                let started =
                    false;


                for (
                    let x = -11;
                    x <= 11;
                    x += .04
                ) {

                    const y =
                        a *
                        x *
                        x +

                        b *
                        x +

                        c;


                    if (
                        Math.abs(y) >
                        12
                    ) {

                        started =
                            false;

                        continue;

                    }


                    const p =
                        graphPoint(
                            canvas,
                            x,
                            y
                        );


                    if (!started) {

                        ctx.moveTo(
                            p.x,
                            p.y
                        );

                        started =
                            true;

                    } else {

                        ctx.lineTo(
                            p.x,
                            p.y
                        );

                    }

                }


                ctx.stroke();

                ctx.restore();

            }

                    "#d46261";

                    p.x,

                    "pointerdown",
                    event => {

                            canvas.canvas.getBoundingClientRect();


                        const sx =
                            canvas.canvas.width /
                            rect.width;


                        const sy =
                            canvas.canvas.height /
                            rect.height;


                        const px =
                            (
                                event.clientX -
                                rect.left
                            ) *
                            sx;


                        const py =
                            (
                                event.clientY -
                                rect.top
                            ) *
                            sy;


                        const scale =
                            34;


                        const pickedX =
                            Math.round(
                                (
                                    px -
                                    canvas.canvas.width /
                                    2
                                ) /
                                scale
                            );


                        const pickedY =
                            Math.round(
                                (
                                    canvas.canvas.height /
                                    2 -
                                    py
                                ) /
                                scale
                            );


                        if (
                            pickedX === x &&
                            pickedY === y
                        ) {

                                t(
                                    "Treasure found.",

                                );

                                t(

                );

                    document.createElement(
                        "div"
                    );

                goal.className =
                    "funPanel";


                goal.innerHTML =
                    `
                        <h3>
                            ${t(
                                "Drawing challenge",
                                "Desafio de desenho"
                            )}
                        </h3>

                        <p class="funDescription">
                            ${
                                difficulty.id === "easy"
                                    ? t(
                                        "Make a simple tent.",
                                        "Faça uma barraca simples."
                                    )
                                    : difficulty.id === "medium"
                                        ? t(

                                                ? t(

                                                )
                                                : t(
                                                    "Create your own picture using at least six equations.",
                                                    "Crie seu próprio desenho usando pelo menos seis equações."
                                                )
                            }
                        </p>
                    `;


                panel.appendChild(
                    goal
                );


                const equations =
                    document.createElement(
                        "div"
                    );

                equations.className =
                    "funArtEquations";


                panel.appendChild(
                    equations
                );


                const actions =
                    document.createElement(
                        "div"
                    );

                actions.className =
                    "mathActionRow";


                const add =
                    document.createElement(
                        "button"
                    );

                add.className =
                    "funButton";

                add.textContent =
                    t(
                        "Add equation",
                        "Adicionar equação"
                    );


                const preset =
                    document.createElement(
                        "button"
                    );

                preset.className =
                    "funButton secondary";

                preset.textContent =
                    t(
                        "Load example",
                        "Carregar exemplo"
                    );


                actions.append(
                    add,
                    preset
                );


                panel.appendChild(
                    actions
                );


                const result =
                    status(
                        panel
                    );


                root.appendChild(
                    panel
                );


                const equationValues =
                    [];


                function addEquation(
                    value = "y = x"
                ) {

                    equationValues.push(
                        value
                    );

                    renderEquations();
                    draw();

                }


                function renderEquations() {

                    equations.innerHTML =
                        "";


                    equationValues.forEach(
                        (
                            value,
                            index
                        ) => {

                            const row =
                                document.createElement(
                                    "div"
                                );

                            row.className =
                                "funEquationRow";


                            const input =
                                document.createElement(
                                    "input"
                                );

                            input.className =
                                "funInput";

                            input.value =
                                value;


                            input.addEventListener(
                                "input",
                                () => {

                                    equationValues[
                                        index
                                    ] =
                                        input.value;

                                    draw();

                                }
                            );


                            const remove =
                                document.createElement(
                                    "button"
                                );

                            remove.className =
                                "funButton secondary";

                            remove.textContent =
                                "×";


                            remove.addEventListener(
                                "click",
                                () => {

                                    equationValues.splice(
                                        index,
                                        1
                                    );

                                    renderEquations();
                                    draw();

                                }
                            );


                            row.append(
                                input,
                                remove
                            );


                            equations.appendChild(
                                row
                            );

                        }
                    );

                }


                function parse(
                    value
                ) {

                    const text =
                        value
                            .toLowerCase()
                            .replace(
                                /\s+/g,
                                ""
                            );


                    if (
                        text.startsWith(
                            "x="
                        )
                    ) {

                        const number =
                            Number(
                                text.slice(2)
                            );


                        return Number.isFinite(
                            number
                        )
                            ? {
                                type:
                                    "vertical",

                                value:
                                    number
                            }
                            : null;

                    }


                    if (
                        !text.startsWith(
                            "y="
                        )
                    ) {
                        return null;
                    }


                    const body =
                        text.slice(2);


                    const quadratic =
                        body.match(
                            /^(-?\d*\.?\d*)x\^2([+-]\d*\.?\d*)x([+-]\d*\.?\d*)$/
                        );


                    if (quadratic) {

                        return {

                            type:
                                "quadratic",

                            a:
                                coefficient(
                                    quadratic[1]
                                ),

                            b:
                                Number(
                                    quadratic[2]
                                ),

                            c:
                                Number(
                                    quadratic[3]
                                )

                        };

                    }


                    const linear =
                        body.match(
                            /^(-?\d*\.?\d*)x([+-]\d*\.?\d*)$/
                        );


                    if (linear) {

                        return {

                            type:
                                "linear",

                            a:
                                coefficient(
                                    linear[1]
                                ),

                            b:
                                Number(
                                    linear[2]
                                )

                        };

                    }


                    const horizontal =
                        Number(
                            body
                        );


                    if (
                        Number.isFinite(
                            horizontal
                        )
                    ) {

                        return {

                            type:
                                "horizontal",

                            value:
                                horizontal

                        };

                    }


                    return null;

                }


                function coefficient(
                    value
                ) {

                    if (
                        value === "" ||
                        value === "+"
                    ) {
                        return 1;
                    }


                    if (
                        value === "-"
                    ) {
                        return -1;
                    }


                    return Number(
                        value
                    );

                }


                function draw() {

                    drawCoordinateGrid(
                        canvas.context,
                        canvas.canvas
                    );


                    equationValues.forEach(
                        (
                            raw,
                            index
                        ) => {

                            const eq =
                                parse(
                                    raw
                                );


                            if (!eq) {
                                return;
                            }


                            canvas.context.strokeStyle =
                                [
                                    "#e99b32",
                                    "#69569d",
                                    "#5fc56c",
                                    "#d46261",
                                    "#7fb3e6",
                                    "#d39a68"
                                ][
                                    index % 6
                                ];


                            canvas.context.lineWidth =
                                4;


                            canvas.context.beginPath();


                            if (
                                eq.type ===
                                "vertical"
                            ) {

                                const point =
                                    graphPoint(
                                        canvas.canvas,
                                        eq.value,
                                        0
                                    );


                                canvas.context.moveTo(
                                    point.x,
                                    0
                                );


                                canvas.context.lineTo(
                                    point.x,
                                    canvas.canvas.height
                                );

                            } else {

                                let started =
                                    false;


                                for (
                                    let x = -11;
                                    x <= 11;
                                    x += .03
                                ) {

                                    let y;


                                    if (
                                        eq.type ===
                                        "linear"
                                    ) {

                                        y =
                                            eq.a *
                                            x +
                                            eq.b;

                                    } else if (
                                        eq.type ===
                                        "quadratic"
                                    ) {

                                        y =
                                            eq.a *
                                            x *
                                            x +

                                            eq.b *
                                            x +

                                            eq.c;

                                    } else {

                                        y =
                                            eq.value;

                                    }


                                    if (
                                        !Number.isFinite(
                                            y
                                        ) ||
                                        Math.abs(y) > 13
                                    ) {

                                        started =
                                            false;

                                        continue;

                                    }


                                    const point =
                                        graphPoint(
                                            canvas.canvas,
                                            x,
                                            y
                                        );


                                    if (!started) {

                                        canvas.context.moveTo(
                                            point.x,
                                            point.y
                                        );

                                        started =
                                            true;

                                    } else {

                                        canvas.context.lineTo(
                                            point.x,
                                            point.y
                                        );

                                    }

                                }

                            }


                            canvas.context.stroke();

                        }
                    );

                }


                add.addEventListener(
                    "click",
                    () =>
                        addEquation()
                );


                preset.addEventListener(
                    "click",
                    () => {

                        const presets = {

                            easy: [
                                "y = x + 2",
                                "y = -x + 2",
                                "y = 0"
                            ],

                            medium: [
                                "y = 0",
                                "x = -3",
                                "x = 3",
                                "y = 2x + 6",
                                "y = -2x + 6"
                            ],

                            hard: [
                                "y = 0.7x + 2",
                                "y = -0.7x + 2",
                                "y = 0"
                            ],

                            difficult: [
                                "x = -2",
                                "x = 2",
                                "y = 0",
                                "y = 4",
                                "y = 2x + 8",
                                "y = -2x + 8"
                            ],

                            extreme: [
                                "y = x",
                                "y = -x",
                                "y = x + 3",
                                "y = -x + 3",
                                "x = -4",
                                "x = 4"
                            ]

                        };


                        equationValues.splice(
                            0,
                            equationValues.length,
                            ...presets[
                                difficulty.id
                            ]
                        );


                        renderEquations();
                        draw();


                        result.textContent =
                            t(
                                "Example loaded. Change the equations and make your own picture.",
                                "Exemplo carregado. Mude as equações e faça seu próprio desenho."
                            );

                    }
                );


                if (
                    difficulty.id ===
                    "extreme"
                ) {

                    equationValues.push(
                        "y = x"
                    );

                } else {

                    equationValues.push(
                        "y = x + 2"
                    );

                    equationValues.push(
                        "y = -x + 2"
                    );

                }


                renderEquations();
                draw();

            }

                    );

                        "div"
                    );

                    "funShapePreview";

                    document.createElement(
                        "div"
                    );

                buttons.className =
                    "funShapeGrid";


                const info =
                    document.createElement(
                        "div"
                    );

                    "funInfoGrid";

                        t(
                            "Triangle",

                        ),

                        ),

                                );

                                    preview.appendChild(

                                    );

                                        `
                                            <div class="funInfoBox">
                                                <strong>
                                                    ${t(
                                                        "Sides",
                                                        "Lados"
                                                    )}
                                                </strong>

                                                <span>
                                                    ${sides}
                                                </span>
                                            </div>

                                            <div class="funInfoBox">
                                                <strong>
                                                    ${t(
                                                        "Name",
                                                        "Nome"
                                                    )}
                                                </strong>

                                                <span>
                                                    ${names[sides]}
                                                </span>
                                            </div>

                                            <div class="funInfoBox">
                                                <strong>
                                                    ${t(
                                                        "Interior sum",
                                                        "Soma interna"
                                                    )}
                                                </strong>

                                                <span>
                                                    ${
                                                        (sides - 2) *
                                                        180
                                                    }°
                                                </span>
                                            </div>
                                        `;


                                    if (
                                        sides ===

                            buttons.appendChild(

                    );


                panel.append(
                    target,
                    preview,
                    buttons,
                    info
                );


                root.appendChild(

                    .querySelector(
                        `button:nth-child(${targetSides - 2})`

            function buildAngleLab(
                root
            ) {

                const panel =
                    makePanel(
                        t(
                            "Angle Dial",
                            "Controle de Ângulo"
                        ),
                        t(
                            "Rotate the angle until it reaches the target.",
                            "Gire o ângulo até chegar ao alvo."
                        )
                    );


                const targetAngle =
                    difficulty.id === "easy"
                        ? 45
                        : difficulty.id === "medium"
                            ? 90
                            : randomInt(
                                20,
                                170
                            );


                const target =
                    document.createElement(
                        "div"
                    );

                target.className =
                    "funTarget";

                target.textContent =
                    `${targetAngle}°`;


                const dial =
                    document.createElement(
                        "div"
                    );

                dial.className =
                    "funAngle";


                const center =
                    document.createElement(
                        "div"
                    );

                center.className =
                    "funAngleCenter";


                dial.appendChild(
                    center
                );


                const slider =
                    document.createElement(
                        "input"
                    );

                slider.type =
                    "range";

                slider.min =
                    "0";

                slider.max =
                    "180";

                slider.value =
                    "45";

                slider.className =
                    "funRange";


                const value =
                    document.createElement(
                        "div"
                    );

                value.className =
                    "funNumberDisplay";


                const result =
                    status(
                        panel
                    );


                panel.append(
                    target,
                    dial,
                    slider,
                    value
                );


                root.appendChild(
                    panel
                );


                function update() {

                    const angle =
                        Number(
                            slider.value
                        );


                    value.textContent =
                        `${angle}°`;


                    dial.style.setProperty(
                        "--angle",
                        `${angle}deg`
                    );


                    if (
                        Math.abs(
                            angle -
                            targetAngle
                        ) <=
                        2
                    ) {

                        result.textContent =
                            t(
                                "Angle matched.",
                                "Ângulo combinado."
                            );

                    } else {

                        result.textContent =
                            t(
                                "Keep rotating.",
                                "Continue girando."
                            );

                    }

                }


                slider.addEventListener(
                    "input",
                    update
                );


                update();

            }

                    document.createElement(

            function buildCoordinateLab(
                root
            ) {

                const panel =
                    makePanel(
                        t(
                            "Treasure Map",
                            "Mapa do Tesouro"
                        ),
                        t(
                            "Click the map where the treasure coordinate is located.",
                            "Clique no mapa onde está localizada a coordenada do tesouro."
                        )
                    );


                const map =
                    document.createElement(
                        "div"
                    );

                map.className =
                    "funMap";


                const canvas =
                    document.createElement(
                        "canvas"
                    );

                canvas.width =
                    600;

                canvas.height =
                    600;

                canvas.className =
                    "funMapCanvas";


                map.appendChild(
                    canvas
                );


                const targetX =
                    randomInt(
                        -7,
                        7
                    );


                const targetY =
                    randomInt(
                        -7,
                        7
                    );


                const target =
                    document.createElement(
                        "div"
                    );

                target.className =
                    "funTarget";

                target.textContent =
                    `(${targetX}, ${targetY})`;


                const result =
                    status(
                        panel
                    );


                panel.append(
                    target,
                    map
                );


                root.appendChild(
                    panel
                );


                const ctx =
                    canvas.getContext(
                        "2d"
                    );


                drawMap();


                canvas.addEventListener(
                    "pointerdown",
                    event => {

                        const rect =
                            canvas.getBoundingClientRect();


                        const x =
                            (
                                event.clientX -
                                rect.left
                            ) /
                            rect.width *
                            15 -
                            7.5;


                        const y =
                            7.5 -
                            (
                                event.clientY -
                                rect.top
                            ) /
                            rect.height *
                            15;


                        const pickedX =
                            Math.round(
                                x
                            );


                        const pickedY =
                            Math.round(
                                y
                            );


                        drawMap(
                            pickedX,
                            pickedY
                        );


                        if (
                            pickedX ===
                                targetX &&
                            pickedY ===
                                targetY
                        ) {

                            result.textContent =
                                t(
                                    "Treasure found!",
                                    "Tesouro encontrado!"
                                );

                        } else {

                            result.textContent =
                                t(
                                    `You found (${pickedX}, ${pickedY}). Keep looking.`,
                                    `Você encontrou (${pickedX}, ${pickedY}). Continue procurando.`
                                );

                        }

                    }
                );


                function drawMap(
                    pickedX,
                    pickedY
                ) {

                    ctx.clearRect(
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );


                    ctx.fillStyle =
                        "#151620";

                    ctx.fillRect(
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );


                    const scale =
                        canvas.width /
                        15;


                    ctx.strokeStyle =
                        "rgba(255,255,255,.08)";

                    ctx.lineWidth =
                        1;


                    for (
                        let i = 0;
                        i <= 15;
                        i++
                    ) {

                        const p =
                            i *
                            scale;


                        ctx.beginPath();

                        ctx.moveTo(
                            p,
                            0
                        );

                        ctx.lineTo(
                            p,
                            canvas.height
                        );

                        ctx.moveTo(
                            0,
                            p
                        );

                        ctx.lineTo(
                            canvas.width,
                            p
                        );

                        ctx.stroke();

                    }


                    const originX =
                        7.5 *
                        scale;


                    const originY =
                        7.5 *
                        scale;


                    ctx.strokeStyle =
                        "rgba(255,255,255,.45)";

                    ctx.lineWidth =
                        2;


                    ctx.beginPath();

                    ctx.moveTo(
                        originX,
                        0
                    );

                    ctx.lineTo(
                        originX,
                        canvas.height
                    );

                    ctx.moveTo(
                        0,
                        originY
                    );

                    ctx.lineTo(
                        canvas.width,
                        originY
                    );

                    ctx.stroke();


                    if (
                        pickedX !== undefined
                    ) {

                        const px =
                            (
                                pickedX +
                                7.5
                            ) *
                            scale;


                        const py =
                            (
                                7.5 -
                                pickedY
                            ) *
                            scale;


                        ctx.fillStyle =
                            "#e99b32";


                        ctx.beginPath();

                        ctx.arc(
                            px,
                            py,
                            8,
                            0,
                            Math.PI * 2
                        );

                        ctx.fill();

                    }

                }

            }


            function createConfetti() {

                const container =
                    document.createElement(
                        "div"
                    );


                container.style.position =
                    "fixed";

                container.style.inset =
                    "0";

                container.style.pointerEvents =
                    "none";

                container.style.overflow =
                    "hidden";

                container.style.zIndex =
                    "999";


                for (
                    let i = 0;
                    i < 60;
                    i++
                ) {

                    const piece =
                        document.createElement(
                            "span"
                        );


                    piece.style.position =
                        "absolute";

                    piece.style.top =
                        "-15px";

                    piece.style.left =
                        `${Math.random() * 100}%`;

                    piece.style.width =
                        "7px";

                    piece.style.height =
                        "11px";

                    piece.style.background =
                        [
                            "#ffd56e",
                            "#69569d",
                            "#5fc56c",
                            "#e99b32",
                            "#d46261"
                        ][
                            i % 5
                        ];

                    piece.style.borderRadius =
                        "2px";

                    piece.style.animation =
                        `mathFunConfetti ${
                            1.5 +
                            Math.random() *
                            1.5
                        }s linear ${
                            Math.random() *
                            .7
                        }s forwards`;


                    container.appendChild(
                        piece
                    );

                }


                const style =
                    document.createElement(
                        "style"
                    );


                style.textContent = `

                    @keyframes mathFunConfetti {

                        to {

                            top:
                                110%;

                            transform:
                                translateX(
                                    ${
                                        (
                                            Math.random() -
                                            .5
                                        ) *
                                        140
                                    }px
                                )
                                rotate(
                                    720deg
                                );

                        }

                    }

                `;


                document.head.appendChild(
                    style
                );


                document.body.appendChild(
                    container
                );


                setTimeout(
                    () =>
                        container.remove(),
                    3500
                );

            }


            window.addEventListener(
                "languageChanged",
                () => {

                    window.location.reload();

                }
            );

        })();

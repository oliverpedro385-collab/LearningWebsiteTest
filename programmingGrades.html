<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <script>
        if (
            localStorage.getItem(
                "darkMode"
            ) === "true"
        ) {
            document.documentElement.classList.add(
                "darkMode"
            );
        }
    </script>


    <link
        rel="stylesheet"
        href="style.css"
    >


    <title>
        Programming Grades
    </title>

</head>


<body>


    <!-- BACK -->

    <a
        href="programmingLanguages.html"
        class="backButton"
    >
        ↶
    </a>



    <!-- SETTINGS -->

    <button
        id="settingsButton"
        class="settingsButton"
    >

        <span id="settingsIcon">
            ⚙
        </span>

    </button>



    <!-- CONTENT -->

    <div class="container gradePage">


        <div class="subjectHeading">


            <span
                class="subjectSmallTitle"
                data-i18n="midDay"
            >
                Mid-Day
            </span>


            <h1 id="programmingGradeTitle">
                Programming
            </h1>


            <p
                data-i18n="chooseProgrammingGrade"
            >
                Choose your grade.
            </p>


        </div>



        <div class="gradeContainer">


            <a
                href="#"
                id="grade1"
                class="gradeButton"
            >

                <span class="gradeNumber">
                    1
                </span>

                <span
                    data-i18n="grade1"
                >
                    Grade 1
                </span>

            </a>



            <a
                href="#"
                id="grade2"
                class="gradeButton"
            >

                <span class="gradeNumber">
                    2
                </span>

                <span
                    data-i18n="grade2"
                >
                    Grade 2
                </span>

            </a>



            <a
                href="#"
                id="grade3"
                class="gradeButton"
            >

                <span class="gradeNumber">
                    3
                </span>

                <span
                    data-i18n="grade3"
                >
                    Grade 3
                </span>

            </a>



            <a
                href="#"
                id="grade4"
                class="gradeButton"
            >

                <span class="gradeNumber">
                    4
                </span>

                <span
                    data-i18n="grade4"
                >
                    Grade 4
                </span>

            </a>



            <a
                href="#"
                id="grade5"
                class="gradeButton"
            >

                <span class="gradeNumber">
                    5
                </span>

                <span
                    data-i18n="grade5"
                >
                    Grade 5
                </span>

            </a>


        </div>


    </div>



    <!-- SCRIPTS -->

    <script src="user.js"></script>

    <script src="language.js"></script>

    <script src="theme.js"></script>

    <script src="settings.js"></script>



    <script>

        const params =
            new URLSearchParams(
                window.location.search
            );


        const language =
            (
                params.get(
                    "language"
                ) || "python"
            ).toLowerCase();



        const validLanguages = [
            "python",
            "java",
            "luau"
        ];


        const selectedLanguage =
            validLanguages.includes(
                language
            )
                ? language
                : "python";



        document.getElementById(
            "grade1"
        ).href =
            `programmingChallenge.html?language=${selectedLanguage}&grade=1`;


        document.getElementById(
            "grade2"
        ).href =
            `programmingChallenge.html?language=${selectedLanguage}&grade=2`;


        document.getElementById(
            "grade3"
        ).href =
            `programmingChallenge.html?language=${selectedLanguage}&grade=3`;


        document.getElementById(
            "grade4"
        ).href =
            `programmingChallenge.html?language=${selectedLanguage}&grade=4`;


        document.getElementById(
            "grade5"
        ).href =
            `programmingChallenge.html?language=${selectedLanguage}&grade=5`;



        const languageNames = {
            python: "Python",
            java: "Java",
            luau: "Luau"
        };


        document.getElementById(
            "programmingGradeTitle"
        ).textContent =
            languageNames[
                selectedLanguage
            ];

    </script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <script>
        if (
            localStorage.getItem(
                "darkMode"
            ) === "true"
        ) {
            document.documentElement.classList.add(
                "darkMode"
            );
        }
    </script>


    <link
        rel="stylesheet"
        href="style.css"
    >


    <title>
        Programming Languages
    </title>

</head>


<body>


    <!-- BACK -->

    <a
        href="programming.html"
        class="backButton"
    >
        ↶
    </a>



    <!-- SETTINGS -->

    <button
        id="settingsButton"
        class="settingsButton"
    >

        <span id="settingsIcon">
            ⚙
        </span>

    </button>



    <!-- CONTENT -->

    <div class="container gradePage">


        <div class="subjectHeading">


            <span
                class="subjectSmallTitle"
                data-i18n="midDay"
            >
                Mid-Day
            </span>


            <h1
                data-i18n="programmingLanguages"
            >
                Programming Languages
            </h1>


            <p
                data-i18n="chooseLanguage"
            >
                Choose a programming language.
            </p>


        </div>



        <div class="gradeContainer">


            <a
                href="programmingGrades.html?language=python"
                class="gradeButton"
            >

                <span class="gradeNumber">
                    Py
                </span>

                <span
                    data-i18n="python"
                >
                    Python
                </span>

            </a>



            <a
                href="programmingGrades.html?language=java"
                class="gradeButton"
            >

                <span class="gradeNumber">
                    J
                </span>

                <span
                    data-i18n="java"
                >
                    Java
                </span>

            </a>



            <a
                href="programmingGrades.html?language=luau"
                class="gradeButton"
            >

                <span class="gradeNumber">
                    L
                </span>

                <span
                    data-i18n="luau"
                >
                    Luau
                </span>

            </a>


        </div>


    </div>



    <!-- SCRIPTS -->

    <script src="user.js"></script>

    <script src="language.js"></script>

    <script src="theme.js"></script>

    <script src="settings.js"></script>


</body>

</html>

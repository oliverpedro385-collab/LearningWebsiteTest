<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Maker Project</title>


    <script>
        if (
            localStorage.getItem("darkMode") === "true"
        ) {
            document.documentElement.classList.add("darkMode");
        }
    </script>


    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <a
        id="projectBackButton"
        href="makerProjects.html"
        class="backButton"
        aria-label="Back"
    >
        ↶
    </a>


    <button
        id="settingsButton"
        class="settingsButton"
        aria-label="Settings"
    >
        ⚙
    </button>



    <main class="container makerProjectPage">


        <!-- =================================================
             HEADER
             ================================================= -->

        <div class="makerProjectHeader">


            <div>


                <div
                    class="subjectEyebrow"
                    id="projectGrade"
                >
                    Grade 1
                </div>


                <h1 id="projectTitle">
                    Make a Light
                </h1>


                <p
                    id="projectDescription"
                    class="makerProjectDescription"
                >
                    Build a simple circuit that powers an LED.
                </p>


            </div>


        </div>



        <!-- =================================================
             PROJECT INFORMATION
             ================================================= -->

        <div class="makerInfoGrid">


            <section class="makerInstructionsCard">


                <h2 id="instructionsTitle">
                    How to build
                </h2>


                <ol
                    id="instructionList"
                    class="makerInstructions"
                ></ol>


                <div
                    id="projectTip"
                    class="makerTip"
                ></div>


            </section>



            <section class="makerPartsCard">


                <h2 id="requiredPartsTitle">
                    Required parts
                </h2>


                <div
                    id="requiredParts"
                    class="makerRequiredParts"
                ></div>


                <p
                    id="dragHint"
                    class="makerDragHint"
                ></p>


            </section>


        </div>



        <!-- =================================================
             SIMULATOR
             ================================================= -->

        <section class="makerSimulatorCard">


            <div class="makerToolbar">


                <button
                    id="testButton"
                    class="makerActionButton makerPrimaryAction"
                    type="button"
                >
                    Test Circuit
                </button>


                <button
                    id="wireButton"
                    class="makerActionButton"
                    type="button"
                >
                    Wire Mode
                </button>


                <button
                    id="deleteButton"
                    class="makerActionButton"
                    type="button"
                >
                    Remove Selected
                </button>


                <button
                    id="clearButton"
                    class="makerActionButton"
                    type="button"
                >
                    Clear Board
                </button>


            </div>



            <!-- STATUS -->

            <div
                id="makerStatus"
                class="makerStatus"
            >

                <span id="statusDot"></span>

                <span id="statusText">
                    Ready.
                </span>

            </div>



            <!-- WORKBENCH -->

            <div class="makerWorkbench">


                <!-- PALETTE -->

                <aside class="makerPalette">


                    <h3>
                        Parts
                    </h3>


                    <div
                        id="makerPalette"
                        class="makerPaletteList"
                    ></div>


                </aside>



                <!-- BOARD -->

                <div class="makerBoardWrapper">


                    <div
                        id="breadboard"
                        class="breadboard"
                    >


                        <div class="breadboardTitle">
                            PROTOBOARD
                        </div>


                        <div
                            class="breadboardRail railPositive"
                        >
                            +
                        </div>


                        <div
                            class="breadboardRail railNegative"
                        >
                            −
                        </div>


                        <div
                            id="breadboardLetters"
                            class="breadboardLetters"
                        ></div>


                        <div
                            id="breadboardNumbers"
                            class="breadboardNumbers"
                        ></div>


                        <div
                            id="breadboardHoles"
                            class="breadboardHoles"
                        ></div>


                        <svg
                            id="wireLayer"
                            class="wireLayer"
                        ></svg>


                        <div
                            id="componentLayer"
                            class="componentLayer"
                        ></div>


                    </div>


                </div>


            </div>


        </section>


    </main>



    <!-- =====================================================
         SCRIPTS
         ===================================================== -->

    <script src="user.js"></script>

    <script src="language.js"></script>

    <script src="theme.js"></script>

    <script src="settings.js"></script>

    <script src="makerData.js"></script>

    <script src="makerSimulator.js"></script>


</body>

</html>
